/* ---------- 炮塔：分层平台 + 机械炮塔 ---------- */
function towerTurretArt(def, recoil, t){
  const c = def.color;
  const arch = def.arch;
  const glow = t ? (1 + .18 * Math.sin((t.t || 0) * 6)) : 1;
  ctx.save();
  if (arch === 'pulse') {
    ctx.fillStyle = '#0a1424'; ctx.strokeStyle = rgba(c, .8); ctx.lineWidth = 1.2;
    rr(-10, -8, 15, 16, 3); ctx.fill(); ctx.stroke();
    for (let i = 0; i < 2; i++) {
      ctx.fillStyle = 'rgba(8,16,28,.95)'; ctx.strokeStyle = rgba(c, .75);
      rr(3, -6 + i * 8, 20 - recoil * 4, 4.5, 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = rgba('#ffffff', .75);
      rr(20 - recoil * 4, -5 + i * 8, 4, 2.5, 1); ctx.fill();
    }
    ctx.fillStyle = rgba(c, .9); ctx.beginPath(); ctx.arc(-7, 0, 4, 0, TAU); ctx.fill();
    ctx.strokeStyle = rgba('#ffffff', .5); ctx.beginPath(); ctx.arc(-7, 0, 6.5, 0, TAU); ctx.stroke();
  } else if (arch === 'flame') {
    ctx.fillStyle = '#160b08'; ctx.strokeStyle = rgba(c, .85); ctx.lineWidth = 1.2;
    rr(-12, -9, 13, 8, 3); ctx.fill(); ctx.stroke();
    rr(-12, 1, 13, 8, 3); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#24100b'; rr(0, -4.5, 19, 9, 3); ctx.fill();
    ctx.strokeStyle = rgba('#ffcf7a', .85); ctx.stroke();
    ctx.fillStyle = rgba('#ffcf7a', .9 * glow);
    ctx.beginPath(); ctx.moveTo(19, -4); ctx.quadraticCurveTo(26 + recoil * 3, 0, 19, 4); ctx.closePath(); ctx.fill();
    ctx.fillStyle = rgba('#ff5a2a', .8); ctx.beginPath(); ctx.arc(-6, 0, 3.5, 0, TAU); ctx.fill();
  } else if (arch === 'frost') {
    ctx.fillStyle = '#0a1824'; ctx.strokeStyle = rgba(c, .85); ctx.lineWidth = 1.1;
    rr(-8, -7, 14, 14, 4); ctx.fill(); ctx.stroke();
    for (let i = 0; i < 3; i++) {
      const a = -0.8 + i * .8;
      ctx.save(); ctx.rotate(a);
      ctx.fillStyle = rgba(c, .72); ctx.strokeStyle = '#ffffff';
      ctx.beginPath(); ctx.moveTo(4, 0); ctx.lineTo(17 + recoil * 2, -4); ctx.lineTo(23, 0); ctx.lineTo(17 + recoil * 2, 4); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.restore();
    }
    ctx.fillStyle = rgba('#ffffff', .9); ctx.beginPath(); ctx.arc(0, 0, 3.6, 0, TAU); ctx.fill();
  } else if (arch === 'storm') {
    ctx.strokeStyle = rgba(c, .9); ctx.lineWidth = 1.4;
    for (let i = 0; i < 3; i++) {
      ctx.beginPath(); ctx.arc(2, 0, 6 + i * 4, -1.0, 1.0); ctx.stroke();
    }
    ctx.fillStyle = rgba(c, .18); ctx.beginPath(); ctx.arc(2, 0, 10, 0, TAU); ctx.fill();
    ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(2, 0, 3.4, 0, TAU); ctx.fill();
    ctx.strokeStyle = rgba('#ffffff', .8); ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(2, -3); ctx.lineTo(10, -9); ctx.lineTo(8, 1); ctx.stroke();
    ctx.fillStyle = rgba(c, .8); ctx.fillRect(-12, -2, 5, 4);
  } else if (arch === 'mortar') {
    ctx.fillStyle = '#1a0f09'; ctx.strokeStyle = rgba(c, .8); ctx.lineWidth = 1.2;
    rr(-10, -8, 20, 16, 4); ctx.fill(); ctx.stroke();
    ctx.save(); ctx.rotate(-.45);
    ctx.fillStyle = '#2a160c'; rr(-6, -6, 27, 12, 5); ctx.fill();
    ctx.strokeStyle = rgba(c, .9); ctx.stroke();
    ctx.fillStyle = '#070403'; ctx.beginPath(); ctx.ellipse(21, 0, 4, 6, 0, 0, TAU); ctx.fill();
    ctx.restore();
  } else if (arch === 'beam') {
    ctx.fillStyle = '#0a1422'; ctx.strokeStyle = rgba(c, .8); ctx.lineWidth = 1.2;
    rr(-12, -6, 24, 12, 4); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#101e30'; rr(6, -9, 10, 18, 3); ctx.fill();
    ctx.strokeStyle = rgba(c, .9); ctx.stroke();
    ctx.fillStyle = rgba(c, .9 * glow);
    ctx.beginPath(); ctx.arc(20, 0, 3.2, 0, TAU); ctx.fill();
    ctx.strokeStyle = rgba('#ffffff', .6); ctx.beginPath(); ctx.arc(20, 0, 5.5, 0, TAU); ctx.stroke();
    for (let i = 0; i < 3; i++) {
      ctx.strokeStyle = rgba(c, .4); ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(-10, -8 + i * 8); ctx.lineTo(-2, -8 + i * 8); ctx.stroke();
    }
  } else if (arch === 'rail') {
    ctx.fillStyle = '#0a1622'; ctx.strokeStyle = rgba(c, .8); ctx.lineWidth = 1.2;
    rr(-14, -5, 22, 10, 3); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#162536'; rr(2, -3.5, 28 - recoil * 3, 7, 2); ctx.fill();
    ctx.strokeStyle = rgba(c, .9); ctx.stroke();
    ctx.fillStyle = rgba(c, .7); ctx.fillRect(8, -1.2, 19 - recoil * 3, 2.4);
    ctx.strokeStyle = rgba('#ffffff', .5); ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, -8); ctx.lineTo(0, 8); ctx.stroke();
    ctx.fillStyle = rgba(c, .85); ctx.fillRect(-16, -8, 4, 16);
  } else if (arch === 'nova') {
    ctx.strokeStyle = rgba(c, .55); ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.arc(0, 0, 12, 0, TAU); ctx.stroke();
    for (let i = 0; i < 4; i++) {
      const a = i / 4 * TAU + (t ? t.t : 0) * .4;
      ctx.save(); ctx.rotate(a);
      ctx.fillStyle = rgba(c, .7);
      ctx.beginPath(); ctx.moveTo(5, 0); ctx.lineTo(14, -3); ctx.lineTo(17, 0); ctx.lineTo(14, 3); ctx.closePath(); ctx.fill();
      ctx.restore();
    }
    ctx.fillStyle = rgba('#ffffff', .95); ctx.beginPath(); ctx.arc(0, 0, 4.5, 0, TAU); ctx.fill();
    ctx.fillStyle = rgba(c, .35); ctx.beginPath(); ctx.arc(0, 0, 8, 0, TAU); ctx.fill();
  } else if (arch === 'gravity') {
    ctx.strokeStyle = rgba(c, .7); ctx.lineWidth = 1.3;
    for (let i = 0; i < 3; i++) {
      ctx.save(); ctx.rotate(i * 1.15 + (t ? t.t : 0) * .5);
      ctx.beginPath(); ctx.ellipse(0, 0, 11 + i * 4, 5 + i * 2, 0, 0, TAU); ctx.stroke();
      ctx.restore();
    }
    ctx.fillStyle = '#050309'; ctx.beginPath(); ctx.arc(0, 0, 7, 0, TAU); ctx.fill();
    ctx.strokeStyle = rgba('#ffffff', .65); ctx.beginPath(); ctx.arc(0, 0, 7, 0, TAU); ctx.stroke();
    ctx.fillStyle = rgba(c, .9); ctx.beginPath(); ctx.arc(2, 0, 2, 0, TAU); ctx.fill();
  } else if (arch === 'drone') {
    ctx.strokeStyle = rgba(c, .3); ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(0, 0, 15, 0, TAU); ctx.stroke();
    for (let i = 0; i < 3; i++) {
      const a = (t ? t.t : 0) * .8 + i / 3 * TAU;
      const dx = Math.cos(a) * 12, dy = Math.sin(a) * 12;
      ctx.fillStyle = rgba(c, .85); poly(dx, dy, 4, 4, a); ctx.fill();
      ctx.strokeStyle = rgba('#ffffff', .5); ctx.stroke();
      ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(dx + 1, dy, 1, 0, TAU); ctx.fill();
    }
    ctx.fillStyle = rgba(c, .25); ctx.beginPath(); ctx.arc(0, 0, 5, 0, TAU); ctx.fill();
  } else if (arch === 'support') {
    ctx.fillStyle = 'rgba(12,24,40,.95)'; ctx.strokeStyle = rgba(c, .8); ctx.lineWidth = 1.2;
    poly(0, 0, 11, 4, Math.PI / 4); ctx.fill(); ctx.stroke();
    ctx.fillStyle = rgba(c, .55); ctx.beginPath(); ctx.arc(0, 0, 4, 0, TAU); ctx.fill();
    for (let i = 0; i < 4; i++) {
      const a = i / 4 * TAU + (t ? t.t : 0) * .3;
      ctx.strokeStyle = rgba(c, .35); ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(Math.cos(a) * 7, Math.sin(a) * 7); ctx.lineTo(Math.cos(a) * 16, Math.sin(a) * 16); ctx.stroke();
    }
  } else if (arch === 'acid') {
    ctx.fillStyle = '#101c0c'; ctx.strokeStyle = rgba(c, .8); ctx.lineWidth = 1.2;
    rr(-12, -7, 12, 14, 5); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#1a2810'; rr(0, -4, 19, 8, 3); ctx.fill();
    ctx.strokeStyle = rgba(c, .9); ctx.stroke();
    ctx.fillStyle = rgba(c, .8); ctx.beginPath(); ctx.arc(19, 0, 3, 0, TAU); ctx.fill();
    ctx.fillStyle = rgba(c, .35); ctx.beginPath(); ctx.arc(-6, 0, 4, 0, TAU); ctx.fill();
    ctx.strokeStyle = rgba('#ffffff', .3); ctx.beginPath(); ctx.arc(-6, 0, 5, 0, TAU); ctx.stroke();
  } else if (arch === 'hybrid') {
    ctx.strokeStyle = rgba(c, .8); ctx.lineWidth = 1.5;
    for (let i = 0; i < 3; i++) {
      ctx.save(); ctx.rotate(i / 3 * TAU + (t ? t.t : 0) * .5);
      ctx.fillStyle = rgba(c, .6);
      ctx.beginPath(); ctx.moveTo(6, -2); ctx.lineTo(20 - recoil * 2, 0); ctx.lineTo(6, 2); ctx.closePath(); ctx.fill();
      ctx.restore();
    }
    ctx.fillStyle = '#1a1408'; ctx.beginPath(); ctx.arc(0, 0, 8, 0, TAU); ctx.fill();
    ctx.strokeStyle = rgba(c, .9); ctx.stroke();
    ctx.fillStyle = rgba('#fff0c0', .95); ctx.beginPath(); ctx.arc(0, 0, 3.5, 0, TAU); ctx.fill();
  } else {
    ctx.fillStyle = rgba(c, .8); rr(-6, -6, 18, 12, 4); ctx.fill();
  }
  ctx.restore();
}

function drawTowerEmblem(ti, cx, cy, s, aim){
  const def = TOWERS[ti];
  if (!def) return;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(s, s);
  ctx.fillStyle = 'rgba(6,12,22,.85)';
  ctx.strokeStyle = rgba(def.color, .5);
  ctx.lineWidth = 1.2;
  poly(0, 0, 19, 6, Math.PI / 6); ctx.fill(); ctx.stroke();
  poly(0, 0, 14, 6, Math.PI / 6); ctx.strokeStyle = rgba(def.color, .18); ctx.stroke();
  ctx.rotate(aim == null ? -0.35 : aim);
  towerTurretArt(def, 0, null);
  ctx.restore();
}

function drawTower(t){
  const g = game;
  const c = t.type.color;
  const x = t.x, y = t.y, lv = t.level;
  const sel = g.selectedTower === t;
  if (sel) drawRange(t, towerStats(t).range);
  if (t.type.arch === 'support') {
    const r = towerStats(t).range;
    ctx.save();
    ctx.strokeStyle = rgba(c, .16); ctx.lineWidth = 1.1; ctx.setLineDash([3, 9]);
    ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = rgba(c, .035); ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
    ctx.restore();
  }
  ctx.save();
  ctx.translate(x, y);
  if (t.disabledT > 0 && Math.floor(t.disabledT * 12) % 2 === 0) ctx.globalAlpha = .45;

  /* 投影 */
  ctx.fillStyle = 'rgba(0,0,0,.4)';
  ctx.beginPath(); ctx.ellipse(2, 10, 24, 12, 0, 0, TAU); ctx.fill();

  /* 平台 */
  poly(0, 0, 23, 6, Math.PI / 6);
  ctx.fillStyle = '#0a1322'; ctx.fill();
  ctx.strokeStyle = rgba(c, .85); ctx.lineWidth = 1.6; ctx.stroke();
  poly(0, 0, 17, 6, Math.PI / 6);
  ctx.fillStyle = '#101d30'; ctx.fill();
  ctx.strokeStyle = rgba(c, .25); ctx.lineWidth = 1; ctx.stroke();
  ctx.strokeStyle = rgba(c, .55); ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(0, 0, 27, .3, 1.2); ctx.stroke();
  ctx.beginPath(); ctx.arc(0, 0, 27, Math.PI + .3, Math.PI + 1.2); ctx.stroke();
  for (let i = 0; i < 6; i++) {
    const a = i / 6 * TAU + Math.PI / 6;
    ctx.fillStyle = rgba(c, .55);
    ctx.beginPath(); ctx.arc(Math.cos(a) * 20, Math.sin(a) * 20, 1.4, 0, TAU); ctx.fill();
  }
  ctx.fillStyle = rgba(c, .12);
  ctx.beginPath(); ctx.arc(0, 0, 12, 0, TAU); ctx.fill();

  /* 炮塔 */
  ctx.save();
  ctx.rotate(t.aim);
  towerTurretArt(t.type, t.recoil || 0, t);
  ctx.restore();

  /* 等级宝石 */
  for (let i = 0; i < 5; i++) {
    ctx.fillStyle = i < lv ? c : 'rgba(255,255,255,.13)';
    ctx.beginPath(); ctx.arc(-10 + i * 5, 30, 1.7, 0, TAU); ctx.fill();
  }
  if (t.branch) {
    ctx.save(); ctx.rotate(Math.PI / 4);
    ctx.fillStyle = '#ffd166'; ctx.fillRect(-2.6, -22, 5.2, 5.2);
    ctx.strokeStyle = 'rgba(255,240,190,.7)'; ctx.lineWidth = .8; ctx.strokeRect(-2.6, -22, 5.2, 5.2);
    ctx.restore();
  }
  if (t.disabledT > 0) txt('干扰', 0, -34, 8, '#ff7ac8', 'center', 700);
  ctx.restore();

  if (sel) {
    ctx.save();
    ctx.strokeStyle = rgba(c, .8); ctx.lineWidth = 1.2; ctx.setLineDash([4, 6]);
    ctx.beginPath(); ctx.arc(x, y, 32 + Math.sin(g.clock * 3) * 2, 0, TAU); ctx.stroke();
    ctx.setLineDash([]); ctx.restore();
  }
}

  weaver:    { kind: 'demon',  wings: 2, legs: 2, horns: 2, eyes: 3, crown: true },
  apex:      { kind: 'demon',  wings: 4, legs: 2, horns: 3, eyes: 4, armor: true },
  sovereign: { kind: 'sovereign', wings: 6, legs: 2, horns: 3, eyes: 5, boss: true, crown: true }
};
function artLook(e){ return ART_LOOKS[e.key] || { kind: 'insect', legs: 4, eyes: 2 }; }

function drawEnemy(e){
  if (e.dead) return;
  const L = artLook(e);
  const r = e.boss ? e.r : e.r * 1.15;
  ctx.save();
  ctx.translate(e.x, e.y);
  if (L.boss) {
    const gr = ctx.createRadialGradient(0, 0, r * .3, 0, 0, r * 2.6);
    gr.addColorStop(0, rgba(e.color, .25)); gr.addColorStop(1, rgba(e.color, 0));
    ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(0, 0, r * 2.6, 0, TAU); ctx.fill();
  }
  if (e.phased) ctx.globalAlpha = .28;
  ctx.rotate(e.angle);
  ctx.translate(0, Math.sin(e.t * 5) * 1.2);
  ctx.fillStyle = 'rgba(0,0,0,.3)';
  ctx.beginPath(); ctx.ellipse(0, r * .8, r * 1.1, r * .4, 0, 0, TAU); ctx.fill();

  if (L.boss) drawBossBody(e, r);
  else drawCreatureBody(e, r, L);

  if (e.hitFlash > 0) {
    ctx.fillStyle = 'rgba(255,255,255,' + (e.hitFlash * .45) + ')';
    ctx.beginPath(); ctx.arc(0, 0, r + 2, 0, TAU); ctx.fill();
  }
  ctx.restore();

  /* 非旋转层：精英环 / 状态 / 血条 */
  ctx.save();
  ctx.translate(e.x, e.y);
  if (e.elite) {
    ctx.strokeStyle = rgba(e.elite.color, .9); ctx.lineWidth = 1.8;
    ctx.setLineDash([4, 5]);
    ctx.beginPath(); ctx.arc(0, 0, r + 7, e.t * .8, e.t * .8 + TAU); ctx.stroke();
    ctx.setLineDash([]);
  }
  if (e.shield > 0) {
    ctx.strokeStyle = rgba('#c58bff', .55 + .2 * Math.sin(e.t * 4)); ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.arc(0, 0, r + 10, 0, TAU); ctx.stroke();
  }
  if (e.slowT > 0) {
    ctx.strokeStyle = 'rgba(160,230,255,.5)'; ctx.lineWidth = 1.1;
    ctx.beginPath(); ctx.arc(0, 0, r + 5, 0, TAU); ctx.stroke();
  }
  if (e.phased) {
    ctx.strokeStyle = 'rgba(200,180,255,.5)'; ctx.setLineDash([3, 6]);
    ctx.beginPath(); ctx.arc(0, 0, r + 13, 0, TAU); ctx.stroke(); ctx.setLineDash([]);
  }
  if (e.boss) drawBossBadge(e, r);
  else {
    const frac = clamp(e.hp / e.maxHp, 0, 1);
    const w = Math.max(24, r * 2.5);
    if (frac < 1 || e.elite) {
      ctx.fillStyle = 'rgba(3,6,12,.82)'; rr(-w / 2, -r - 14, w, 4, 2); ctx.fill();
      ctx.fillStyle = frac > .5 ? '#7ee66f' : frac > .22 ? '#ffd166' : '#ff5a6e';
      rr(-w / 2, -r - 14, Math.max(2, w * frac), 4, 2); ctx.fill();
      if (e.shield > 0) {
        ctx.fillStyle = rgba('#c58bff', .8);
        rr(-w / 2, -r - 18, w * clamp(e.shield / e.maxShield, 0, 1), 2, 1); ctx.fill();
      }
    }
    if (e.elite) txt(e.elite.name, 0, -r - 24, 7, e.elite.color, 'center', 700);
  }
  ctx.restore();
}

function drawLegs(r, n, c, up){
  ctx.strokeStyle = rgba(c, .85); ctx.lineWidth = Math.max(1, r * .075); ctx.lineCap = 'round';
  for (let i = 0; i < n; i++) {
    const side = i % 2 ? 1 : -1;
    const bx = -r * .5 + Math.floor(i / 2) * r * .42;
    const swing = Math.sin((up || 0) * 7 + i) * r * .07;
    ctx.beginPath();
    ctx.moveTo(bx, side * r * .45);
    ctx.lineTo(bx + r * .15, side * r * .95);
    ctx.lineTo(bx + r * .38, side * r * 1.12 + swing);
    ctx.stroke();
  }
}

function drawWings(r, c, up, n){
  for (let s = -1; s <= 1; s += 2) {
    const flap = Math.sin((up || 0) * 8 + (s > 0 ? .5 : 0)) * r * .18;
    ctx.save(); ctx.scale(1, s);
    ctx.fillStyle = rgba(c, .22); ctx.strokeStyle = rgba(c, .8); ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(-r * .2, r * .1);
    ctx.quadraticCurveTo(-r * .8, -r * .5 + flap, -r * 1.7, -r * .15 + flap);
    ctx.quadraticCurveTo(-r * 1.2, r * .2, -r * .9, r * .75);
    ctx.quadraticCurveTo(-r * .6, r * .3, -r * .2, r * .35);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    for (let i = 0; i < 3; i++) {
      ctx.strokeStyle = rgba(c, .35); ctx.lineWidth = .8;
      ctx.beginPath(); ctx.moveTo(-r * .35, r * .2); ctx.lineTo(-r * (1.1 + i * .12), -r * .05 + flap + i * r * .15); ctx.stroke();
    }
    ctx.restore();
  }
}

function drawHorns(r, c, n, kind){
  if (!n) return;
  ctx.strokeStyle = kind === 'crown' ? '#ffd166' : 'rgba(255,235,210,.9)';
  ctx.lineWidth = Math.max(1.2, r * .09);
  for (let i = 0; i < n; i++) {
    const ox = (i - (n - 1) / 2) * r * .3;
    ctx.beginPath();
    ctx.moveTo(ox - r * .08, -r * .55);
    if (kind === 'crown') {
      ctx.lineTo(ox, -r * 1.15); ctx.lineTo(ox + r * .08, -r * .55);
    } else {
      ctx.quadraticCurveTo(ox - r * .35, -r * .95, ox + r * .18, -r * 1.05);
      ctx.quadraticCurveTo(ox + r * .02, -r * .8, ox + r * .08, -r * .55);
    }
    ctx.closePath(); ctx.fillStyle = ctx.strokeStyle; ctx.fill(); ctx.stroke();
  }
}

function drawHead(r, c, L, offX, offY, scale){
  const s = scale || 1;
  ctx.save(); ctx.translate(offX, offY);
  ctx.fillStyle = rgba(c, .95); ctx.strokeStyle = rgba('#ffffff', .35); ctx.lineWidth = 1;
  ctx.beginPath(); ctx.ellipse(r * .12, 0, r * .52 * s, r * .44 * s, 0, 0, TAU); ctx.fill(); ctx.stroke();
  if (L.kind === 'hound') {
    ctx.fillStyle = rgba(c, .95);
    ctx.beginPath(); ctx.ellipse(r * .5 * s, r * .02, r * .3 * s, r * .2 * s, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#150407';
    ctx.beginPath(); ctx.moveTo(r * .55 * s, r * .04); ctx.lineTo(r * .85 * s, 0); ctx.lineTo(r * .55 * s, -r * .04); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#fff2d0';
    ctx.beginPath(); ctx.moveTo(r * .52 * s, r * .12); ctx.lineTo(r * .6 * s, r * .22); ctx.lineTo(r * .66 * s, r * .1); ctx.closePath(); ctx.fill();
  }
  if (L.kind === 'bat' || L.kind === 'demon' || L.kind === 'sovereign') {
    ctx.fillStyle = '#100208';
    ctx.beginPath(); ctx.moveTo(r * .35 * s, r * .2); ctx.lineTo(r * .6 * s, r * .45 * s); ctx.lineTo(r * .8 * s, r * .18); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#fff2d0';
    ctx.beginPath(); ctx.moveTo(r * .42 * s, r * .17); ctx.lineTo(r * .48 * s, r * .34); ctx.lineTo(r * .54 * s, r * .16); ctx.closePath(); ctx.fill();
  }
  const eyes = L.eyes || 2;
  for (let i = 0; i < Math.min(3, eyes); i++) {
    const ex = r * (.08 + (i - Math.min(2, eyes - 1) / 2) * .13) * s;
    ctx.fillStyle = L.boss ? '#ffd166' : '#ff5a5a';
    ctx.beginPath(); ctx.arc(ex, -r * .08, Math.max(1.3, r * .07), 0, TAU); ctx.fill();
    ctx.fillStyle = '#140208';
    ctx.beginPath(); ctx.arc(ex + .5, -r * .08, Math.max(.6, r * .03), 0, TAU); ctx.fill();
  }
  drawHorns(r * .8, c, L.horns === 3 ? 3 : (L.horns ? 1 : 0), L.crown ? 'crown' : 'curved');
  ctx.restore();
}

function drawCreatureBody(e, r, L){
  const c = e.color;
  const up = e.t;
  if (L.wings) drawWings(r, c, up, L.wings);
  if (L.legs) drawLegs(r, L.legs, c, up);

  /* 身体 */
  const gr = ctx.createRadialGradient(-r * .2, -r * .25, r * .1, 0, 0, r * 1.2);
  gr.addColorStop(0, rgba('#ffffff', .22));
  gr.addColorStop(.3, rgba(c, .95));
  gr.addColorStop(1, rgba(c, .5));
  ctx.fillStyle = gr;
  ctx.strokeStyle = rgba('#ffffff', .28); ctx.lineWidth = 1;
  if (L.kind === 'spider') {
    ctx.beginPath(); ctx.ellipse(-r * .45, 0, r * .9, r * .72, 0, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.fillStyle = rgba(c, .75);
    ctx.beginPath(); ctx.ellipse(-r * .85, 0, r * .55, r * .5, 0, 0, TAU); ctx.fill();
  } else if (L.kind === 'wraith') {
    ctx.beginPath();
    ctx.moveTo(-r * .9, -r * .5);
    ctx.quadraticCurveTo(0, -r * .95, r * .8, -r * .35);
    ctx.lineTo(r * .55, r * .65);
    for (let i = 0; i < 4; i++) ctx.lineTo(r * .4 - i * r * .3, r * (.45 + (i % 2) * .2));
    ctx.closePath(); ctx.fill(); ctx.stroke();
  } else {
    ctx.beginPath(); ctx.ellipse(0, 0, r * 1.05, r * .7, 0, 0, TAU); ctx.fill(); ctx.stroke();
  }

  if (L.spikes) {
    ctx.strokeStyle = rgba(c, .9); ctx.lineWidth = Math.max(1, r * .07);
    for (let i = 0; i < 5; i++) {
      const x = -r * .6 + i * r * .3;
      ctx.beginPath(); ctx.moveTo(x, -r * .55); ctx.lineTo(x + r * .08, -r * .95); ctx.stroke();
    }
  }
  if (L.armor) {
    ctx.fillStyle = 'rgba(10,16,24,.72)';
    ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.lineWidth = 1;
    for (let i = 0; i < 3; i++) {
      ctx.beginPath(); ctx.ellipse(-r * .45 + i * r * .42, -r * .15, r * .22, r * .34, -.2, 0, TAU); ctx.fill(); ctx.stroke();
    }
  }
  if (L.tail) {
    ctx.strokeStyle = rgba(c, .8); ctx.lineWidth = Math.max(1.2, r * .09); ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-r * .95, r * .1); ctx.quadraticCurveTo(-r * 1.6, r * .2, -r * 1.4, -r * .5); ctx.stroke();
    ctx.fillStyle = rgba(c, .7);
    ctx.beginPath(); ctx.moveTo(-r * 1.4, -r * .5); ctx.lineTo(-r * 1.65, -r * .8); ctx.lineTo(-r * 1.3, -r * .8); ctx.closePath(); ctx.fill();
  }
  if (L.mane) {
    ctx.fillStyle = rgba(c, .35);
    for (let i = 0; i < 7; i++) {
      const a = -Math.PI * .8 + i / 6 * Math.PI * .9;
      ctx.beginPath(); ctx.moveTo(r * .3, 0); ctx.lineTo(r * .3 + Math.cos(a) * r * .55, Math.sin(a) * r * .55); ctx.lineTo(r * .15, Math.sin(a) * r * .2); ctx.closePath(); ctx.fill();
    }
  }

  /* 头 */
  if (L.kind === 'insect') {
    ctx.fillStyle = rgba(c, .9); ctx.strokeStyle = rgba('#ffffff', .3);
    ctx.beginPath(); ctx.arc(r * .55, 0, r * .42, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = rgba(c, .9); ctx.lineWidth = Math.max(1, r * .08);
    for (let s = -1; s <= 1; s += 2) {
      ctx.beginPath(); ctx.moveTo(r * .7, s * r * .18); ctx.quadraticCurveTo(r * 1.1, s * r * .35, r * 1.15, s * r * .05); ctx.stroke();
    }
    ctx.fillStyle = '#1a0508';
    ctx.beginPath(); ctx.arc(r * .52, -r * .12, r * .07, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(r * .68, -r * .12, r * .07, 0, TAU); ctx.fill();
  } else if (L.kind === 'machine') {
    ctx.fillStyle = '#111c26'; ctx.strokeStyle = rgba(c, .85); ctx.lineWidth = 1.3;
    rr(r * .25, -r * .45, r * .7, r * .9, 4); ctx.fill(); ctx.stroke();
    ctx.fillStyle = rgba(c, .9); ctx.beginPath(); ctx.arc(r * .6, 0, r * .16, 0, TAU); ctx.fill();
    ctx.strokeStyle = rgba('#ffffff', .8); ctx.beginPath(); ctx.arc(r * .6, 0, r * .24, 0, TAU); ctx.stroke();
    ctx.strokeStyle = rgba(c, .7); ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(r * .45, -r * .45); ctx.lineTo(r * .55, -r * .8); ctx.stroke();
    ctx.fillStyle = rgba('#ff5a5a', .9); ctx.beginPath(); ctx.arc(r * .55, -r * .82, 1.6, 0, TAU); ctx.fill();
  } else if (L.kind === 'crystal') {
    ctx.fillStyle = rgba(c, .55); ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.1;
    for (let i = 0; i < 5; i++) {
      const a = i / 5 * TAU + up * .2;
      ctx.save(); ctx.rotate(a);
      ctx.beginPath(); ctx.moveTo(r * .5, 0); ctx.lineTo(r * 1.15, -r * .16); ctx.lineTo(r * 1.3, 0); ctx.lineTo(r * 1.15, r * .16); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.restore();
    }
    ctx.fillStyle = rgba('#ffffff', .9); ctx.beginPath(); ctx.arc(0, 0, r * .2, 0, TAU); ctx.fill();
  } else {
    drawHead(r, c, L, r * .35, 0, 1);
  }

  /* 火焰/病毒光晕 */
  if (e.key === 'pyro' || e.key === 'cinder' || e.key === 'magma') {
    ctx.fillStyle = rgba('#ff8a3a', .16 + .06 * Math.sin(up * 9));
    ctx.beginPath(); ctx.arc(0, 0, r * 1.4, 0, TAU); ctx.fill();
  }
  if (e.key === 'frostling' || e.key === 'wraith' || e.key === 'zero') {
    ctx.fillStyle = rgba('#bff7ff', .08);
    ctx.beginPath(); ctx.arc(0, 0, r * 1.5, 0, TAU); ctx.fill();
  }
}

/* ---------- Boss 专属造型 ---------- */
function drawBossBody(e, r){
  const L = artLook(e);
  const c = e.color;
  const up = e.t;
  if (L.wings) drawWings(r * 1.15, c, up, L.wings);
  if (L.legs) drawLegs(r, L.legs, c, up);

  if (L.kind === 'hound') {
    /* 三头地狱犬：三颗头 + 燃烧鬃毛 + 獠牙 */
    ctx.fillStyle = 'rgba(255,120,40,.16)';
    ctx.beginPath(); ctx.arc(0, 0, r * 1.8, 0, TAU); ctx.fill();
    /* 尾巴 */
    ctx.strokeStyle = rgba('#ff8a3a', .85); ctx.lineWidth = Math.max(2, r * .08);
    ctx.beginPath();
    ctx.moveTo(-r * .9, r * .25);
    ctx.quadraticCurveTo(-r * 1.6, r * .1, -r * 1.75, -r * .45);
    ctx.stroke();
    /* 躯干 */
    const gr = ctx.createRadialGradient(-r * .2, -r * .2, r * .2, 0, 0, r);
    gr.addColorStop(0, '#4a1208'); gr.addColorStop(.6, rgba(c, .9)); gr.addColorStop(1, '#120304');
    ctx.fillStyle = gr; ctx.strokeStyle = rgba('#ffb066', .8); ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.ellipse(-r * .12, r * .18, r * 1.12, r * .7, 0, 0, TAU); ctx.fill(); ctx.stroke();
    /* 背甲 */
    ctx.fillStyle = 'rgba(20,6,4,.55)'; ctx.strokeStyle = 'rgba(255,160,90,.45)'; ctx.lineWidth = 1;
    poly(-r * .2, r * .12, r * .55, 6, Math.PI / 2); ctx.fill(); ctx.stroke();
    /* 燃烧鬃毛（短，不遮头） */
    ctx.fillStyle = 'rgba(255,110,40,.32)';
    for (let i = 0; i < 9; i++) {
      const a = -Math.PI * .78 + i / 8 * Math.PI * .56;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * r * .72, Math.sin(a) * r * .72);
      ctx.lineTo(Math.cos(a) * r * (1.18 + (i % 2) * .12), Math.sin(a) * r * (1.18 + (i % 2) * .12));
      ctx.lineTo(Math.cos(a + .1) * r * .78, Math.sin(a + .1) * r * .78);
      ctx.closePath(); ctx.fill();
    }
    /* 三条脖子 */
    for (let i = -1; i <= 1; i++) {
      ctx.strokeStyle = 'rgba(40,10,6,.9)'; ctx.lineWidth = r * .3;
      ctx.beginPath();
      ctx.moveTo(i * r * .34, r * .1);
      ctx.quadraticCurveTo(i * r * .55, -r * .22, i * r * .66, -r * .45);
      ctx.stroke();
    }
    /* 三颗犬首 */
    for (let i = -1; i <= 1; i++) {
      drawHead(r * .68, c, { kind: 'hound', eyes: 2, horns: 2 }, i * r * .64, -r * .58 + Math.abs(i) * r * .04, 1);
    }
    /* 中央头冠 */
    ctx.strokeStyle = '#ffd166'; ctx.lineWidth = Math.max(1.4, r * .05);
    for (let i = -1; i <= 1; i++) {
      ctx.beginPath();
      ctx.moveTo(i * r * .2, -r * 1.15);
      ctx.lineTo(i * r * .26, -r * 1.42);
      ctx.lineTo(i * r * .32, -r * 1.15);
      ctx.stroke();
    }
    /* 胸口余烬 */
    ctx.fillStyle = 'rgba(255,180,80,.8)';
    for (let i = 0; i < 5; i++) {
      ctx.beginPath(); ctx.arc((i - 2) * r * .18, r * .1, r * .035, 0, TAU); ctx.fill();
    }
  } else if (L.kind === 'wraith') {
    /* 冰冠幽灵 */
    ctx.fillStyle = rgba('#bff7ff', .1);
    ctx.beginPath(); ctx.arc(0, 0, r * 1.6, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(8,20,30,.85)'; ctx.strokeStyle = rgba('#bff7ff', .8); ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(-r * .9, r * .2); ctx.quadraticCurveTo(-r * .8, -r * 1.1, 0, -r * 1.05);
    ctx.quadraticCurveTo(r * .8, -r * 1.0, r * .8, r * .1);
    for (let i = 0; i < 5; i++) ctx.lineTo(r * .7 - i * r * .28, r * (.7 + (i % 2) * .25));
    ctx.closePath(); ctx.fill(); ctx.stroke();
    for (let i = 0; i < 7; i++) {
      const a = -Math.PI * .85 + i / 6 * Math.PI * .7;
      ctx.fillStyle = rgba('#d8f4ff', .8);
      ctx.beginPath(); ctx.moveTo(Math.cos(a) * r * .35, Math.sin(a) * r * .35);
      ctx.lineTo(Math.cos(a) * r * 1.35, Math.sin(a) * r * 1.35);
      ctx.lineTo(Math.cos(a + .08) * r * .5, Math.sin(a + .08) * r * .5); ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle = '#eaffff'; ctx.beginPath(); ctx.arc(0, -r * .15, r * .18, 0, TAU); ctx.fill();
    for (let i = -1; i <= 1; i++) {
      ctx.fillStyle = i === 0 ? '#ffffff' : '#8ff0ff';
      ctx.beginPath(); ctx.arc(i * r * .25, -r * .22, r * .055, 0, TAU); ctx.fill();
    }
  } else if (L.kind === 'spider') {
    /* 虫巢女皇 */
    ctx.strokeStyle = rgba(c, .8); ctx.lineWidth = Math.max(1.6, r * .07);
    for (let i = 0; i < 8; i++) {
      const a = i / 8 * TAU + Math.sin(up * 2 + i) * .08;
      const sx = Math.cos(a) * r * .5, sy = Math.sin(a) * r * .5;
      ctx.beginPath(); ctx.moveTo(sx, sy);
      ctx.quadraticCurveTo(Math.cos(a) * r * 1.2, Math.sin(a) * r * 1.2, Math.cos(a) * r * 1.8, Math.sin(a) * r * 1.5);
      ctx.stroke();
    }
    const gr = ctx.createRadialGradient(-r * .3, -r * .2, r * .1, 0, 0, r);
    gr.addColorStop(0, '#2a0f3a'); gr.addColorStop(.6, rgba(c, .8)); gr.addColorStop(1, '#0a0310');
    ctx.fillStyle = gr; ctx.strokeStyle = rgba(c, .85); ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.ellipse(-r * .35, 0, r * 1.0, r * .75, 0, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.fillStyle = rgba('#7ee6c0', .55);
    ctx.beginPath(); ctx.ellipse(-r * .95, 0, r * .45, r * .38, 0, 0, TAU); ctx.fill();
    for (let i = -1; i <= 1; i++) {
      ctx.fillStyle = '#ffd166'; ctx.beginPath(); ctx.arc(r * .55, i * r * .18, r * .06, 0, TAU); ctx.fill();
    }
    ctx.strokeStyle = rgba(c, .9); ctx.lineWidth = 2;
    for (let s = -1; s <= 1; s += 2) {
      ctx.beginPath(); ctx.moveTo(r * .62, s * r * .12); ctx.lineTo(r * 1.15, s * r * .35); ctx.stroke();
    }
  } else if (L.kind === 'machine' || L.kind === 'brain') {
    /* 轨道哨兵 / 机械主脑 */
    ctx.strokeStyle = rgba(c, .5); ctx.lineWidth = 1.4;
    for (let i = 0; i < 3; i++) {
      ctx.save(); ctx.rotate(up * (.2 + i * .08) + i);
      ctx.beginPath(); ctx.ellipse(0, 0, r * (1.25 + i * .25), r * (.38 + i * .06), 0, 0, TAU); ctx.stroke();
      ctx.restore();
    }
    const gr = ctx.createRadialGradient(-r * .2, -r * .2, r * .1, 0, 0, r);
    gr.addColorStop(0, '#123040'); gr.addColorStop(.6, rgba(c, .8)); gr.addColorStop(1, '#040a10');
    ctx.fillStyle = gr; ctx.strokeStyle = rgba(c, .9); ctx.lineWidth = 1.6;
    poly(0, 0, r * 1.05, 6, Math.PI / 6); ctx.fill(); ctx.stroke();
    poly(0, 0, r * .72, 6, Math.PI / 6);
    ctx.fillStyle = 'rgba(4,10,18,.9)'; ctx.fill();
    ctx.strokeStyle = rgba('#ffffff', .5); ctx.stroke();
    ctx.fillStyle = L.kind === 'brain' ? '#ff5a6e' : '#8fe8ff';
    ctx.beginPath(); ctx.arc(0, 0, r * .2, 0, TAU); ctx.fill();
    ctx.strokeStyle = rgba('#ffffff', .8); ctx.beginPath(); ctx.arc(0, 0, r * .32, 0, TAU); ctx.stroke();
    ctx.fillStyle = rgba(c, .3);
    for (let i = 0; i < 6; i++) {
      const a = i / 6 * TAU;
      ctx.beginPath(); ctx.arc(Math.cos(a) * r * .55, Math.sin(a) * r * .55, r * .06, 0, TAU); ctx.fill();
    }
  } else if (L.kind === 'sovereign') {
    /* 统御者：三首六翼，胸嵌五维核心 */
    const aura = ctx.createRadialGradient(0, -r * .2, r * .2, 0, 0, r * 1.9);
    aura.addColorStop(0, 'rgba(255,209,102,.2)');
    aura.addColorStop(.6, 'rgba(255,120,40,.06)');
    aura.addColorStop(1, 'rgba(255,209,102,0)');
    ctx.fillStyle = aura;
    ctx.beginPath(); ctx.arc(0, 0, r * 1.9, 0, TAU); ctx.fill();

    /* 躯干：窄腰、宽肩的恶魔领主，避免“蜘蛛/花”轮廓 */
    const gr = ctx.createRadialGradient(-r * .22, -r * .5, r * .12, 0, 0, r * 1.05);
    gr.addColorStop(0, '#7a2a10'); gr.addColorStop(.5, rgba(c, .9)); gr.addColorStop(1, '#120602');
    ctx.fillStyle = gr; ctx.strokeStyle = '#ffe0a0'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(0, r * .30, r * .54, r * .84, 0, 0, TAU); ctx.fill(); ctx.stroke();

    /* 肩甲 */
    for (let s = -1; s <= 1; s += 2) {
      ctx.fillStyle = 'rgba(28,12,3,.9)'; ctx.strokeStyle = 'rgba(255,214,130,.8)'; ctx.lineWidth = 1.4;
      poly(s * r * .52, -r * .04, r * .26, 5, s > 0 ? -.4 : .4); ctx.fill(); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(s * r * .62, -r * .22); ctx.lineTo(s * r * .9, -r * .46); ctx.lineTo(s * r * .72, -r * .04);
      ctx.closePath(); ctx.fillStyle = '#ffd166'; ctx.fill();
    }

    /* 胸甲与五枚维度核心（纵向排列，不横向开花） */
    ctx.fillStyle = 'rgba(20,10,3,.8)'; ctx.strokeStyle = 'rgba(255,224,160,.6)'; ctx.lineWidth = 1.2;
    poly(0, r * .28, r * .3, 6, 0); ctx.fill(); ctx.stroke();
    const gems = ['#5ad8ff', '#ff6a3d', '#8ff0ff', '#b6ff6a', '#4fffd0'];
    for (let i = 0; i < 5; i++) {
      const gy = r * (.02 + i * .13);
      ctx.fillStyle = gems[i];
      ctx.beginPath(); ctx.arc(0, gy, r * .052, 0, TAU); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.8)';
      ctx.beginPath(); ctx.arc(-r * .012, gy - r * .012, r * .018, 0, TAU); ctx.fill();
    }

    /* 三条粗颈 + 三颗头，中间戴五维王冠 */
    const heads = [[-r * .72, -r * .60, -.28], [0, -r * .96, 0], [r * .72, -r * .60, .28]];
    ctx.strokeStyle = 'rgba(90,32,8,.95)'; ctx.lineWidth = r * .2;
    for (let i = 0; i < heads.length; i++) {
      ctx.beginPath(); ctx.moveTo(0, -r * .12);
      ctx.quadraticCurveTo(heads[i][0] * .55, heads[i][1] * .55, heads[i][0], heads[i][1]);
      ctx.stroke();
    }
    for (let i = 0; i < heads.length; i++) {
      ctx.save();
      ctx.translate(heads[i][0], heads[i][1]);
      ctx.rotate(heads[i][2]);
      drawHead(r * .5, c, { kind: 'sovereign', eyes: 3, horns: 2, crown: i === 1 }, r * .5, 0, 1);
      ctx.restore();
    }

    /* 中央王冠尖刺 */
    ctx.fillStyle = '#ffd166';
    for (let i = -2; i <= 2; i++) {
      ctx.beginPath();
      ctx.moveTo(i * r * .13 - r * .045, -r * 1.15);
      ctx.lineTo(i * r * .13, -r * (1.55 - Math.abs(i) * .12));
      ctx.lineTo(i * r * .13 + r * .045, -r * 1.15);
      ctx.closePath(); ctx.fill();
    }

    /* 爪与尾 */
    ctx.strokeStyle = 'rgba(255,200,110,.8)'; ctx.lineWidth = Math.max(1.6, r * .07);
    for (let s = -1; s <= 1; s += 2) {
      ctx.beginPath();
      ctx.moveTo(s * r * .55, r * .48);
      ctx.quadraticCurveTo(s * r * .95, r * .75, s * r * 1.2, r * 1.05);
      ctx.stroke();
      for (let k = -1; k <= 1; k++) {
        ctx.beginPath();
        ctx.moveTo(s * r * 1.2, r * 1.05);
        ctx.lineTo(s * r * 1.2 + k * r * .1, r * 1.2);
        ctx.stroke();
      }
    }
    ctx.strokeStyle = rgba(c, .7); ctx.lineWidth = r * .08;
    ctx.beginPath();
    ctx.moveTo(-r * .3, r * .9);
    ctx.quadraticCurveTo(-r * 1.2, r * 1.15, -r * 1.55, r * .55);
    ctx.stroke();

    /* 环绕的五枚符印 */
    ctx.strokeStyle = rgba('#ffd166', .7); ctx.lineWidth = 1.2;
    for (let i = 0; i < 5; i++) {
      const a = up * .25 + i / 5 * TAU;
      ctx.beginPath(); ctx.arc(Math.cos(a) * r * 1.35, Math.sin(a) * r * 1.05, r * .07, 0, TAU); ctx.stroke();
      ctx.beginPath(); ctx.arc(Math.cos(a) * r * 1.35, Math.sin(a) * r * 1.05, r * .025, 0, TAU); ctx.stroke();
    }
  } else {
    /* 兜底：大型恶魔 */
    const gr = ctx.createRadialGradient(-r * .2, -r * .2, r * .2, 0, 0, r);
    gr.addColorStop(0, '#2a0a08'); gr.addColorStop(.6, rgba(c, .9)); gr.addColorStop(1, '#0a0202');
    ctx.fillStyle = gr; ctx.strokeStyle = rgba(c, .9); ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.ellipse(0, 0, r * 1.1, r * .8, 0, 0, TAU); ctx.fill(); ctx.stroke();
    drawHead(r, c, L, r * .7, 0, 1.1);
  }
}

function render(){
  if (!game) newGame();
  const g = game;
  g.hotspots = [];

  ctx.clearRect(0, 0, W, H);

  if (g.state === 'menu') {
    drawMenu();
    g.hoverHot = isHot(g.mx, g.my);
    drawTooltip();
    return;
  }
  if (g.state === 'loadout') {
    drawLoadout();
    g.hoverHot = isHot(g.mx, g.my);
    drawTooltip();
    return;
  }

  drawPlacementPreview();
  drawTopBar();
  drawCardRail();
  drawWaveControl();
  if (g.boss) drawBossBar();
  if (g.state === 'build' || g.state === 'fight') {
    drawBuildBar();
    drawSkillBar();
    drawSelectedPanel();
  }
  drawBanner();

  if (g.state === 'reward') drawReward();
  if (g.paused && g.state !== 'reward' && g.state !== 'over' && g.state !== 'victory') drawPause();
  if (g.state === 'over') drawGameOver();
  if (g.state === 'victory') drawVictory();
  if (g.state === 'dimension') drawDimension();

  g.hoverHot = isHot(g.mx, g.my);
  drawTooltip();
}

function onKeyDown(e){
  if (!game) return;
  const k = e.key;
  const g = game;
  if (g.state === 'loadout') {
    if (k === 'Enter') { e.preventDefault(); confirmLoadout(); }
    if (k === 'Escape') { if (g.loadout.length) { g.loadout.pop(); sfx('click'); } }
    return;
  }
  if (k >= '1' && k <= '4') {
    if (g.state !== 'build') return;
    const idx = Number(k) - 1;
    if (idx < g.loadout.length) {
      const ti = g.loadout[idx];
      g.buildType = g.buildType === ti ? -1 : ti;
      g.targeting = null;
      g.selectedTower = null;
      sfx('select');
    }
    return;
  }
  if (k === 'Escape') { cancelAction(); return; }
  if (k === ' ' || k === 'Spacebar') {
    e.preventDefault();
    if (g.state === 'menu') { startGame(); return; }
    if (g.state === 'fight' || g.state === 'build') togglePause();
    return;
  }
  if (k === 'Enter') {
    e.preventDefault();
    if (g.state === 'menu') startGame();
    else if (g.state === 'build') startWave();
    else if (g.state === 'dimension') nextDimension();
    else if (g.state === 'over' || g.state === 'victory') startGame();
    return;
  }
  if (k === 's' || k === 'S') { cycleSpeed(); return; }
  if (k === 'm' || k === 'M') { muted = !muted; store.set('abyss_muted', muted); sfx('click'); return; }
  if (k === 'q' || k === 'Q') castSkill('bolt');
  else if (k === 'w' || k === 'W') castSkill('nova');
  else if (k === 'e' || k === 'E') castSkill('overclock');
  else if (k === 'r' || k === 'R') castSkill('meteor');
  else if (k === 'u' || k === 'U') { if (g.selectedTower && g.state !== 'menu') upgradeTower(g.selectedTower); }
  else if (k === 'x' || k === 'X') { if (g.selectedTower) sellTower(g.selectedTower); }
}

/* ============================================================
   战役层：星图 / 章节 / 小关 / 独立配装 / 解锁 / 挑战
   ============================================================ */

const CAMPAIGN = { chapters: 6, stagesPerChapter: 3, wavesPerStage: 6, challengeTrials: 3 };
const ROMAN = ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX'];
const TOWER_INDEX = {};
TOWERS.forEach((t, i) => { TOWER_INDEX[t.key] = i; });
const TOWER_ORDER = [];
DIMENSIONS.forEach(d => d.towers.forEach(k => TOWER_ORDER.push(k)));
const DEFAULT_UNLOCK = dimOf(1).towers.slice(0, 4);

function defaultProgress(){
  return { unlocked: DEFAULT_UNLOCK.slice(), cleared: {}, best: bestScore || 0, challengeUnlocked: false };
}
function loadProgress(){
  let raw = null;
  try { raw = store.get('abyss_campaign_v1', null); } catch (e) { raw = null; }
  const p = defaultProgress();
  if (raw && typeof raw === 'object') {
    if (Array.isArray(raw.unlocked)) {
      p.unlocked = raw.unlocked.filter(k => TOWER_INDEX[k] != null);
    }
    if (raw.cleared && typeof raw.cleared === 'object') {
      for (const k of Object.keys(raw.cleared)) {
        const v = Number(raw.cleared[k]) || 0;
        if (v > 0) p.cleared[k] = Math.min(3, v);
      }
    }
    p.best = Math.max(p.best, Number(raw.best) || 0);
    p.challengeUnlocked = !!raw.challengeUnlocked;
  }
  if (!p.unlocked.length) p.unlocked = DEFAULT_UNLOCK.slice();
  p.challengeUnlocked = p.challengeUnlocked || campaignClearCount(p) >= 3;
  return p;
}
function saveProgress(){
  PROGRESS.best = Math.max(PROGRESS.best || 0, bestScore || 0);
  bestScore = Math.max(bestScore || 0, PROGRESS.best);
  try {
    store.set('abyss_campaign_v1', {
      unlocked: PROGRESS.unlocked.slice(),
      cleared: Object.assign({}, PROGRESS.cleared),
      best: PROGRESS.best,
      challengeUnlocked: !!PROGRESS.challengeUnlocked
    });
    store.set('abyss_best_v2', bestScore);
  } catch (e) {}
}
const PROGRESS = loadProgress();
bestScore = Math.max(bestScore || 0, PROGRESS.best);

function campaignClearCount(p){
  p = p || PROGRESS;
  let n = 0;
  for (const k of Object.keys(p.cleared || {})) if (k[0] === 'd' && p.cleared[k] > 0) n++;
  return n;
}
function challengeClearCount(p){
  p = p || PROGRESS;
  let n = 0;
  for (const k of Object.keys(p.cleared || {})) if (k[0] === 'x' && p.cleared[k] > 0) n++;
  return n;
}
function isChallengeUnlocked(){
  return !!PROGRESS.challengeUnlocked || campaignClearCount() >= 3;
}
function isTowerUnlocked(ti){
  const def = TOWERS[ti];
  return !!(def && PROGRESS.unlocked.indexOf(def.key) >= 0);
}
function unlockTowerKey(key){
  if (!key || TOWER_INDEX[key] == null) return false;
  if (PROGRESS.unlocked.indexOf(key) >= 0) return false;
  PROGRESS.unlocked.push(key);
  return true;
}
function stageInfoOf(dim, stage, challenge, trial){
  challenge = !!challenge;
  const tier = challenge ? 19 + (stage - 1) : (dim - 1) * CAMPAIGN.stagesPerChapter + stage;
  const d = dimOf(dim);
  const names = ['前哨', '主攻', '首领'];
  const cnames = ['试炼 I', '试炼 II', '试炼 III'];
  return {
    dim, stage, challenge, trial: trial || (challenge ? stage : 0), tier,
    key: challenge ? 'x' + stage : 'd' + dim + 's' + stage,
    name: challenge ? cnames[stage - 1] : names[stage - 1],
    chapterName: challenge ? '深渊试炼' : d.name,
    bossKey: (challenge || stage === 3) ? d.boss : null,
    waves: CAMPAIGN.wavesPerStage
  };
}
function stageKeyOf(dim, stage, challenge){ return challenge ? 'x' + stage : 'd' + dim + 's' + stage; }
function stageBest(info){ return (PROGRESS.cleared[info.key] || 0); }
function starsFor(hp){ return hp >= 90 ? 3 : hp >= 60 ? 2 : hp > 0 ? 1 : 0; }
function stageEnergy(info){ return 190 + (info.tier - 1) * 10 + (info.challenge ? 80 : 0); }
function nextStageInfo(info){
  if (!info) return null;
  if (info.challenge) return info.stage < CAMPAIGN.challengeTrials ? stageInfoOf(6, info.stage + 1, true) : null;
  if (info.stage < CAMPAIGN.stagesPerChapter) return stageInfoOf(info.dim, info.stage + 1, false);
  if (info.dim < CAMPAIGN.chapters) return stageInfoOf(info.dim + 1, 1, false);
  return null;
}

  if (!isTowerUnlocked(ti)) {
    setBanner('炮塔未解锁', '通关前一关或挑战以解锁', '#ffb45c', 2);
    sfx('error');
    return false;

  const at = g.loadout.indexOf(ti);
  if (at >= 0) g.loadout.splice(at, 1);
  else {
    if (g.loadout.length >= 4) {
      setBanner('配置已满', '先移除一座炮塔', '#ffb45c', 1.8);
      sfx('error');
      return false;
    }
    g.loadout.push(ti);
  }
  sfx('select');
  return true;
}
function recommendedLoadout(dim){
  const d = dimOf(dim);
  const out = [];
  for (const k of d.towers) {
    const ti = TOWER_INDEX[k];
    if (ti != null && isTowerUnlocked(ti) && out.indexOf(ti) < 0) out.push(ti);
    if (out.length >= 4) break;
  }
  if (out.length < 4) {
    for (const k of TOWER_ORDER) {
      const ti = TOWER_INDEX[k];
      if (isTowerUnlocked(ti) && out.indexOf(ti) < 0) out.push(ti);
      if (out.length >= 4) break;
    }
  }
  return out.slice(0, 4);
}
function recommendLoadout(){
  const g = game;
  if (!g || g.state !== 'loadout') return [];
  g.loadout = recommendedLoadout(g.dimension);
  sfx('select');
  return g.loadout.slice();
}
function autoLoadout(dim){
  const list = recommendedLoadout(dim || 1);

}

/* ---------- 结算 ---------- */
function stageClear(){
  const g = game;
  if (!g || g.state === 'stageclear') return false;
  const info = g.stageInfo || stageInfoOf(g.dimension, 1, g.challenge);
  const stars = starsFor(g.hp);
  const prev = stageBest(info);
  const first = !prev;
  PROGRESS.cleared[info.key] = Math.max(prev, stars);
  PROGRESS.best = Math.max(PROGRESS.best || 0, g.score || 0);
  let unlockedKey = null;
  if (first) {
    for (const k of TOWER_ORDER) {
      if (PROGRESS.unlocked.indexOf(k) < 0) { PROGRESS.unlocked.push(k); unlockedKey = k; break; }
    }
  }
  if (!info.challenge && campaignClearCount() >= 3) PROGRESS.challengeUnlocked = true;
  saveProgress();
  g.best = Math.max(g.best || 0, PROGRESS.best);
  g.clearInfo = {
    info, stars, first: first,
    unlockedKey,
    nextStage: nextStageInfo(info),
    campaignClears: campaignClearCount(),
    challengeClears: challengeClearCount(),
    challengeUnlocked: isChallengeUnlocked(),
    allCampaignClear: campaignClearCount() >= CAMPAIGN.chapters * CAMPAIGN.stagesPerChapter
  };
  g.state = 'stageclear';
  g.endT = 0;
  g.paused = false;
  g.selectedTower = null;
  g.buildType = -1;
  setBanner('小关完成', stars + ' 星 · 第 ' + g.stage + ' 关', '#7ee66f', 2.2);
  sfx('victory');
  return true;
}

/* ---------- 主循环覆盖 ---------- */
function startGame(){
  openChapters();
}
function update(dt){
  const g = game;
  updateVisual(dt);
  if (!g) return;
  if (g.state === 'fight') {
    g.runTime += dt;
    updateSpawn(dt);
    updateEnemies(dt);
    if (g.hp <= 0) { gameOver(); return; }
    updateTowers(dt);
    updateProjectiles(dt);
    updateSkills(dt);
    updateBoss(dt);
    if (g.hp <= 0) { gameOver(); return; }
    if (g.state === 'fight' && g.queue.length === 0 && g.enemies.length === 0 && !g.waveResolved) {
      resolveWave();
      if (g.hp > 0 && (g.state === 'reward' || g.state === 'dimension' || g.state === 'victory') && g.wave >= CAMPAIGN.wavesPerStage) {
        stageClear();
      }
    }
  }
}
function render(){
  const g = game;
  if (!g) return;
  g.hotspots = [];
  drawWorld(g.clock);
  if (g.state === 'menu') { drawMenu(); return; }
  if (g.state === 'chapters') { drawChapters(); return; }
  if (g.state === 'stages') { drawStages(); return; }

  drawTopBar();
  if (g.state === 'loadout') { drawLoadout(); return; }
  if (g.boss) drawBossBar(); else drawWaveControl();
  drawCardRail();
  drawBuildBar();
  drawSkillBar();
  if ((g.state === 'build' || g.state === 'fight') && g.selectedTower) drawSelectedPanel();
  if (g.targeting) drawTargeting();
  drawBanner();
  if (g.state === 'reward') drawReward();
  if (g.state === 'stageclear') drawStageClear();
  if (g.state === 'over') drawGameOver();
  if (g.paused) drawPause();
  drawTooltip();
}

/* ============================================================
   ASTRAL CODEX — a restrained, atlas-like UI skin.
   Replaces the previous neon HUD without touching game logic.
   ============================================================ */
const SK = {
  ink: '#030611',
  ink2: 'rgba(5,10,20,.92)',
  paper: '#dcf8ff',
  paperDim: 'rgba(190,235,250,.86)',
  paperFaint: 'rgba(145,205,228,.55)',
  gold: '#57e6ff',
  goldDim: 'rgba(87,230,255,.68)',
  goldFaint: 'rgba(87,230,255,.24)',
  red: '#ff5d7e',
  violet: '#a88cff',
  green: '#6cf0c2'
};
const SK_SERIF = '"Bahnschrift", "DIN Alternate", "Segoe UI", "Microsoft YaHei", sans-serif';
const SK_SANS = '"Bahnschrift", "Segoe UI", "Microsoft YaHei", sans-serif';
const SK_MONO = 'Consolas, "Courier New", monospace';

function skFont(size, weight, mono){
  const fam = mono ? SK_MONO : (size < 15 ? SK_SANS : SK_SERIF);
  return (weight || 400) + ' ' + size + 'px ' + fam;
}
function skText(s, x, y, size, color, align, weight, mono, tracking){
  s = String(s == null ? '' : s);
  ctx.save();
  ctx.font = skFont(size, weight, mono);
  ctx.fillStyle = color || SK.paper;
  ctx.shadowColor = size >= 17 ? 'rgba(87,230,255,.32)' : 'rgba(0,0,0,.6)';
  ctx.shadowBlur = size >= 17 ? 8 : 1.5;
  ctx.shadowOffsetY = .5;
  ctx.textAlign = tracking ? 'left' : (align || 'left');
  ctx.textBaseline = 'middle';
  if (!tracking) {
    ctx.fillText(s, x, y);
  } else {
    let tw = 0;
    for (const ch of s) tw += ctx.measureText(ch).width + tracking;
    tw -= tracking;
    let cx = align === 'center' ? x - tw / 2 : align === 'right' ? x - tw : x;
    for (const ch of s) {
      ctx.fillText(ch, cx, y);
      cx += ctx.measureText(ch).width + tracking;
    }
  }
  ctx.restore();
}
function skMeasure(s, size, weight, mono){
  ctx.save(); ctx.font = skFont(size, weight, mono);
  const w = ctx.measureText(String(s)).width; ctx.restore(); return w;
}
function skLine(x1, y1, x2, y2, color, w, dash){
  ctx.save();
  ctx.strokeStyle = color || SK.goldDim; ctx.lineWidth = w || 1;
  if (dash) ctx.setLineDash(dash);
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  ctx.restore();
}
function skDiamond(cx, cy, r, fill, stroke){
  ctx.save(); ctx.beginPath();
  ctx.moveTo(cx, cy - r); ctx.lineTo(cx + r, cy); ctx.lineTo(cx, cy + r); ctx.lineTo(cx - r, cy);
  ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 1; ctx.stroke(); }
  ctx.restore();
}
function skStar(cx, cy, r, color, a){
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(a || 0);
  ctx.strokeStyle = color; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, -r); ctx.lineTo(0, r); ctx.moveTo(-r, 0); ctx.lineTo(r, 0); ctx.stroke();
  ctx.beginPath(); ctx.arc(0, 0, r * .28, 0, TAU); ctx.stroke();
  ctx.restore();
}

/* procedural galaxies: one distinct silhouette per chapter */
const GALAXY_ART = {
  1: { type: 'spiral',    core: '#e8fbff', a: '#48a7ff', b: '#9be9ff', halo: 'rgba(40,120,255,.22)' },
  2: { type: 'elliptical', core: '#fff0d0', a: '#ff6b3d', b: '#ffbe6a', halo: 'rgba(255,90,30,.2)' },
  3: { type: 'lenticular', core: '#ffffff', a: '#79e8ff', b: '#c2f8ff', halo: 'rgba(80,220,255,.18)' },
  4: { type: 'irregular',  core: '#e8ffd2', a: '#78d95e', b: '#c58bff', halo: 'rgba(90,220,120,.17)' },
  5: { type: 'ring',       core: '#eaffff', a: '#57e6ff', b: '#d2ae63', halo: 'rgba(80,200,220,.18)' },
  6: { type: 'barred',     core: '#fff1c8', a: '#ffcb62', b: '#8c6cff', halo: 'rgba(255,190,90,.2)' }
};
function skRnd(i, seed){
  const v = Math.sin(i * 12.9898 + seed * 78.233) * 43758.5453;
  return v - Math.floor(v);
}
function skGalaxy(kind, cx, cy, r, t, alpha){
  const p = GALAXY_ART[kind] || GALAXY_ART[1];
  ctx.save();
  ctx.globalAlpha = alpha == null ? 1 : alpha;
  const halo = ctx.createRadialGradient(cx, cy, r * .08, cx, cy, r * 1.35);
  halo.addColorStop(0, p.halo); halo.addColorStop(.55, p.halo); halo.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = halo; ctx.beginPath(); ctx.arc(cx, cy, r * 1.35, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU); ctx.clip();
  const bg = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
  bg.addColorStop(0, 'rgba(8,18,38,.2)'); bg.addColorStop(1, 'rgba(2,5,15,.96)');
  ctx.fillStyle = bg; ctx.fillRect(cx - r, cy - r, r * 2, r * 2);

  ctx.globalCompositeOperation = 'lighter';
  const N = Math.max(55, Math.round(r * 2.1));
  for (let i = 0; i < N; i++) {
    const u = (i + .5) / N;
    const q1 = skRnd(i, kind), q2 = skRnd(i + 73, kind);
    let px, py, s, col;
    if (p.type === 'spiral') {
      const arm = i % 2, uu = Math.pow(u, .78);
      const ang = arm * Math.PI + uu * 4.8 + (q1 - .5) * .5 + t * .04;
      const rr = r * (.1 + uu * .9) * (.88 + q2 * .18);
      px = cx + Math.cos(ang) * rr;
      py = cy + Math.sin(ang) * rr * (.42 + q1 * .12);
      s = .7 + q2 * 1.3; col = uu < .28 ? p.core : (arm ? p.b : p.a);
    } else if (p.type === 'elliptical') {
      const ang = q1 * TAU, rr = r * Math.sqrt(q2) * .82;
      px = cx + Math.cos(ang) * rr;
      py = cy + Math.sin(ang) * rr * (.62 + q1 * .12);
      s = .8 + q2 * 1.2; col = q2 < .3 ? p.core : (i % 3 ? p.a : p.b);
    } else if (p.type === 'lenticular') {
      const ang = q1 * TAU, rr = r * (.25 + Math.sqrt(q2) * .7);
      px = cx + Math.cos(ang) * rr;
      py = cy + Math.sin(ang) * rr * .28;
      s = .65 + q2 * 1.1; col = q2 < .22 ? p.core : (i % 4 ? p.a : p.b);
    } else if (p.type === 'irregular') {
      const cl = i % 3;
      const ox = (cl - 1) * r * .3, oy = (cl === 1 ? -.18 : .14) * r;
      const ang = q1 * TAU, rr = r * Math.sqrt(q2) * .4;
      px = cx + ox + Math.cos(ang) * rr;
      py = cy + oy + Math.sin(ang) * rr * .8;
      s = .8 + q2 * 1.5; col = cl === 1 ? p.b : p.a;
    } else if (p.type === 'ring') {
      const ang = q1 * TAU, rr = r * (.5 + q2 * .32);
      px = cx + Math.cos(ang) * rr;
      py = cy + Math.sin(ang) * rr * .46;
      s = .7 + q2 * 1.2; col = q2 < .18 ? p.b : p.a;
    } else {
      const bar = q2 < .35;
      const ang = bar ? (q1 < .5 ? 0 : Math.PI) : q1 * TAU;
      const rr = bar ? r * Math.abs(q1 - .5) * 1.5 : r * (.4 + q2 * .5);
      px = cx + Math.cos(ang) * rr;
      py = cy + Math.sin(ang) * rr * (bar ? .14 : .5);
      s = .8 + q2 * 1.3; col = q2 < .22 ? p.core : (i % 2 ? p.a : p.b);
    }
    ctx.fillStyle = col;
    ctx.fillRect(px, py, s, s);
  }
  /* dust / arm ridges */
  if (p.type === 'spiral' || p.type === 'barred') {
    ctx.globalCompositeOperation = 'source-over';
    ctx.strokeStyle = 'rgba(2,6,14,.45)'; ctx.lineWidth = Math.max(1, r * .04);
    for (let arm = 0; arm < 2; arm++) {
      ctx.beginPath();
      for (let i = 0; i <= 20; i++) {
        const u = i / 20, ang = arm * Math.PI + u * 4.8 + t * .04;
        const rr = r * (.15 + u * .82);
        const x = cx + Math.cos(ang) * rr, y = cy + Math.sin(ang) * rr * .46;
        if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y);
      }
      ctx.stroke();
    }
  }
  const core = ctx.createRadialGradient(cx, cy, 0, cx, cy, r * .34);
  core.addColorStop(0, p.core); core.addColorStop(.45, p.a); core.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = core; ctx.beginPath(); ctx.arc(cx, cy, r * .34, 0, TAU); ctx.fill();
  ctx.restore();
}
function skFrame(x, y, w, h, cut, stroke, fill, alpha){

  ctx.lineTo(x + w - cut, y + h);

  ctx.closePath();
  if (fill) { ctx.globalAlpha = alpha == null ? 1 : alpha; ctx.fillStyle = fill; ctx.fill(); ctx.globalAlpha = 1; }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 1; ctx.stroke(); }
  ctx.restore();
}
function skHair(x, y, w, color){

}
function skCorner(x, y, w, h, len, color){

}
function skSeal(cx, cy, r, label, color, sub){

}
function skCompass(cx, cy, r){

  for (const l of lines) maxW = Math.max(maxW, skMeasure(l, 8.5, 400));
  const w = Math.min(290, maxW + 18), hh = lines.length * lh + 14;

  if (x + w > W - 10) x = g.mx - w - 12;
  if (y + hh > H - 10) y = g.my - hh - 12;
  x = clamp(x, 10, W - w - 10); y = clamp(y, 10, H - hh - 10);
  skFrame(x, y, w, hh, 5, SK.goldDim, 'rgba(6,8,13,.97)');

    skText(lines[i], x + 9, y + 11 + i * lh, 8.5, i === 0 ? SK.paper : SK.paperDim, 'left', 400, i > 0);
  }
}

/* ---------- render ---------- */
function render(){
  const g = game;
  if (!g) return;
  g.hotspots = [];
  drawWorld(g.clock);

  if (g.state === 'menu') { skMenu(); }
  else if (g.state === 'chapters') { skChapters(); }
  else if (g.state === 'stages') { skStages(); }
  else if (g.state === 'loadout') { skLoadout(); }
  else if (g.state === 'reward') { skReward(); }
  else if (g.state === 'stageclear') { skStageClear(); }
  else if (g.state === 'over') { skGameOver(); }
  else {
    skTop(g);
    if (g.boss) skBossBar(g); else skWaveTicks(g);
    skCards(g);
    skBuildRail(g);
    skSkillRail(g);
    skWaveControl(g);
    if (g.selectedTower) skFolio(g);
    if (!g.paused) skBanner(g);
    if (g.paused) skPause();
  }

  g.hoverHot = isHot(g.mx, g.my);
  skTooltip();
}
/* ============================================================
   TOWER ART · hard-surface sci-fi pass
   Overrides drawTowerEmblem / drawTower from 05_art.js.
   All silhouettes are drawn in local space; +X is the muzzle.
   ============================================================ */

function towHex(r, n, rot){
  n = n || 6; rot = rot || 0;
  ctx.beginPath();
  for (let i = 0; i < n; i++) {
    const a = rot + i / n * TAU;
    const x = Math.cos(a) * r, y = Math.sin(a) * r;
    if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y);
  }
  ctx.closePath();
}
function towTickArc(x, y, r, a0, a1, color, w){
  ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = w || 1;
  ctx.beginPath(); ctx.arc(x, y, r, a0, a1); ctx.stroke(); ctx.restore();
}
function towCore(c, x, y, r, pulse){
  const g = ctx.createRadialGradient(x, y, 0, x, y, r * 2.2);
  g.addColorStop(0, '#ffffff');
  g.addColorStop(.32, rgba(c, .95));
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.save(); ctx.globalAlpha = .8 + .2 * Math.sin(pulse || 0);
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r * 2.2, 0, TAU); ctx.fill(); ctx.restore();
  ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(x, y, Math.max(1, r * .42), 0, TAU); ctx.fill();
}

function towerTurretArt(def, recoil, t){
  const c = def.color;
  const arch = def.arch;
  const tt = t ? (t.t || 0) : 0;
  const rc = Math.max(0, recoil || 0);
  ctx.save();

  /* shared hard-point spine and heat fins */
  ctx.fillStyle = '#2a5f7a';
  ctx.strokeStyle = rgba(c, .95);
  ctx.lineWidth = 1;
  poly(-9, 0, 8, 6, Math.PI / 6); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#1d5372';
  poly(-3, -8, 5, 4, Math.PI / 4); ctx.fill();
  poly(-3, 8, 5, 4, Math.PI / 4); ctx.fill();
  ctx.strokeStyle = rgba(c, .3);
  ctx.beginPath(); ctx.moveTo(-12, -5); ctx.lineTo(-5, -5); ctx.moveTo(-12, 5); ctx.lineTo(-5, 5); ctx.stroke();

  if (arch === 'pulse') {
    /* rotary tri-barrel with capacitor cage */
    ctx.strokeStyle = rgba(c, .35); ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(1, 0, 9, -.8, .8); ctx.stroke();
    ctx.beginPath(); ctx.arc(1, 0, 9, Math.PI - .8, Math.PI + .8); ctx.stroke();
    for (let i = -1; i <= 1; i++) {
      const y = i * 4.3;
      ctx.fillStyle = '#2a5f7a'; ctx.strokeStyle = rgba(c, .95);
      rr(4, y - 1.8, 19 - rc * 4, 3.6, 1); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#dffcff';
      rr(21 - rc * 4, y - 1, 3, 2, .8); ctx.fill();
      ctx.strokeStyle = rgba(c, .55);
      ctx.beginPath(); ctx.moveTo(10, y); ctx.lineTo(17, y); ctx.stroke();
    }
    ctx.strokeStyle = rgba('#dffcff', .5); ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(10, 0, 7.5, 0, TAU); ctx.stroke();
    towCore(c, -3, 0, 3.6, tt * 6);
    ctx.fillStyle = rgba(c, .8); rr(-8, -2, 4, 4, 1); ctx.fill();
  } else if (arch === 'flame') {
    /* plasma projector with three focusing claws */
    ctx.fillStyle = '#311a0f'; ctx.strokeStyle = rgba(c, .9);
    rr(-6, -8, 12, 6, 2); ctx.fill(); ctx.stroke();
    rr(-6, 2, 12, 6, 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(25,13,8,.95)';
    poly(4, 0, 13, 3, 0); ctx.fill();
    ctx.strokeStyle = rgba('#ffb15a', .55); ctx.stroke();
    for (let i = -1; i <= 1; i++) {
      const a = i * .34;
      ctx.save(); ctx.rotate(a);
      ctx.fillStyle = rgba(c, .62);
      poly(9, 0, 3, 3, Math.PI / 2); ctx.fill();
      ctx.strokeStyle = rgba('#ffe0b0', .65); ctx.stroke();
      ctx.restore();
    }
    ctx.fillStyle = rgba('#ff9a3c', .95);
    ctx.beginPath(); ctx.moveTo(16, 0); ctx.quadraticCurveTo(24 + rc * 3, -3.5, 20, 0); ctx.quadraticCurveTo(24 + rc * 3, 3.5, 16, 0); ctx.fill();
    ctx.fillStyle = rgba('#fff3c4', .9);
    ctx.beginPath(); ctx.arc(15, 0, 2.4, 0, TAU); ctx.fill();
    towCore(c, -5, 0, 3, tt * 5);
    ctx.strokeStyle = rgba(c, .45); ctx.lineWidth = 1;
    for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.moveTo(1, -7 + i * 7); ctx.lineTo(7, -7 + i * 7); ctx.stroke(); }
  } else if (arch === 'frost') {
    /* cryo lance: split crystal prongs and coolant rings */
    ctx.fillStyle = '#12384f'; ctx.strokeStyle = rgba(c, .85);
    rr(-8, -5, 12, 10, 2); ctx.fill(); ctx.stroke();
    ctx.save(); ctx.rotate(-.8);
    ctx.fillStyle = 'rgba(120,230,255,.38)'; ctx.strokeStyle = '#dffcff';
    poly(12, 0, 4, 4, Math.PI / 2); ctx.fill(); ctx.stroke();
    ctx.restore();
    ctx.save(); ctx.rotate(.8);
    ctx.fillStyle = 'rgba(120,230,255,.38)';
    poly(12, 0, 4, 4, Math.PI / 2); ctx.fill(); ctx.stroke();
    ctx.restore();
    ctx.fillStyle = 'rgba(210,250,255,.9)';
    ctx.beginPath(); ctx.moveTo(2, -4); ctx.lineTo(21 - rc * 3, 0); ctx.lineTo(2, 4); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = rgba(c, .9); ctx.stroke();
    for (let i = 0; i < 3; i++) {
      ctx.strokeStyle = rgba(c, .4 + i * .12); ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(-1, 0, 6 + i * 2.4, -1.1, 1.1); ctx.stroke();
    }
    towCore(c, -4, 0, 2.8, tt * 7);
  } else if (arch === 'storm') {
    /* tesla cage: twin crescent electrodes and arc plasma */
    ctx.strokeStyle = rgba(c, .8); ctx.lineWidth = 1.4;
    for (let i = 0; i < 2; i++) {
      ctx.beginPath(); ctx.arc(3, 0, 11, -1.15 + i * Math.PI, -.2 + i * Math.PI); ctx.stroke();
    }
    ctx.strokeStyle = rgba('#dffcff', .9); ctx.lineWidth = 1;
    for (let i = 0; i < 3; i++) {
      const a = tt * 1.3 + i * 2.1;
      ctx.beginPath();
      ctx.moveTo(3 + Math.cos(a) * 4, Math.sin(a) * 4);
      ctx.lineTo(3 + Math.cos(a + .5) * 11, Math.sin(a + .5) * 11);
      ctx.lineTo(3 + Math.cos(a + .9) * 7, Math.sin(a + .9) * 7);
      ctx.stroke();
    }
    towCore(c, 3, 0, 4.2, tt * 9);
    ctx.fillStyle = rgba(c, .6); rr(-11, -2, 4, 4, 1); ctx.fill();
    ctx.strokeStyle = rgba(c, .3); ctx.beginPath(); ctx.arc(3, 0, 15, 0, TAU); ctx.stroke();
  } else if (arch === 'mortar') {
    /* angular artillery cradle with hydraulic recoil */
    ctx.fillStyle = '#1b4a66'; ctx.strokeStyle = rgba(c, .8);
    poly(-2, 0, 10, 4, Math.PI / 4); ctx.fill(); ctx.stroke();
    ctx.save(); ctx.rotate(-.52);
    ctx.fillStyle = '#1b4a66';
    rr(-4, -5, 24 - rc * 5, 10, 3); ctx.fill();
    ctx.strokeStyle = rgba(c, .85); ctx.stroke();
    ctx.fillStyle = '#050c14';
    ctx.beginPath(); ctx.ellipse(20 - rc * 5, 0, 3.5, 6.5, 0, 0, TAU); ctx.fill();
    ctx.strokeStyle = rgba('#dffcff', .5); ctx.stroke();
    ctx.fillStyle = rgba(c, .6); rr(2, -3, 7, 1.5, .5); ctx.fill();
    ctx.restore();
    ctx.strokeStyle = rgba(c, .55); ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(-4, -8); ctx.lineTo(8, -8); ctx.moveTo(-4, 8); ctx.lineTo(8, 8); ctx.stroke();
    towCore(c, -5, 0, 3.2, tt * 4);
  } else if (arch === 'beam') {
    /* long focusing rail with heat-sink fins */
    ctx.fillStyle = '#14384f'; ctx.strokeStyle = rgba(c, .9);
    rr(-8, -4, 14, 8, 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#17445f';
    rr(2, -3, 24 - rc * 3, 6, 2); ctx.fill();
    ctx.strokeStyle = rgba(c, .9); ctx.stroke();
    ctx.strokeStyle = rgba('#dffcff', .65); ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(7, 0); ctx.lineTo(24 - rc * 3, 0); ctx.stroke();
    for (let i = 0; i < 3; i++) {
      ctx.strokeStyle = rgba(c, .45); ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(5 + i * 5, 0, 4, -1.2, 1.2); ctx.stroke();
    }
    ctx.fillStyle = rgba(c, .9);
    ctx.beginPath(); ctx.arc(26 - rc * 3, 0, 2.6, 0, TAU); ctx.fill();
    ctx.strokeStyle = rgba('#ffffff', .6); ctx.beginPath(); ctx.arc(26 - rc * 3, 0, 4.5, 0, TAU); ctx.stroke();
    for (let i = -1; i <= 1; i++) {
      ctx.fillStyle = rgba(c, .25);
      poly(-3, i * 6, 4, 4, Math.PI / 4); ctx.fill();
    }
    towCore(c, -6, 0, 3, tt * 6);
  } else if (arch === 'rail') {
    /* twin accelerator rails with a plasma bridge */
    ctx.fillStyle = '#14384f'; ctx.strokeStyle = rgba(c, .9);
    rr(-8, -5, 11, 10, 2); ctx.fill(); ctx.stroke();
    for (let i = -1; i <= 1; i += 2) {
      ctx.fillStyle = '#17445f';
      rr(1, i * 3.2 - 1.4, 26 - rc * 4, 2.8, .8); ctx.fill();
      ctx.strokeStyle = rgba(c, .85); ctx.stroke();
    }
    ctx.strokeStyle = rgba('#dffcff', .8); ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(7, -4); ctx.lineTo(10, 0); ctx.lineTo(7, 4); ctx.stroke();
    ctx.fillStyle = rgba(c, .3); rr(4, -1, 18 - rc * 4, 2, .8); ctx.fill();
    ctx.fillStyle = rgba('#ffffff', .9); rr(25 - rc * 4, -1.2, 3, 2.4, .5); ctx.fill();
    ctx.strokeStyle = rgba(c, .4); ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(-2, -8); ctx.lineTo(-2, 8); ctx.stroke();
    towCore(c, -5, 0, 3, tt * 3);
  } else if (arch === 'nova') {
    /* orbital accelerator: floating shards around a captured star */
    ctx.strokeStyle = rgba(c, .5); ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(0, 0, 13, 0, TAU); ctx.stroke();
    for (let i = 0; i < 4; i++) {
      const a = i / 4 * TAU + tt * .6;
      const dx = Math.cos(a) * 15, dy = Math.sin(a) * 15;
      ctx.save(); ctx.translate(dx, dy); ctx.rotate(a + Math.PI / 2);
      ctx.fillStyle = rgba(c, .55);
      poly(0, 0, 3.8, 4, Math.PI / 4); ctx.fill();
      ctx.strokeStyle = rgba('#dffcff', .6); ctx.stroke();
      ctx.restore();
    }
    ctx.fillStyle = 'rgba(220,255,255,.9)'; ctx.beginPath(); ctx.arc(0, 0, 5, 0, TAU); ctx.fill();
    ctx.strokeStyle = rgba(c, .8); ctx.beginPath(); ctx.arc(0, 0, 8.5, 0, TAU); ctx.stroke();
  } else if (arch === 'gravity') {
    /* singularity drive: three inclined rings, no barrel */
    for (let i = 0; i < 3; i++) {
      ctx.save(); ctx.rotate(i * 1.05 + tt * .35);
      ctx.strokeStyle = rgba(c, .55 + i * .1); ctx.lineWidth = 1;
      ctx.beginPath(); ctx.ellipse(0, 0, 12 + i * 3, 5 + i * 1.6, 0, 0, TAU); ctx.stroke();
      ctx.restore();
    }
    ctx.fillStyle = '#02050b'; ctx.beginPath(); ctx.arc(0, 0, 7, 0, TAU); ctx.fill();
    ctx.strokeStyle = rgba('#dffcff', .35); ctx.beginPath(); ctx.arc(0, 0, 8.4, 0, TAU); ctx.stroke();
    ctx.fillStyle = rgba(c, .9); ctx.beginPath(); ctx.arc(2, 0, 1.6, 0, TAU); ctx.fill();
    ctx.strokeStyle = rgba(c, .25);
    ctx.beginPath(); ctx.moveTo(-12, 0); ctx.lineTo(12, 0); ctx.stroke();
  } else if (arch === 'drone') {
    /* four-pod swarm cradle */
    ctx.strokeStyle = rgba(c, .3); ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(0, 0, 15, 0, TAU); ctx.stroke();
    for (let i = 0; i < 4; i++) {
      const a = i / 4 * TAU + tt * .7;
      const dx = Math.cos(a) * 11, dy = Math.sin(a) * 11;
      ctx.save(); ctx.translate(dx, dy); ctx.rotate(a);
      ctx.fillStyle = '#0c1c2e'; ctx.strokeStyle = rgba(c, .8);
      poly(0, 0, 4.2, 3, 0); ctx.fill(); ctx.stroke();
      ctx.fillStyle = rgba('#dffcff', .8); ctx.beginPath(); ctx.arc(1, 0, 1.2, 0, TAU); ctx.fill();
      ctx.restore();
      ctx.strokeStyle = rgba(c, .25);
      ctx.beginPath(); ctx.moveTo(dx * .3, dy * .3); ctx.lineTo(dx * .82, dy * .82); ctx.stroke();
    }
    towCore(c, 0, 0, 3.2, tt * 8);
  } else if (arch === 'support') {
    /* pylon: rotating halo and beam node */
    ctx.fillStyle = '#14384f'; ctx.strokeStyle = rgba(c, .85);
    poly(0, 0, 9, 6, Math.PI / 6); ctx.fill(); ctx.stroke();
    for (let i = 0; i < 3; i++) {
      ctx.save(); ctx.rotate(tt * .3 + i * .8);
      ctx.strokeStyle = rgba(c, .38); ctx.lineWidth = 1;
      ctx.beginPath(); ctx.ellipse(0, 0, 13 + i * 3, 4.5 + i * 1.2, 0, 0, TAU); ctx.stroke();
      ctx.restore();
    }
    towCore(c, 0, 0, 3.8, tt * 4);
    for (let i = 0; i < 4; i++) {
      const a = i / 4 * TAU + Math.PI / 4;
      ctx.fillStyle = rgba(c, .6);
      poly(Math.cos(a) * 11, Math.sin(a) * 11, 2, 3, a); ctx.fill();
    }
  } else if (arch === 'acid') {
    /* injector cannon: chemical pods and needle */
    ctx.fillStyle = '#0b1d0b'; ctx.strokeStyle = rgba(c, .75);
    rr(-10, -7, 8, 14, 3); ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(90,220,90,.35)';
    ctx.beginPath(); ctx.arc(-6, -3, 2.6, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(-6, 4, 2.6, 0, TAU); ctx.fill();
    ctx.fillStyle = '#12280f';
    rr(-2, -3.5, 17, 7, 2); ctx.fill();
    ctx.strokeStyle = rgba(c, .85); ctx.stroke();
    ctx.fillStyle = '#d9ffbc';
    rr(15 - rc * 2, -1.6, 8, 3.2, 1); ctx.fill();
    ctx.strokeStyle = rgba(c, .5); ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(1, -6); ctx.lineTo(9, -6); ctx.stroke();
    ctx.beginPath(); ctx.arc(-2, 0, 5, -.7, .7); ctx.stroke();
    towCore(c, -1, 0, 2.8, tt * 5);
  } else if (arch === 'hybrid') {
    /* tri-blade plasma projector */
    for (let i = 0; i < 3; i++) {
      ctx.save(); ctx.rotate(i / 3 * TAU + tt * .35);
      ctx.fillStyle = rgba(c, .55);
      poly(8, 0, 3, 4, 0); ctx.fill();
      ctx.strokeStyle = rgba('#dffcff', .55); ctx.stroke();
      ctx.restore();
    }
    ctx.fillStyle = '#0a1524'; ctx.strokeStyle = rgba(c, .8);
    ctx.beginPath(); ctx.arc(0, 0, 8, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.fillStyle = rgba('#fff3c4', .9); ctx.beginPath(); ctx.arc(0, 0, 3.4, 0, TAU); ctx.fill();
    towCore(c, 0, 0, 4.2, tt * 6);
  } else {
    ctx.fillStyle = rgba(c, .6); poly(2, 0, 8, 5, 0); ctx.fill();
    ctx.strokeStyle = rgba('#dffcff', .45); ctx.stroke();
  }
  ctx.restore();
}

function drawTowerEmblem(ti, cx, cy, s, aim){
  const def = TOWERS[ti];
  if (!def) return;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(s, s);
  const c = def.color;

  /* holographic socket */
  const halo = ctx.createRadialGradient(0, 0, 1, 0, 0, 22);
  halo.addColorStop(0, rgba(c, .16)); halo.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = halo; ctx.beginPath(); ctx.arc(0, 0, 22, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(5,15,27,.82)';
  towHex(19, 6, Math.PI / 6); ctx.fill();
  ctx.strokeStyle = rgba(c, .62); ctx.lineWidth = 1; ctx.stroke();
  towHex(14.6, 6, Math.PI / 6);
  ctx.strokeStyle = rgba(c, .18); ctx.stroke();
  for (let i = 0; i < 6; i++) {
    const a = i / 6 * TAU + Math.PI / 6;
    ctx.fillStyle = rgba(c, .7);
    ctx.fillRect(Math.cos(a) * 17 - 1, Math.sin(a) * 17 - 1, 2, 2);
  }
  ctx.strokeStyle = rgba(c, .28); ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(0, 0, 11.5, -.6, .6); ctx.stroke();
  ctx.beginPath(); ctx.arc(0, 0, 11.5, Math.PI - .6, Math.PI + .6); ctx.stroke();

  /* floating turret */
  ctx.save();
  ctx.translate(0, -1.5);
  ctx.rotate(aim == null ? 0 : aim);
  ctx.scale(1.2, 1.2);
  towerTurretArt(def, 0, null);
  ctx.restore();

  /* ground light and data ticks */
  ctx.globalAlpha = .55;
  ctx.fillStyle = rgba(c, .4);
  ctx.beginPath(); ctx.ellipse(0, 12, 8, 2.2, 0, 0, TAU); ctx.fill();
  ctx.globalAlpha = 1;
  ctx.strokeStyle = rgba(c, .35); ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(-7, 15.5); ctx.lineTo(-3, 15.5); ctx.moveTo(3, 15.5); ctx.lineTo(7, 15.5); ctx.stroke();
  ctx.restore();
}

function drawTower(t){
  const g = game;
  const c = t.type.color;
  const x = t.x, y = t.y, lv = t.level;
  const sel = g.selectedTower === t;
  if (sel) drawRange(t, towerStats(t).range);
  if (t.type.arch === 'support') {
    const r = towerStats(t).range;
    ctx.save();
    ctx.strokeStyle = rgba(c, .14); ctx.lineWidth = 1.1; ctx.setLineDash([2, 10]);
    ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = rgba(c, .03); ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
    ctx.restore();
  }
  ctx.save();
  ctx.translate(x, y);
  if (t.disabledT > 0 && Math.floor(t.disabledT * 12) % 2 === 0) ctx.globalAlpha = .45;
  const tt = g.clock + (t.x || 0) * .07;
  const bob = Math.sin(tt * 1.8) * .8;

  /* projected shadow */
  ctx.fillStyle = 'rgba(0,0,0,.5)';
  ctx.beginPath(); ctx.ellipse(2, 12, 25, 9, 0, 0, TAU); ctx.fill();

  /* anti-grav platform */
  ctx.save();
  ctx.translate(0, 1);
  ctx.fillStyle = '#07182a';
  towHex(24, 8, Math.PI / 8); ctx.fill();
  ctx.strokeStyle = rgba(c, .9); ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = '#0b2238';
  towHex(19, 8, Math.PI / 8); ctx.fill();
  ctx.strokeStyle = rgba(c, .28); ctx.lineWidth = 1; ctx.stroke();
  ctx.strokeStyle = rgba(c, .55); ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(0, 0, 27, -.2 + tt * .15, 1.0 + tt * .15); ctx.stroke();
  ctx.beginPath(); ctx.arc(0, 0, 27, Math.PI - .2 - tt * .1, Math.PI + 1.0 - tt * .1); ctx.stroke();
  for (let i = 0; i < 8; i++) {
    const a = i / 8 * TAU + Math.PI / 8;
    ctx.fillStyle = i % 2 ? rgba(c, .5) : 'rgba(190,245,255,.45)';
    ctx.beginPath(); ctx.arc(Math.cos(a) * 21.5, Math.sin(a) * 21.5, 1.1, 0, TAU); ctx.fill();
  }
  /* landing struts + thruster pads */
  for (let i = 0; i < 4; i++) {
    const a = Math.PI / 4 + i * Math.PI / 2;
    const sx = Math.cos(a) * 14, sy = Math.sin(a) * 14;
    ctx.strokeStyle = 'rgba(87,230,255,.18)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(sx * .55, sy * .35); ctx.lineTo(sx, sy); ctx.stroke();
    ctx.fillStyle = rgba(c, .55);
    ctx.beginPath(); ctx.arc(sx, sy, 1.4, 0, TAU); ctx.fill();
  }
  /* tether to floating turret */
  ctx.strokeStyle = rgba(c, .26); ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, -2); ctx.lineTo(0, -8 + bob); ctx.stroke();
  ctx.restore();

  /* floating turret */
  ctx.save();
  ctx.translate(0, -7 + bob);
  ctx.rotate(t.aim);
  ctx.scale(1.2, 1.2);
  towerTurretArt(t.type, t.recoil || 0, t);
  ctx.restore();

  /* level diamonds */
  for (let i = 0; i < 5; i++) {
    const filled = i < lv;
    ctx.save(); ctx.translate(-12 + i * 6, 31); ctx.rotate(Math.PI / 4);
    ctx.fillStyle = filled ? c : 'rgba(160,220,240,.12)';
    ctx.fillRect(-1.6, -1.6, 3.2, 3.2);
    ctx.strokeStyle = filled ? 'rgba(230,255,255,.55)' : 'rgba(160,220,240,.18)';
    ctx.lineWidth = .6; ctx.strokeRect(-1.6, -1.6, 3.2, 3.2);
    ctx.restore();
  }
  if (t.branch) {
    ctx.save(); ctx.translate(0, -30);
    ctx.rotate(Math.PI / 4);
    ctx.fillStyle = '#5df2d0'; ctx.fillRect(-2.6, -2.6, 5.2, 5.2);
    ctx.strokeStyle = 'rgba(220,255,255,.8)'; ctx.lineWidth = .8; ctx.strokeRect(-2.6, -2.6, 5.2, 5.2);
    ctx.restore();
  }
  if (t.disabledT > 0) txt('干扰', 0, -37, 8, '#ff7ac8', 'center', 700);
  ctx.restore();

  if (sel) {
    ctx.save();
    ctx.strokeStyle = rgba(c, .8); ctx.lineWidth = 1.2; ctx.setLineDash([4, 6]);
    ctx.beginPath(); ctx.arc(x, y, 34 + Math.sin(g.clock * 3) * 2, 0, TAU); ctx.stroke();
    ctx.setLineDash([]); ctx.restore();
  }
}
