  if (!AC) {
    try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; }
  }
  if (AC && AC.state === 'suspended') AC.resume();
}
function tone(freq, dur, type, vol, slideTo, delay){
  if (!AC || muted) return;
  try {
    const t0 = AC.currentTime + (delay || 0);
    const osc = AC.createOscillator();
    const gain = AC.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, t0);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t0 + dur);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(vol || 0.03, t0 + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain); gain.connect(AC.destination);
    osc.start(t0); osc.stop(t0 + dur + 0.02);
  } catch (e) {}
}

(function buildPath(){
  let acc = 0;
  CUM.push(0);
  for (let i = 0; i < WAYPOINTS.length - 1; i++) {
    const a = WAYPOINTS[i], b = WAYPOINTS[i + 1];
    const d = Math.hypot(b.x - a.x, b.y - a.y);
    const steps = Math.max(1, Math.round(d / 2));
    for (let s = 0; s < steps; s++) {
      const t = s / steps;
      PATH.push({ x: lerp(a.x, b.x, t), y: lerp(a.y, b.y, t) });
      if (PATH.length > 1) {
        const p = PATH[PATH.length - 2], q = PATH[PATH.length - 1];
        acc += Math.hypot(q.x - p.x, q.y - p.y);
      }
      CUM.push(acc);
    }
  }
  const last = WAYPOINTS[WAYPOINTS.length - 1];
  const prev = PATH[PATH.length - 1];
  acc += Math.hypot(last.x - prev.x, last.y - prev.y);
  PATH.push({ x: last.x, y: last.y });
  CUM.push(acc);
})();
const PATH_LEN = CUM[CUM.length - 1];

})();
function pathAt(d){
  d = clamp(d, 0, PATH_LEN);
  let lo = 0, hi = CUM.length - 1;
  while (lo < hi - 1) {
    const mid = (lo + hi) >> 1;
    if (CUM[mid] <= d) lo = mid; else hi = mid;
  }
  const ni = Math.min(lo + 1, PATH.length - 1);
  const a = PATH[lo], b = PATH[ni];
  const seg = (CUM[ni] - CUM[lo]) || 1;
  const t = clamp((d - CUM[lo]) / seg, 0, 1);
  let tx = b.x - a.x, ty = b.y - a.y;
  const l = Math.hypot(tx, ty) || 1;
  tx /= l; ty /= l;
  return { x: lerp(a.x, b.x, t), y: lerp(a.y, b.y, t), tx, ty, nx: -ty, ny: tx };
}

/* ============================================================
   绘制：六维宇宙 / 路径 / 核心 / 防御塔 / 敌人 / 特效
   ============================================================ */

function rr(x, y, w, h, r){
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function poly(x, y, r, n, rot){
  ctx.beginPath();
  for (let i = 0; i < n; i++) {
    const a = rot + i / n * TAU;
    const px = x + Math.cos(a) * r, py = y + Math.sin(a) * r;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath();
}
function txt(s, x, y, size, color, align, weight){
  ctx.font = (weight || 600) + ' ' + size + 'px "Segoe UI","Microsoft YaHei",system-ui,sans-serif';
  ctx.fillStyle = color;
  ctx.textAlign = align || 'left';
  ctx.textBaseline = 'middle';
  ctx.fillText(s, x, y);
}
function glowTxt(s, x, y, size, color, align, weight, blur){
  ctx.save();
  ctx.shadowColor = color;
  ctx.shadowBlur = blur == null ? 16 : blur;
  txt(s, x, y, size, color, align, weight);
  ctx.restore();
}
function bar(x, y, w, h, pct, color, bg){
  ctx.fillStyle = bg || 'rgba(255,255,255,.10)';
  rr(x, y, w, h, h / 2); ctx.fill();
  if (pct <= 0) return;
  ctx.fillStyle = color;
  rr(x, y, Math.max(h, w * clamp(pct, 0, 1)), h, h / 2); ctx.fill();
}

/* ---------- 背景 ---------- */
let bgStars = null;
function drawBackground(t){
  const g = game;
  const d = dimOf(g.dimension);
  const P = d.palette;
  const dim = g.dimension;

  const sky = ctx.createLinearGradient(0, 0, W * .6, H);
  sky.addColorStop(0, P.sky0);
  sky.addColorStop(.55, P.sky1);
  sky.addColorStop(1, P.sky2);
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);

  /* 星云 */
  ctx.save();
  ctx.globalCompositeOperation = 'screen';
  const n1 = ctx.createRadialGradient(720, 110, 20, 720, 110, 360);
  n1.addColorStop(0, rgba(P.neb1, .20));
  n1.addColorStop(.55, rgba(P.neb1, .07));
  n1.addColorStop(1, rgba(P.neb1, 0));
  ctx.fillStyle = n1; ctx.fillRect(300, -100, 660, 620);
  const n2 = ctx.createRadialGradient(250, 410, 10, 250, 410, 330);
  n2.addColorStop(0, rgba(P.neb2, .15));
  n2.addColorStop(.6, rgba(P.neb2, .05));
  n2.addColorStop(1, rgba(P.neb2, 0));
  ctx.fillStyle = n2; ctx.fillRect(-90, 80, 680, 560);
  ctx.restore();

  /* 远星 */
  for (const s of stars) {
    const tw = .55 + .45 * Math.sin(t * s.s + s.p);
    ctx.fillStyle = rgba(P.star, (.25 + .55 * s.layer) * tw);
    ctx.beginPath();
    ctx.arc((s.x + t * s.v * .6) % W, s.y, s.r * (dim >= 5 ? 1.15 : 1), 0, TAU);
    ctx.fill();
  }

  /* 维度巨行星 */
  drawPlanet(d, P);

  /* 星尘雾 */
  for (const q of dust) {
    const a = q.a * (.6 + .4 * Math.sin(t * .5 + q.p));
    const gr = ctx.createRadialGradient(q.x, q.y, 0, q.x, q.y, q.r);
    gr.addColorStop(0, rgba(P.lane, a));
    gr.addColorStop(1, rgba(P.lane, 0));
    ctx.fillStyle = gr;
    ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, TAU); ctx.fill();
  }

  /* 全息网格 */
  ctx.save();
  ctx.strokeStyle = rgba(P.lane, .045);
  ctx.lineWidth = 1;
  for (let x = 0; x < W; x += 48) { ctx.beginPath(); ctx.moveTo(x, 56); ctx.lineTo(x, H); ctx.stroke(); }
  for (let y = 56; y < H; y += 48) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  ctx.restore();

  /* 维度水印 */
  ctx.save();
  ctx.font = '900 190px "Segoe UI",sans-serif';
  ctx.fillStyle = rgba(d.color, .035);
  ctx.textAlign = 'right';
  ctx.fillText(d.roman, W - 30, 300);
  ctx.restore();

  /* 终点光环 */
  const cg = ctx.createRadialGradient(CORE.x, CORE.y, 8, CORE.x, CORE.y, 120);
  cg.addColorStop(0, rgba(d.color, .16));
  cg.addColorStop(1, rgba(d.color, 0));
  ctx.fillStyle = cg;
  ctx.beginPath(); ctx.arc(CORE.x, CORE.y, 120, 0, TAU); ctx.fill();

  /* 出生裂隙 */
  ctx.save();
  ctx.translate(-8, 300);
  ctx.rotate(-.2);
  const pg = ctx.createLinearGradient(-40, 0, 40, 0);
  pg.addColorStop(0, rgba(P.neb2, 0));
  pg.addColorStop(.6, rgba(d.color, .5));
  pg.addColorStop(1, rgba(d.color, .05));
  ctx.fillStyle = pg;
  ctx.beginPath(); ctx.ellipse(0, 0, 42, 92, 0, 0, TAU); ctx.fill();
  for (let i = 0; i < 6; i++) {
    ctx.strokeStyle = rgba(d.color, .18 + .12 * Math.sin(t * 2 + i));
    ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.ellipse(0, 0, 14 + i * 6, 40 + i * 9, .2, 0, TAU); ctx.stroke();
  }
  ctx.restore();
}

function drawPlanet(d, P){
  const dim = d.id;

    ctx.strokeStyle = rgba(P.ring, .35);

    gr.addColorStop(1, rgba(P.planet, .1));
    ctx.fillStyle = gr;
    ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
    ctx.strokeStyle = rgba('#c8f0ff', .22);
    ctx.lineWidth = 1;
    for (let i = 0; i < 5; i++) {

    for (let i = 0; i < 5; i++) {
      ctx.beginPath(); ctx.ellipse(x, y, r + 14 + i * 11, r * .65 + i * 8, .4 + i * .06, 0, TAU); ctx.stroke();
    }
    ctx.fillStyle = 'rgba(6,16,22,.8)';
    ctx.beginPath(); ctx.arc(x, y, r - 2, 0, TAU); ctx.fill();
    for (let i = 0; i < 6; i++) {
      const a = i / 6 * TAU;
      ctx.fillStyle = rgba(d.color, .5);
      ctx.beginPath(); ctx.arc(x + Math.cos(a) * (r - 8), y + Math.sin(a) * (r - 8), 3, 0, TAU); ctx.fill();
    }
  } else {

    gr.addColorStop(1, 'rgba(20,12,2,0)');
    ctx.fillStyle = gr;
    ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();

  }
  ctx.restore();
}

  ctx.lineWidth = 44;
  ctx.stroke(pathLine);
  ctx.strokeStyle = rgba(P.pathBase, .95);
  ctx.lineWidth = 32;
  ctx.stroke(pathLine);
  ctx.strokeStyle = rgba(P.pathIn, .95);
  ctx.lineWidth = 22;
  ctx.stroke(pathLine);

  ctx.strokeStyle = rgba(P.lane, .5);
  ctx.lineWidth = 1.6;
  ctx.setLineDash([9, 17]);
  ctx.lineDashOffset = -t * 26;
  ctx.beginPath();
  ctx.moveTo(PATH[0].x, PATH[0].y);
  for (let i = 1; i < PATH.length; i++) ctx.lineTo(PATH[i].x, PATH[i].y);
  ctx.stroke();
  ctx.setLineDash([]);

  for (let dpos = 70; dpos < PATH_LEN - 30; dpos += 128) {
    const p = pathAt(dpos);
    const a = Math.atan2(p.ty, p.tx);
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(a);
    ctx.fillStyle = rgba(P.lane, .75);
    ctx.beginPath();
    ctx.moveTo(5, 0); ctx.lineTo(-4, -4); ctx.lineTo(-2, 0); ctx.lineTo(-4, 4);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  for (let dpos = 0; dpos < PATH_LEN; dpos += 26) {
    const p = pathAt(dpos);
    ctx.fillStyle = rgba(P.lane, .08);
    ctx.beginPath(); ctx.arc(p.x, p.y, 1.4, 0, TAU); ctx.fill();
  }
  ctx.restore();
}

function drawRange(t, range){
  ctx.save();
  ctx.fillStyle = rgba(t.type.color, .045);
  ctx.beginPath(); ctx.arc(t.x, t.y, range, 0, TAU); ctx.fill();
  ctx.strokeStyle = rgba(t.type.color, .35);
  ctx.lineWidth = 1.2;
  ctx.setLineDash([6, 8]);
  ctx.beginPath(); ctx.arc(t.x, t.y, range, 0, TAU); ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
}

/* ---------- 核心 ---------- */
function drawCore(t){
  const g = game;
  const d = dimOf(g.dimension);
  const c = d.color;
  const pulse = 1 + .05 * Math.sin(t * 3);
  const flash = g.coreFlash;
  ctx.save();
  ctx.translate(CORE.x, CORE.y);

  const gr = ctx.createRadialGradient(0, 0, 4, 0, 0, 74);
  gr.addColorStop(0, rgba(c, .55));
  gr.addColorStop(.34, rgba(c, .18));
  gr.addColorStop(1, rgba(c, 0));
  ctx.fillStyle = gr;
  ctx.beginPath(); ctx.arc(0, 0, 74, 0, TAU); ctx.fill();

  for (let i = 0; i < 3; i++) {
    ctx.strokeStyle = rgba(c, .22 - i * .05);
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.ellipse(0, 0, 42 + i * 10, 30 + i * 8, t * (.15 + i * .06) + i, 0, TAU);
    ctx.stroke();
  }

  ctx.rotate(t * .25);
  poly(0, 0, 31 * pulse, 6, Math.PI / 6);
  const cg = ctx.createLinearGradient(-24, -24, 24, 24);
  cg.addColorStop(0, '#ffffff');
  cg.addColorStop(.35, c);
  cg.addColorStop(1, 'rgba(8,18,34,.9)');
  ctx.fillStyle = cg;
  ctx.fill();
  ctx.strokeStyle = rgba('#ffffff', .75);
  ctx.lineWidth = 1.6;
  ctx.stroke();

  ctx.rotate(-t * .45);
  poly(0, 0, 19, 3, -Math.PI / 2);
  ctx.fillStyle = rgba('#ffffff', .30);
  ctx.fill();

  ctx.rotate(t * .2);
  ctx.strokeStyle = rgba(c, .65);
  ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.arc(0, 0, 39, .2, 2.2); ctx.stroke();
  ctx.beginPath(); ctx.arc(0, 0, 39, Math.PI + .2, Math.PI + 2.2); ctx.stroke();

  if (flash > 0) {
    ctx.fillStyle = rgba('#ff5a6e', flash * .5);
    ctx.beginPath(); ctx.arc(0, 0, 46, 0, TAU); ctx.fill();
  }
  ctx.restore();

  txt('核心', CORE.x, CORE.y + 55, 9, rgba(c, .9), 'center', 700);
}

/* ---------- 防御塔 ---------- */
function drawTower(t){
  const g = game;
  const c = t.type.color;
  const x = t.x, y = t.y;
  const lv = t.level;
  const sel = g.selectedTower === t;
  if (sel) drawRange(t, towerStats(t).range);

  if (t.type.arch === 'support') {
    const r = towerStats(t).range;
    ctx.save();
    ctx.strokeStyle = rgba(c, .17);
    ctx.lineWidth = 1.2;
    ctx.setLineDash([3, 9]);
    ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = rgba(c, .04);
    ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
    ctx.restore();
  }

  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = 'rgba(0,0,0,.38)';
  ctx.beginPath(); ctx.ellipse(2, 8, 20, 10, 0, 0, TAU); ctx.fill();

  if (t.disabledT > 0) {
    if (Math.floor(t.disabledT * 12) % 2 === 0) ctx.globalAlpha = .45;
  }

  poly(0, 0, 20, 6, Math.PI / 6);
  ctx.fillStyle = '#0d1728';
  ctx.fill();
  ctx.strokeStyle = rgba(c, .8);
  ctx.lineWidth = 1.6;
  ctx.stroke();
  poly(0, 0, 14, 6, Math.PI / 6);
  ctx.strokeStyle = rgba(c, .25);
  ctx.lineWidth = 1;
  ctx.stroke();

  ctx.save();
  ctx.rotate(t.aim);
  const recoil = t.recoil * 4;
  const arch = t.type.arch;
  if (arch === 'pulse' || arch === 'flame' || arch === 'frost' || arch === 'acid') {
    ctx.fillStyle = rgba(c, .9);
    rr(-6, -6, 18 - recoil, 12, 5); ctx.fill();
    ctx.fillStyle = '#0a1220';
    ctx.beginPath(); ctx.arc(1, 0, 5, 0, TAU); ctx.fill();
    ctx.fillStyle = c;
    ctx.beginPath(); ctx.arc(1, 0, 2.6, 0, TAU); ctx.fill();
    if (arch === 'flame') {
      ctx.fillStyle = rgba('#ffd166', .9);
      ctx.beginPath(); ctx.moveTo(13, -5); ctx.lineTo(22, 0); ctx.lineTo(13, 5); ctx.closePath(); ctx.fill();
    }
    if (arch === 'frost') {
      ctx.strokeStyle = rgba('#ffffff', .8);
      ctx.beginPath(); ctx.moveTo(12, -6); ctx.lineTo(17, 0); ctx.lineTo(12, 6); ctx.stroke();
    }
  } else if (arch === 'storm' || arch === 'hybrid') {
    ctx.strokeStyle = c;
    ctx.lineWidth = 2;
    for (let i = 0; i < 3; i++) {
      ctx.beginPath(); ctx.arc(2, 0, 7 + i * 3, -.9, .9); ctx.stroke();
    }
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(6, 0, 3, 0, TAU); ctx.fill();
    if (arch === 'hybrid') {
      ctx.strokeStyle = rgba('#ffd166', .85);
      ctx.beginPath(); ctx.arc(0, 0, 10, 0, TAU); ctx.stroke();
    }
  } else if (arch === 'rail' || arch === 'beam' || arch === 'mortar') {
    ctx.fillStyle = arch === 'mortar' ? '#2a160c' : '#101a28';
    rr(-6, -5, arch === 'rail' ? 30 : 24, 10, 4); ctx.fill();
    ctx.strokeStyle = rgba(c, .85);
    ctx.lineWidth = 1.4;
    rr(-6, -5, arch === 'rail' ? 30 : 24, 10, 4); ctx.stroke();
    ctx.fillStyle = c;
    ctx.fillRect(arch === 'rail' ? 20 : 15, -2, 5, 4);
    if (arch === 'beam') {
      ctx.strokeStyle = rgba(c, .5);
      ctx.beginPath(); ctx.moveTo(4, -8); ctx.lineTo(4, 8); ctx.stroke();
    }
    if (arch === 'mortar') {
      ctx.rotate(-.5);
      ctx.fillStyle = '#1a0e08';
      rr(-2, -5, 18, 10, 5); ctx.fill();
      ctx.strokeStyle = rgba(c, .9); ctx.stroke();
    }
  } else if (arch === 'nova') {
    ctx.strokeStyle = c;
    ctx.lineWidth = 2;
    for (let i = 0; i < 4; i++) {
      const a = i / 4 * TAU + t.recoil * .4;
      ctx.beginPath(); ctx.moveTo(Math.cos(a) * 5, Math.sin(a) * 5);
      ctx.lineTo(Math.cos(a) * 15, Math.sin(a) * 15); ctx.stroke();
    }
    ctx.fillStyle = rgba('#ffffff', .9);
    ctx.beginPath(); ctx.arc(0, 0, 4.5, 0, TAU); ctx.fill();
  } else if (arch === 'gravity') {
    ctx.strokeStyle = rgba(c, .9);
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, 8, 0, TAU); ctx.stroke();
    ctx.beginPath(); ctx.arc(3, 0, 4, 0, TAU); ctx.fillStyle = rgba('#000', .85); ctx.fill();
    ctx.fillStyle = rgba('#ffffff', .85);
    ctx.beginPath(); ctx.arc(3, 0, 1.5, 0, TAU); ctx.fill();
  } else if (arch === 'drone') {
    ctx.fillStyle = rgba(c, .85);
    for (let i = 0; i < 3; i++) {
      ctx.beginPath(); ctx.arc(2 + i * 6, -4 + (i % 2) * 8, 2.4, 0, TAU); ctx.fill();
    }
    ctx.strokeStyle = rgba(c, .6);
    ctx.beginPath(); ctx.arc(6, 0, 10, 0, TAU); ctx.stroke();
  } else if (arch === 'support') {
    poly(0, 0, 7, 4, Math.PI / 4);
    ctx.fillStyle = rgba(c, .9); ctx.fill();
    ctx.strokeStyle = rgba('#ffffff', .6); ctx.lineWidth = 1; ctx.stroke();
  } else {
    ctx.fillStyle = rgba(c, .9);
    rr(-5, -5, 16, 10, 4); ctx.fill();
  }
  ctx.restore();

  ctx.strokeStyle = rgba(c, sel ? .9 : .55);
  ctx.lineWidth = sel ? 2 : 1;
  ctx.beginPath(); ctx.arc(0, 0, 23, 0, TAU); ctx.stroke();

  for (let i = 0; i < 5; i++) {
    ctx.fillStyle = i < lv ? c : 'rgba(255,255,255,.14)';
    ctx.beginPath(); ctx.arc(-8 + i * 4, 25, 1.5, 0, TAU); ctx.fill();
  }
  if (t.branch) {
    ctx.save();
    ctx.rotate(Math.PI / 4);
    ctx.fillStyle = '#ffd166';
    ctx.fillRect(-2.5, -20, 5, 5);
    ctx.restore();
  }
  if (t.disabledT > 0) {
    ctx.fillStyle = rgba('#ff5a6e', .9);
    txt('干扰', 0, -30, 8, '#ff5a6e', 'center', 700);
  }
  ctx.restore();
}

/* ---------- 敌人 ---------- */
function drawEnemy(e){
  if (e.dead) return;
  const g = game;
  const r = e.r;
  const flash = e.hitFlash;
  const phased = e.phased;
  ctx.save();
  ctx.translate(e.x, e.y);
  ctx.globalAlpha = phased ? .28 : 1;

  if (e.boss) {
    const gr = ctx.createRadialGradient(0, 0, r * .3, 0, 0, r * 2.4);
    gr.addColorStop(0, rgba(e.color, .28));
    gr.addColorStop(1, rgba(e.color, 0));
    ctx.fillStyle = gr;
    ctx.beginPath(); ctx.arc(0, 0, r * 2.4, 0, TAU); ctx.fill();
  }

  ctx.save();
  if (e.type.shape === 'dart' || e.type.shape === 'ghost' || e.type.shape === 'leech') ctx.rotate(e.angle);
  const bob = Math.sin(e.t * 5 + r) * 1.2;
  ctx.translate(0, bob);

  if (e.type.shape === 'dart') {
    ctx.fillStyle = rgba(e.color, .95);
    ctx.beginPath();
    ctx.moveTo(r, 0); ctx.lineTo(-r * .8, -r * .7); ctx.lineTo(-r * .35, 0); ctx.lineTo(-r * .8, r * .7);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = rgba('#ffffff', .5); ctx.lineWidth = 1; ctx.stroke();
    ctx.fillStyle = '#07101c';
    ctx.beginPath(); ctx.arc(r * .25, 0, 2, 0, TAU); ctx.fill();
  } else if (e.type.shape === 'ghost') {
    ctx.fillStyle = rgba(e.color, .18);
    ctx.strokeStyle = rgba(e.color, .85);
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(0, -r * .2, r * .8, Math.PI, 0);
    ctx.lineTo(r * .8, r * .55);
    for (let i = 0; i < 3; i++) ctx.lineTo(r * .8 - (i + .5) * r * .55, r * .15);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = rgba('#ffffff', .9);
    ctx.beginPath(); ctx.arc(-r * .25, -r * .2, 1.6, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(r * .25, -r * .2, 1.6, 0, TAU); ctx.fill();
  } else if (e.type.shape === 'tank' || e.type.shape === 'shield') {
    const gr = ctx.createLinearGradient(-r, -r, r, r);
    gr.addColorStop(0, rgba(e.color, 1));
    gr.addColorStop(1, 'rgba(8,14,26,.95)');
    ctx.fillStyle = gr;
    rr(-r * .9, -r * .8, r * 1.8, r * 1.6, 5); ctx.fill();
    ctx.strokeStyle = rgba(e.color, .9);
    ctx.lineWidth = 1.4; ctx.stroke();
    ctx.fillStyle = rgba('#ffffff', .85);
    ctx.fillRect(-r * .35, -r * .3, r * .3, 2.5);
    ctx.fillRect(r * .1, -r * .3, r * .3, 2.5);
    ctx.fillStyle = 'rgba(0,0,0,.5)';
    ctx.fillRect(-r * .5, r * .25, r, 3);
  } else if (e.type.shape === 'healer' || e.type.shape === 'summoner') {
    ctx.fillStyle = rgba(e.color, .9);
    poly(0, 0, r, 6, e.t * .4); ctx.fill();
    ctx.strokeStyle = rgba('#ffffff', .6); ctx.lineWidth = 1.2; ctx.stroke();
    ctx.strokeStyle = rgba('#7ee6c0', .8);
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, -r * .55); ctx.lineTo(0, r * .55); ctx.moveTo(-r * .35, 0); ctx.lineTo(r * .35, 0); ctx.stroke();
  } else if (e.type.shape === 'boss' || e.type.shape === 'final') {
    drawBossBody(e, r);
  } else if (e.type.shape === 'bomber') {
    ctx.fillStyle = rgba(e.color, .95);
    poly(0, 0, r, 8, e.t * .6); ctx.fill();
    ctx.strokeStyle = 'rgba(255,220,120,.8)'; ctx.lineWidth = 1.2; ctx.stroke();
    ctx.fillStyle = '#1a0603';
    ctx.beginPath(); ctx.arc(0, 0, r * .35, 0, TAU); ctx.fill();
  } else if (e.type.shape === 'splitter' || e.type.shape === 'apex') {
    ctx.fillStyle = rgba(e.color, .9);
    poly(0, 0, r, 5, e.t * .7); ctx.fill();
    ctx.strokeStyle = rgba('#ffffff', .55); ctx.lineWidth = 1.2; ctx.stroke();
    ctx.strokeStyle = rgba('#ffffff', .45);
    ctx.beginPath(); ctx.moveTo(-r * .6, 0); ctx.lineTo(r * .6, 0); ctx.stroke();
  } else if (e.type.shape === 'siege') {
    ctx.fillStyle = rgba(e.color, .9);
    rr(-r * .8, -r * .7, r * 1.6, r * 1.4, 4); ctx.fill();
    ctx.strokeStyle = rgba('#ffffff', .5); ctx.lineWidth = 1; ctx.stroke();
    ctx.fillStyle = '#0a140a';
    ctx.beginPath(); ctx.arc(0, 0, r * .35, 0, TAU); ctx.fill();
    ctx.fillStyle = rgba(e.color, .9);
    ctx.fillRect(-r * .2, -r * 1.1, r * .4, r * .5);
  } else {
    ctx.fillStyle = rgba(e.color, .92);
    ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.fill();
    ctx.strokeStyle = rgba('#ffffff', .5); ctx.lineWidth = 1.2; ctx.stroke();
    ctx.fillStyle = '#08101a';
    ctx.beginPath(); ctx.arc(-r * .3, -r * .15, 1.8, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(r * .3, -r * .15, 1.8, 0, TAU); ctx.fill();
  }

  if (e.elite) {
    ctx.strokeStyle = rgba(e.elite.color, .9);
    ctx.lineWidth = 2;
    ctx.setLineDash([4, 5]);
    ctx.beginPath(); ctx.arc(0, 0, r + 6, e.t * .8, e.t * .8 + TAU); ctx.stroke();
    ctx.setLineDash([]);
  }
  if (e.shield > 0) {
    ctx.strokeStyle = rgba('#c58bff', .55 + .25 * Math.sin(e.t * 4));
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(0, 0, r + 9, 0, TAU); ctx.stroke();
  }
  if (e.slowT > 0) {
    ctx.strokeStyle = 'rgba(160,230,255,.55)';
    ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.arc(0, 0, r + 4, 0, TAU); ctx.stroke();
  }
  ctx.restore();

  if (flash > 0) {
    ctx.fillStyle = 'rgba(255,255,255,' + (flash * .5) + ')';
    ctx.beginPath(); ctx.arc(0, 0, r + 2, 0, TAU); ctx.fill();
  }

  if (e.boss) {
    drawBossBadge(e, r);
  } else {
    const frac = clamp(e.hp / e.maxHp, 0, 1);
    const w = Math.max(22, r * 2.4);
    if (frac < 1 || e.elite) {
      ctx.fillStyle = 'rgba(3,6,12,.8)';
      rr(-w / 2, -r - 13, w, 4, 2); ctx.fill();
      ctx.fillStyle = frac > .5 ? '#7ee66f' : frac > .22 ? '#ffd166' : '#ff5a6e';
      rr(-w / 2, -r - 13, Math.max(2, w * frac), 4, 2); ctx.fill();
      if (e.shield > 0) {
        ctx.fillStyle = rgba('#c58bff', .8);
        rr(-w / 2, -r - 17, w * clamp(e.shield / e.maxShield, 0, 1), 2, 1); ctx.fill();
      }
    }
    if (e.elite) txt(e.elite.name, 0, -r - 22, 7, e.elite.color, 'center', 700);
  }
  ctx.restore();
}

function drawBossBody(e, r){
  const final = e.type.final;
  const gr = ctx.createRadialGradient(-r * .3, -r * .35, r * .15, 0, 0, r);
  gr.addColorStop(0, final ? '#fff4d0' : rgba(e.color, .95));
  gr.addColorStop(.45, rgba(e.color, .95));
  gr.addColorStop(.8, final ? '#6a4710' : rgba(e.color, .35));
  gr.addColorStop(1, 'rgba(6,4,10,.95)');
  ctx.fillStyle = gr;
  ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.fill();
  ctx.strokeStyle = rgba(final ? '#ffd166' : e.color, .9);
  ctx.lineWidth = 2;
  ctx.stroke();

  ctx.fillStyle = 'rgba(10,4,8,.92)';
  ctx.beginPath();
  ctx.moveTo(-r * .95, -r * .55);
  ctx.lineTo(-r * .45, -r * 1.15);
  ctx.lineTo(-r * .15, -r * .72);
  ctx.lineTo(r * .15, -r * .72);
  ctx.lineTo(r * .45, -r * 1.15);
  ctx.lineTo(r * .95, -r * .55);
  ctx.lineTo(r * .62, -r * .2);
  ctx.lineTo(-r * .62, -r * .2);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = rgba('#ffd166', .55); ctx.lineWidth = 1.2; ctx.stroke();

  if (final) {
    for (let i = 0; i < 3; i++) {
      const a = -Math.PI / 2 + (i - 1) * .55;
      ctx.fillStyle = '#ffd166';
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * r * .55, Math.sin(a) * r * .55);
      ctx.lineTo(Math.cos(a - .08) * r * 1.2, Math.sin(a - .08) * r * 1.2);
      ctx.lineTo(Math.cos(a + .08) * r * 1.2, Math.sin(a + .08) * r * 1.2);
      ctx.closePath(); ctx.fill();
    }
  }

  ctx.fillStyle = '#12030a';
  ctx.beginPath(); ctx.arc(-r * .32, -r * .12, r * .15, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(r * .32, -r * .12, r * .15, 0, TAU); ctx.fill();
  ctx.fillStyle = '#fff3c0';
  ctx.beginPath(); ctx.arc(-r * .28, -r * .14, r * .055, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(r * .36, -r * .14, r * .055, 0, TAU); ctx.fill();

  ctx.fillStyle = '#0e0308';
  ctx.beginPath();
  ctx.moveTo(-r * .42, r * .28);
  ctx.lineTo(-r * .2, r * .58);
  ctx.lineTo(0, r * .36);
  ctx.lineTo(r * .2, r * .58);
  ctx.lineTo(r * .42, r * .28);
  ctx.lineTo(r * .3, r * .72);
  ctx.lineTo(-r * .3, r * .72);
  ctx.closePath(); ctx.fill();
}
function drawBossBadge(e, r){
  const final = e.type.final;
  const w = final ? 86 : 66;
  ctx.fillStyle = 'rgba(8,4,8,.82)';
  rr(-w / 2, -r - 18, w, 5, 2); ctx.fill();
  ctx.fillStyle = final ? '#ffd166' : rgba(e.color, .95);
  rr(-w / 2, -r - 18, Math.max(3, w * clamp(e.hp / e.maxHp, 0, 1)), 5, 2); ctx.fill();
  txt(final ? '统御者' : e.type.name, 0, -r - 26, 8, final ? '#ffd166' : '#ffd0d8', 'center', 700);
}

/* ---------- 子弹 / 粒子 / 特效 ---------- */
function drawProjectile(p){
  if (typeof fxDrawProjectile === 'function') { fxDrawProjectile(p); return; }
  ctx.save();
  if (p.trail && p.trail.length > 1) {
    ctx.strokeStyle = rgba(p.color, .25);
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(p.trail[0].x, p.trail[0].y);
    for (let i = 1; i < p.trail.length; i++) ctx.lineTo(p.trail[i].x, p.trail[i].y);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
  }
  ctx.shadowColor = p.color;
  ctx.shadowBlur = p.kind === 'mortar' ? 14 : 9;
  ctx.fillStyle = p.color;
  ctx.beginPath();
  ctx.arc(p.x, p.y, p.kind === 'mortar' ? 6 : 3.4, 0, TAU);
  ctx.fill();
  if (p.crit) {
    ctx.strokeStyle = '#ffd166';
    ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.arc(p.x, p.y, 6, 0, TAU); ctx.stroke();
  }
  ctx.restore();
}
function drawParticles(){
  const g = game;
  for (const p of g.particles) {
    const a = clamp(p.life / p.max, 0, 1);
    ctx.fillStyle = rgba(p.color, a);
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size * a, 0, TAU); ctx.fill();
  }
}
function drawFx(){
  for (const f of game.fx) {
    const a = clamp(f.life / f.max, 0, 1);
    if (f.kind === 'ring') {
      const rr2 = lerp(f.r0, f.r1, 1 - a);
      ctx.strokeStyle = rgba(f.color, a * .8);
      ctx.lineWidth = f.width * a + .5;
      ctx.beginPath(); ctx.arc(f.x, f.y, rr2, 0, TAU); ctx.stroke();
      ctx.strokeStyle = rgba('#ffffff', a * .25);
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(f.x, f.y, rr2 * .94, 0, TAU); ctx.stroke();
    } else if (f.kind === 'beam') {
      ctx.save();
      ctx.strokeStyle = rgba(f.color, a);
      ctx.lineWidth = f.width;
      ctx.shadowColor = f.color;
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.moveTo(f.pts[0].x, f.pts[0].y);
      for (let i = 1; i < f.pts.length; i++) ctx.lineTo(f.pts[i].x, f.pts[i].y);
      ctx.stroke();
      ctx.strokeStyle = rgba('#ffffff', a * .7);
      ctx.lineWidth = Math.max(1, f.width * .38);
      ctx.stroke();
      ctx.restore();
    }
  }
  if (typeof fxDrawFx === 'function') fxDrawFx();
}
function drawFloaters(){
  for (const f of game.floaters) {
    const a = clamp(f.life / f.max, 0, 1);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.shadowColor = 'rgba(0,0,0,.8)';
    ctx.shadowBlur = 4;
    txt(f.text, f.x, f.y, f.size, f.color, 'center', 800);
    ctx.restore();
  }
}
function drawTargeting(){
  const g = game;
  if (g.targeting !== 'meteor') return;
  const x = g.mx, y = g.my;
  ctx.save();
  ctx.strokeStyle = 'rgba(255,138,74,.9)';
  ctx.lineWidth = 2;
  ctx.setLineDash([6, 6]);
  ctx.beginPath(); ctx.arc(x, y, 70, 0, TAU); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = 'rgba(255,138,74,.12)';
  ctx.beginPath(); ctx.arc(x, y, 70, 0, TAU); ctx.fill();
  ctx.strokeStyle = 'rgba(255,209,102,.8)';
  ctx.beginPath(); ctx.moveTo(x - 12, y); ctx.lineTo(x + 12, y); ctx.moveTo(x, y - 12); ctx.lineTo(x, y + 12); ctx.stroke();
  ctx.restore();
}

function drawWorld(t){
  const g = game;
  ctx.save();
  if (g.shake > .3) ctx.translate(rand(-g.shake, g.shake), rand(-g.shake, g.shake));
  drawBackground(t);
  drawPath(t);
  drawCore(t);
  const towers = g.towers.slice().sort((a, b) => a.y - b.y);
  for (const tw of towers) drawTower(tw);
  if (typeof fxAmbient === 'function') fxAmbient(t);
  for (const e of g.enemies) if (!e.dead) drawEnemy(e);
  for (const p of g.projectiles) drawProjectile(p);
  drawParticles();
  drawFx();
  drawFloaters();
  drawTargeting();
  ctx.restore();
}
/* ============================================================
   逻辑：维度 / 波次 / 敌人 / 防御塔 / 专精 / 首领 / 奖励
   ============================================================ */

/* ---------- 数值缩放 ---------- */
function hpMul(dim, wave){
  dim = dim || 1; wave = wave || 1;
  const tier = (typeof game !== 'undefined' && game && game.tier) ? game.tier : ((dim - 1) * 3 + 1);
  let m = 1 + (wave - 1) * 0.10 + (dim - 1) * 0.16 + (wave - 1) * (dim - 1) * 0.012 + (tier - 1) * 0.035;
  if (typeof game !== 'undefined' && game && game.challenge) m *= 1.8;
  return m;
}
function spdMul(dim, wave){
  dim = dim || 1; wave = wave || 1;
  const tier = (typeof game !== 'undefined' && game && game.tier) ? game.tier : ((dim - 1) * 3 + 1);
  let m = 1 + (wave - 1) * 0.018 + (dim - 1) * 0.022 + (tier - 1) * 0.006;
  if (typeof game !== 'undefined' && game && game.challenge) m *= 1.22;
  return m;
}

/* ---------- 波次生成 ---------- */
function planWave(dim, wave){
  const list = [];
  if (wave <= 0) return { dim, wave, list, boss: false, summary: {} };
  const boss = wave === WAVES_PER_DIM || (wave > WAVES_PER_DIM && wave % WAVES_PER_DIM === 0);
  const pool = dimPool(dim).slice();
  let budget = (58 + 38 * wave + 5 * wave * wave) * (1 + 0.28 * (dim - 1)) * (boss ? 0.52 : 1);
  if (typeof game !== 'undefined' && game && game.challenge) budget *= 1.45;
  const maxN = Math.min(34, 6 + wave * 2 + dim);
  const weight = [5, 3, 2.3, 1.55, 1.15];
  let guard = 0;
  while (list.length < maxN && budget > 0 && guard++ < 240) {
    let total = 0;
    for (let i = 0; i < pool.length; i++) total += (weight[i] || 1);
    let r = Math.random() * total, key = pool[0];
    for (let i = 0; i < pool.length; i++) {
      r -= (weight[i] || 1);
      if (r <= 0) { key = pool[i]; break; }
    }
    const base = ENEMY_TYPES[key];
    const cost = base ? base.hp * (base.boss ? 8 : 1) : 40;
    if (cost > budget && list.length >= 4) break;
    budget -= cost;
    list.push({ key, at: 0.4 + list.length * 0.58, elite: null });
  }
  while (list.length < 5) list.push({ key: pool[0], at: 0.4 + list.length * 0.65, elite: null });
  const eliteCount = Math.min(4, Math.floor((dim + wave) / 3));
  for (let i = 0; i < eliteCount; i++) {
    const cand = list.filter(x => !x.elite && !ENEMY_TYPES[x.key].boss);
    if (!cand.length) break;
    pick(cand).elite = pick(ELITE_MODS);
  }
  if (boss) {
    list.push({ key: dimOf(dim).boss, at: (list[list.length - 1] ? list[list.length - 1].at : 1) + 2.6, elite: null });
  }
  const summary = {};
  for (const it of list) summary[it.key] = (summary[it.key] || 0) + 1;
  return { dim, wave, list, boss, summary };
}

function startWave(){
  const g = game;
  if (g.state !== 'build') return false;
  if (g.loadout.length !== LOADOUT_SIZE) return false;
  g.wave++;
  let plan = g.nextPlan;
  if (!plan || plan.wave !== g.wave || plan.dim !== g.dimension) {
    plan = planWave(g.dimension, g.wave);
    plan.wave = g.wave;
  }
  g.plan = plan;
  g.queue = plan.list.map(it => ({ ...it }));
  g.waveResolved = false;
  g.spawnTimer = 0;
  g.state = 'fight';
  g.buildType = -1;
  g.targeting = null;
  g.selectedTower = null;
  g.tutorialT = 0;
  const d = dimOf(g.dimension);
  setBanner('维度 ' + d.roman + ' · 第 ' + g.wave + ' / ' + WAVES_PER_DIM + ' 波',
    plan.boss ? '⚠ ' + ENEMY_TYPES[d.boss].name + ' 正在降临' : '守住核心',
    plan.boss ? '#ff4d6d' : d.color, 2.2);
  sfx(plan.boss ? 'boss' : 'start');
  return true;
}

/* ---------- 敌人 ---------- */
function makeEnemy(key, dim, wave, elite, opts){
  opts = opts || {};
  const base = ENEMY_TYPES[key] || ENEMY_TYPES.scout;
  const hp = Math.max(4, Math.round(base.hp * hpMul(dim, wave) * (opts.hpMul || 1)));
  const e = {
    key, type: base, boss: !!base.boss, final: !!base.final,
    hp, maxHp: hp,
    speed: base.speed * spdMul(dim, wave) * (opts.speedMul || 1),
    baseDmg: base.dmg, reward: base.reward * (opts.rewardMul || 1),
    r: base.r * (opts.scale || 1),
    armor: base.armor || 0,
    resist: base.resist || 0,
    color: base.color,
    lane: opts.lane == null ? rand(-5, 5) : opts.lane,
    dist: opts.dist || 0,
    t: rand(0, 10),
    angle: 0,
    x: 0, y: 0,
    hitFlash: 0,
    slowT: 0, slowAmt: 0,
    stun: 0,
    burnT: 0, burnDps: 0,
    poisonT: 0, poisonDps: 0,
    armorShred: 0,
    shield: base.shield || 0,
    maxShield: base.shield || 0,
    shieldT: 0,
    regen: base.regen || 0,
    berserk: false,
    enraged: false,
    child: !!opts.child,
    elite: null,
    phaseClock: rand(0, 6),
    phased: false,
    healT: base.heal ? rand(1, 3) : 0,
    summonT: base.summon || (base.boss ? 8 : 0),
    siegeT: base.siege || 0,
    dashCd: base.boss ? 12 : 0,
    dashT: 0,
    shockT: base.boss ? 11 : 0,
    rainT: base.boss ? 14 : 0,
    phaseT: 0,
    phaseCd: base.final ? 15 : 0,
    disruptT: base.disrupt || 0,
    phase2: false
  };
  if (elite) {
    e.elite = elite;
    elite.apply(e);
    e.maxHp = Math.max(e.maxHp, e.hp);
    e.maxShield = Math.max(e.maxShield, e.shield);
  }
  if (base.shield) e.maxShield = Math.max(e.maxShield, e.shield);
  const p = pathAt(e.dist);
  e.x = p.x + p.nx * e.lane;
  e.y = p.y + p.ny * e.lane;
  e.angle = Math.atan2(p.ty, p.tx);
  return e;
}

function spawnEnemy(item){
  const g = game;
  const e = makeEnemy(item.key, g.dimension, g.wave, item.elite);
  g.enemies.push(e);
  if (e.boss) {
    g.boss = e;
    shakeScreen(10);
    addRing(e.x, e.y, 20, 160, e.color, 0.9, 4);
    addBurst(e.x, e.y, e.color, 40, 140);
  }
  return e;
}

function updateSpawn(dt){
  const g = game;
  g.spawnTimer += dt;
  while (g.queue.length && g.queue[0].at <= g.spawnTimer) {
    spawnEnemy(g.queue.shift());
  }
}

function updateEnemies(dt){
  const g = game;
  for (const e of g.enemies) {
    if (e.dead) continue;
    e.t += dt;
    e.hitFlash = Math.max(0, e.hitFlash - dt * 4);
    if (e.slowT > 0) { e.slowT -= dt; if (e.slowT <= 0) e.slowAmt = 0; }
    if (e.stun > 0) e.stun -= dt;
    if (e.armorShred > 0) e.armorShred = Math.max(0, e.armorShred - dt * 0.08);
    if (e.shieldT > 0) e.shieldT -= dt;
    if (e.shield < e.maxShield && e.shieldT <= 0) {
      e.shield = Math.min(e.maxShield, e.shield + e.maxShield * 0.035 * dt);
    }
    if (e.type.phase) {
      e.phaseClock += dt;
      e.phased = (e.phaseClock % 5.6) < 2.1;
    }
    if (e.burnT > 0) {
      e.burnT -= dt;
      damageEnemy(e, e.burnDps * dt, 'fire', { silent: true, trueDmg: true });
      if (e.dead) continue;
    }
    if (e.poisonT > 0) {
      e.poisonT -= dt;
      damageEnemy(e, e.poisonDps * dt, 'bio', { silent: true, trueDmg: true });
      if (e.dead) continue;
    }
    if (e.regen > 0) e.hp = Math.min(e.maxHp, e.hp + e.maxHp * e.regen * dt);

    if (e.type.heal) {
      e.healT -= dt;
      if (e.healT <= 0) {
        e.healT = 3.2;
        for (const o of g.enemies) {
          if (o.dead || o === e || dist2(o.x, o.y, e.x, e.y) > 130 * 130) continue;
          o.hp = Math.min(o.maxHp, o.hp + o.maxHp * 0.08);
        }
        addRing(e.x, e.y, 8, 130, '#7ee6c0', 0.45, 2);
      }
    }
    if (e.type.summon) {
      e.summonT -= dt;
      if (e.summonT <= 0) {
        e.summonT = e.boss ? 11 : 8;
        const minions = e.type.minions || [dimPool(g.dimension)[0]];
        const n = e.boss ? 3 : 2;
        for (let i = 0; i < n; i++) {
          const child = makeEnemy(pick(minions), g.dimension, g.wave, null, {
            dist: Math.max(0, e.dist - 6 - i * 7), lane: rand(-12, 12), hpMul: .55, scale: .8, rewardMul: .35
          });
          g.enemies.push(child);
          addRing(child.x, child.y, 2, 22, e.color, 0.35, 2);
        }
        addFloater(e.x, e.y - e.r - 14, e.boss ? '召唤军团!' : '孵化!', e.color, 12);
      }
    }
    if (e.type.siege) {
      e.siegeT -= dt;
      if (e.siegeT <= 0) {
        e.siegeT = e.boss ? 7 : 5.5;
        let best = null, bd = 190 * 190;
        for (const t of g.towers) {
          if (t.disabledT > 0) continue;
          const d = dist2(t.x, t.y, e.x, e.y);
          if (d < bd) { bd = d; best = t; }
        }
        if (best) {
          best.disabledT = 2.0;
          addBeam([{ x: e.x, y: e.y }, { x: best.x, y: best.y }], '#ff7a5a', 2, 0.3);
          addFloater(best.x, best.y - 28, '压制!', '#ff7a5a', 10);
        }
      }
    }
    if (e.type.disrupt) {
      e.disruptT -= dt;
      if (e.disruptT <= 0) {
        e.disruptT = e.type.disrupt;
        const live = g.towers.filter(t => t.disabledT <= 0);
        if (live.length) {
          const victim = pick(live);
          victim.disabledT = e.boss ? 1.8 : 1.2;
          addBeam([{ x: e.x, y: e.y }, { x: victim.x, y: victim.y }], '#ff7ac8', 2.2, 0.35);
          addFloater(victim.x, victim.y - 30, '干扰!', '#ff7ac8', 10);
          addRing(e.x, e.y, 6, 26, '#ff7ac8', .3, 2);
        }
      }
    }
    if (e.type.enrage && !e.enraged && e.hp < e.maxHp * 0.4) {
      e.enraged = true;
      e.speed *= 1.45;
      addFloater(e.x, e.y - e.r - 18, '狂暴!', '#ffb066', 11);
      addRing(e.x, e.y, 4, e.r + 18, '#ffb066', .35, 2);
    }
    if (e.boss && !e.enraged && e.hp < e.maxHp * 0.32) {
      e.enraged = true;
      e.speed *= 1.22;
      setBanner(e.type.name + ' · 暴怒', '它的速度变快了', '#ff4d6d', 1.8);
      shakeScreen(8);
    }
    let spd = e.speed;
    if (e.slowT > 0) spd *= 1 - e.slowAmt * (1 - (e.type.slowResist || 0));
    if (e.stun > 0) spd = 0;
    if (e.berserk && e.hp < e.maxHp * 0.4) spd *= 1.45;
    if (e.dashT > 0) spd *= 2.4;
    e.dist += spd * dt;
    if (e.dist >= PATH_LEN) { leak(e); continue; }
    const p = pathAt(e.dist);
    e.x = p.x + p.nx * e.lane;
    e.y = p.y + p.ny * e.lane;
    e.angle = Math.atan2(p.ty, p.tx);
  }
  g.enemies = g.enemies.filter(e => !e.dead);
  if (g.boss && g.boss.dead) g.boss = null;
}

function leak(e){
  const g = game;
  if (e.dead) return;
  e.dead = true;
  g.leaks++;
  damageCore(e.baseDmg);
  if (e.type.leech) {
    g.energy = Math.max(0, g.energy - e.type.leech);
    addFloater(CORE.x, CORE.y - 70, '-' + e.type.leech + ' 能量', '#ff7ac8', 12);
  }
  addBurst(e.x, e.y, '#ff5a6e', e.boss ? 50 : 14, e.boss ? 180 : 80);
  if (e.boss) { g.boss = null; shakeScreen(18); }
}

function damageCore(n){
  const g = game;
  if (g.state !== 'fight') return;
  g.hp = Math.max(0, g.hp - n);
  g.coreFlash = 1;
  shakeScreen(Math.min(16, 5 + n * 0.4));
  addRing(CORE.x, CORE.y, 18, 74, '#ff5a6e', 0.55, 3);
  addFloater(CORE.x, CORE.y - 44, '-' + Math.round(n), '#ff5a6e', 16);
  sfx('leak');
  if (g.hp <= 0) gameOver();
}

function applySlow(e, amount, dur){
  if (e.dead) return;
  amount *= (1 - (e.type.slowResist || 0));
  if (amount >= e.slowAmt) e.slowAmt = amount;
  e.slowT = Math.max(e.slowT, dur);
}
function applyBurn(e, dps, dur){
  e.burnDps = Math.max(e.burnDps || 0, dps);
  e.burnT = Math.max(e.burnT || 0, dur);
}
function applyPoison(e, dps, dur, shred){
  e.poisonDps = Math.max(e.poisonDps || 0, dps);
  e.poisonT = Math.max(e.poisonT || 0, dur);
  if (shred) e.armorShred = Math.min(.5, e.armorShred + shred);
}

function damageEnemy(e, amount, dmgType, opts){
  opts = opts || {};
  if (!e || e.dead || e.phased) return 0;
  let dmg = amount;
  if (!opts.trueDmg) {
    const armor = (e.armor || 0) * (1 - (e.armorShred || 0)) * (1 - (opts.pierce || 0) * 0.5);
    if (dmgType === 'energy' || dmgType === 'void') dmg *= 1 - armor * 0.45;
    else dmg *= 1 - armor;
    if (e.resist) dmg *= 1 - e.resist;
    const ward = e.type.ward && e.type.ward[dmgType];
    if (ward) dmg *= 1 - ward;
  }
  if (e.shield > 0) {
    const shieldMul = dmgType === 'energy' ? 1.35 : dmgType === 'void' ? 1.2 : .85;
    const absorbed = Math.min(e.shield, dmg * shieldMul);
    e.shield -= absorbed;
    dmg = Math.max(0, dmg - absorbed / shieldMul);
    e.shieldT = 3.2;
    if (e.shield <= 0) { e.shield = 0; addRing(e.x, e.y, 4, e.r + 14, '#c58bff', 0.3, 2); }
  }
  if (dmg <= 0) { e.hitFlash = 1; return 0; }
  e.hp -= dmg;
  e.hitFlash = 1;
  if (!opts.silent) {
    const big = dmg >= 60;
    addFloater(e.x + rand(-6, 6), e.y - e.r - 6, String(Math.round(dmg)),
      opts.crit ? '#ffd166' : big ? '#ffffff' : rgba(e.color, 0.95), opts.crit ? 16 : big ? 14 : 11);
  }
  if (e.hp <= 0) killEnemy(e);
  return dmg;
}

function killEnemy(e){
  const g = game;
  if (e.dead) return;
  e.dead = true;
  g.kills++;
  const energy = 3 + g.mods.energy;
  addEnergy(energy);
  const sc = e.reward * 10;
  addScore(sc);
  addFloater(e.x, e.y - e.r - 14, '+' + sc, '#ffd166', e.boss ? 18 : 11);
  addBurst(e.x, e.y, e.color, e.boss ? 70 : 12, e.boss ? 220 : 90);
  sfx(e.boss ? 'bossdown' : 'kill');
  if (e.type.split && !e.child) {
    const n = e.type.split;
    for (let i = 0; i < n; i++) {
      const child = makeEnemy(e.type.splitKey || 'larva', g.dimension, g.wave, null, {
        hpMul: 0.3, speedMul: 1.15, scale: 0.62, rewardMul: 0.3, child: true,
        dist: Math.max(0, e.dist - 3 + i * 6), lane: e.lane + (i ? 9 : -9)
      });
      g.enemies.push(child);
      addRing(child.x, child.y, 2, 22, e.color, 0.35, 2);
    }
  }
  if (e.type.boom) {
    const x = e.x, y = e.y, r = e.type.boom;
    for (const t of g.towers) {
      if (dist2(t.x, t.y, x, y) < r * r) {
        t.disabledT = Math.max(t.disabledT, 1.5);
        addFloater(t.x, t.y - 28, '干扰!', '#ff5a4a', 9);
      }
    }
    addRing(x, y, 6, r, '#ff5a4a', 0.5, 3);
    addBurst(x, y, '#ff8a4a', 24, 120);
  }
  if (e.elite) {
    addEnergy(8);
    if (Math.random() < 0.45) dropCard();
  }
  if (e.boss) bossDefeated(e);
}

function bossDefeated(e){
  const g = game;
  g.boss = null;
  const bonus = 500 + g.dimension * 250;
  g.score += bonus;
  addEnergy(80 + g.dimension * 10);
  shakeScreen(20);
  addRing(e.x, e.y, 20, 280, e.color, 1.1, 4);
  addRing(e.x, e.y, 10, 170, '#ffd166', 0.8, 3);
  addBurst(e.x, e.y, '#ffd166', 100, 280);
  setBanner(e.type.name + ' 陨落', '+' + bonus + ' 积分 · +' + (80 + g.dimension * 10) + ' 能量', '#ffd166', 3);
  sfx('bossdown');
}

/* ---------- 效果 ---------- */
function addEnergy(n){
  const g = game;
  g.energy += n;
  g.energyFlash = 0.5;
}
function addScore(n){
  const g = game;
  g.score += n;
}
function addFloater(x, y, text, color, size){
  const g = game;
  if (!g || g.floaters.length > 80) return;
  g.floaters.push({ x, y, text: String(text), color: color || '#fff', size: size || 12, life: 0.9, max: 0.9, vy: -32 });
}
function addBurst(x, y, color, n, power){
  const g = game;
  if (!g) return;
  n = n || 10;
  power = power || 90;
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), sp = rand(power * 0.2, power);
    g.particles.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      life: rand(0.3, 0.85), max: 0.85, size: rand(1.2, 3.4),
      color, gravity: rand(-10, 30), drag: 0.94
    });
  }
  while (g.particles.length > 900) g.particles.shift();
}
function addRing(x, y, r0, r1, color, life, width){
  if (!game) return;
  game.fx.push({ kind: 'ring', x, y, r0, r1, color, life: life || 0.5, max: life || 0.5, width: width || 2.5 });
}
function addBeam(pts, color, width, life){
  if (!game) return;
  game.fx.push({ kind: 'beam', pts, color, width: width || 2, life: life || 0.18, max: life || 0.18 });
}
function shakeScreen(n){
  if (!game) return;
  game.shake = Math.max(game.shake, n);
}

/* ---------- 防御塔 ---------- */
function buildCost(ti){ return Math.max(10, Math.round(TOWERS[ti].cost * (1 - game.mods.discount))); }
function toggleLoadout(ti){
  const g = game;
  if (g.state !== 'loadout') return false;
  if (!TOWERS[ti]) return false;
  const at = g.loadout.indexOf(ti);
  if (at >= 0) { g.loadout.splice(at, 1); sfx('click'); return true; }

function upgradeCost(t){ return Math.round(t.type.cost * (0.85 + 0.65 * (t.level - 1)) * (1 - game.mods.discount)); }
function supportBonus(t){
  let dmg = 0, rate = 0;

  for (const s of game.towers) {
    if (s === t || s.type.arch !== 'support' || s.disabledT > 0) continue;

function towerStats(t){

    dmg: d.dmg * 0.85 * mul * (1 + g.mods.dmg) * (1 + (b.dmg || 0)) * (1 + sup.dmg),

    range: (d.range + (lv - 1) * 4) * 0.98 * (1 + g.mods.range) * (1 + (b.range || 0)),
    splash: (d.splash || 0) * (1 + (b.splash || 0)),
    slow: clamp((d.slow || 0) + (b.slow || 0), 0, 0.85),
    slowDur: (d.slowDur || 0) + (b.slowDur || 0),
    chain: (d.chain || 0) + (b.chain || 0),
    pierce: (d.pierce || 0) + (b.pierce || 0),
    burn: (d.burn || 0) + (b.burn || 0),
    poison: (d.poison || 0) + (b.poison || 0),
    stun: (b.stun || 0) + (d.stun || 0),
    pull: (d.pull || 0) + (b.pull || 0),

function fire(t, target){

function spawnBolt(t, st, e, scale, kind){

    color: t.type.color, dmgType: t.type.dmgType,
    splash: st.splash, slow: st.slow, slowDur: st.slowDur,

function beamAttack(t, st, target, rail){
  const g = game;
  const a = { x: t.x, y: t.y - 12 };
  const dx = target.x - a.x, dy = target.y - a.y;
  const len = Math.hypot(dx, dy) || 1;
  const ux = dx / len, uy = dy / len;
  const maxHit = 1 + st.pierce;
  const hits = [];
  for (const e of g.enemies) {
    if (e.dead || e.phased) continue;
    const px = e.x - a.x, py = e.y - a.y;
    const proj = px * ux + py * uy;
    if (proj < 0 || proj > st.range) continue;
    const perp = Math.abs(px * -uy + py * ux);
    if (perp > e.r + 8) continue;

  hits.sort((p, q) => p.proj - q.proj);
  let end = { x: a.x + ux * st.range, y: a.y + uy * st.range };

    const e = hits[i].e;

function stormChain(t, st, first){

function updateTowers(dt){

function updateProjectiles(dt){
  const g = game;

    if (!e || e.dead) { p.life = 0; continue; }

      p.life = 0;

    }
    let cur = Math.atan2(p.vy, p.vx);
    let want = Math.atan2(dy, dx);
    let diff = ((want - cur + Math.PI * 3) % TAU) - Math.PI;
    cur += clamp(diff, -10 * dt, 10 * dt);
    p.vx = Math.cos(cur) * p.speed;
    p.vy = Math.sin(cur) * p.speed;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.trail.push({ x: p.x, y: p.y });
    if (p.trail.length > 14) p.trail.shift();

    g.enemies.push(e);
    addRing(e.x, e.y, 2, 26, boss.color, 0.4, 2);
  }
  addFloater(boss.x, boss.y - boss.r - 16, '召唤!', boss.color, 14);

}
function bossShock(boss){

function bossRain(boss){

  shakeScreen(10);
  sfx('meteor');
}
function updateBoss(dt){
  const g = game;
  const b = g.boss;
  if (!b || b.dead) return;
  const skills = b.type.skills || [];
  if (b.dashT > 0) b.dashT -= dt;
  if (b.phaseT > 0) {
    b.phaseT -= dt;
    b.phased = b.phaseT > 0;
    if (!b.phased) addRing(b.x, b.y, 6, b.r + 30, b.color, 0.5, 2);
  }
  if (skills.includes('dash')) {
    b.dashCd -= dt;
    if (b.dashCd <= 0) {
      b.dashCd = 14;
      b.dashT = 1.6;
      addFloater(b.x, b.y - b.r - 20, '冲锋!', '#ff8a4a', 14);
      addBurst(b.x, b.y, '#ff8a4a', 24, 130);
    }
  }
  if (skills.includes('summon')) {
    b.summonT -= dt;
    if (b.summonT <= 0) { b.summonT = 10; summonMinions(b, b.final ? 4 : 3); }
  }
  if (skills.includes('shock')) {
    b.shockT -= dt;
    if (b.shockT <= 0) { b.shockT = 15; bossShock(b); }
  }
  if (skills.includes('rain')) {
    b.rainT -= dt;
    if (b.rainT <= 0) { b.rainT = 13; bossRain(b); }
  }
  if (skills.includes('phase') && b.final) {
    b.phaseCd -= dt;
    if (b.phaseCd <= 0 && b.phaseT <= 0) {
      b.phaseT = 2.2;
      b.phaseCd = 18;
      setBanner(b.type.name + ' · 相位转移', '它在维度之间闪烁', b.color, 1.8);
      sfx('phase');
    }
  }
  if (b.final && !b.phase2 && b.hp < b.maxHp * 0.5) {
    b.phase2 = true;
    b.speed *= 1.18;
    b.armor += .08;
    setBanner(b.type.name + ' · 统御形态', '前五个维度的力量正在汇聚', '#ffd166', 2.6);
    addRing(b.x, b.y, 20, 300, '#ffd166', 1.2, 5);
    shakeScreen(16);
    sfx('phase');
  }
}

/* ---------- 奖励 / 卡牌 ---------- */
function rollRewards(n){
  const g = game;
  const pool = UPGRADES.filter(u => (g.upgrades[u.id] || 0) < u.max);
  const picks = [];
  while (picks.length < n && pool.length) {
    const i = Math.floor(Math.random() * pool.length);
    picks.push(pool.splice(i, 1)[0]);
  }
  while (picks.length < n) picks.push(UPGRADE_MAP.heal);
  return picks;
}
function chooseReward(i){
  const g = game;
  if (g.state !== 'reward' || !g.rewardChoices) return false;
  const u = g.rewardChoices[i];
  if (!u) return false;
  u.apply(g);
  g.upgrades[u.id] = (g.upgrades[u.id] || 0) + 1;
  g.rewardChoices = null;
  g.state = 'build';
  g.nextPlan = planWave(g.dimension, g.wave + 1);
  g.nextPlan.wave = g.wave + 1;
  addFloater(W / 2, 300, u.name, u.color, 18);
  addRing(W / 2, 300, 20, 160, u.color, 0.7, 3);
  sfx('reward');
  setBanner('强化已生效', u.name, u.color, 2);
  return true;
}
function skipReward(){
  const g = game;
  if (g.state !== 'reward') return false;
  g.rewardChoices = null;
  g.state = 'build';
  g.nextPlan = planWave(g.dimension, g.wave + 1);
  g.nextPlan.wave = g.wave + 1;
  addEnergy(45);
  addFloater(W / 2, 300, '+45 能量', '#5ad8ff', 16);
  sfx('click');
  return true;
}
function dropCard(){
  const g = game;
  if (g.cards.length >= 5) return;
  const def = pick(CARDS);
  g.cards.push({ def, t: 0 });
  sfx('card');
  addFloater(W - 150, 110, '获得卡牌', def.color, 12);
}
function useCard(i){
  const g = game;
  const slot = g.cards[i];
  if (!slot) return false;
  g.cards.splice(i, 1);
  slot.def.apply(g);
  addRing(CORE.x, CORE.y, 10, 90, slot.def.color, 0.6, 3);
  addFloater(CORE.x, CORE.y - 64, slot.def.name, slot.def.color, 14);
  sfx('card');
  return true;
}

/* ---------- 波次结算 / 维度推进 ---------- */
function resolveWave(){
  const g = game;
  if (g.waveResolved || g.state !== 'fight') return;
  g.waveResolved = true;
  const total = (g.dimension - 1) * WAVES_PER_DIM + g.wave;
  const eb = 30 + 8 * total;
  const sb = 80 + 20 * total;
  addEnergy(eb);
  addScore(sb);
  addFloater(W / 2, 250, '+' + eb + ' 能量  +' + sb + ' 积分', '#7ee66f', 16);
  setBanner('第 ' + g.wave + ' 波 清除', '+' + eb + ' 能量 · +' + sb + ' 积分', '#7ee66f', 2.2);
  sfx('wave');
  if (Math.random() < 0.3) dropCard();

  if (!g.endless && g.wave >= WAVES_PER_DIM) {
    if (g.dimension >= DIMENSIONS.length) { victory(); return; }
    g.state = 'dimension';
    g.dimensionT = 0;
    g.selectedTower = null;
    g.buildType = -1;
    addScore(500 + g.dimension * 150);
    bestDim = Math.max(bestDim, g.dimension);
    store.set('abyss_best_dim', bestDim);
    sfx('dimension');
    return;
  }
  g.state = 'reward';
  g.rewardChoices = rollRewards(3);
  g.rewardT = 0;
  g.selectedTower = null;
  g.buildType = -1;
}
function nextDimension(){
  const g = game;
  if (g.state !== 'dimension') return false;
  if (g.dimension >= DIMENSIONS.length) return false;
  beginDimension(g.dimension + 1);
  return true;
}
function gameOver(){
  const g = game;
  if (g.state === 'over') return;
  g.state = 'over';
  g.endT = 0;
  g.selectedTower = null;
  g.best = Math.max(g.best, g.score);
  bestScore = g.best;
  store.set('abyss_best_v2', bestScore);
  if (g.energyFlash !== undefined) g.energyFlash = 0;
  sfx('over');
}
function victory(){
  const g = game;
  g.state = 'victory';
  g.endT = 0;
  g.best = Math.max(g.best, g.score);
  bestScore = g.best;
  bestDim = DIMENSIONS.length;
  store.set('abyss_best_v2', bestScore);
  store.set('abyss_best_dim', bestDim);
  sfx('victory');
}
function continueEndless(){
  const g = game;
  if (g.state !== 'victory') return;
  g.endless = true;
  g.state = 'build';
  g.wave = WAVES_PER_DIM;
  g.nextPlan = planWave(g.dimension, g.wave + 1);
  g.nextPlan.wave = g.wave + 1;
  setBanner('无尽维度', '统御者已陨落，但维度仍在回响', '#c58bff', 2.6);
  sfx('start');
}

/* ---------- 更新 ---------- */
function updateVisual(dt){
  const g = game;
  g.clock += dt;
  g.dimensionT += dt;
  g.shake = Math.max(0, g.shake - dt * 30);
  g.coreFlash = Math.max(0, g.coreFlash - dt * 3);
  g.energyFlash = Math.max(0, g.energyFlash - dt * 3);
  g.bannerT = Math.max(0, g.bannerT - dt);
  g.tutorialT = Math.max(0, g.tutorialT - dt);
  for (const p of g.particles) {
    p.life -= dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += p.gravity * dt;
    p.vx *= Math.pow(p.drag, dt * 60);
    p.vy *= Math.pow(p.drag, dt * 60);
  }
  g.particles = g.particles.filter(p => p.life > 0);
  for (const f of g.floaters) {
    f.life -= dt;
    f.y += f.vy * dt;
    f.vy *= 0.94;
  }
  g.floaters = g.floaters.filter(f => f.life > 0);
  for (const f of g.fx) f.life -= dt;
  g.fx = g.fx.filter(f => f.life > 0);
  for (const c of g.cards) c.t += dt;
  if (g.rewardChoices) g.rewardT += dt;
  if (g.state === 'over' || g.state === 'victory' || g.state === 'dimension') g.endT += dt;
}
function update(dt){
  const g = game;
  updateVisual(dt);
  if (g.state === 'fight') {
    g.runTime += dt;
    updateSpawn(dt);
    updateEnemies(dt);
    if (g.state !== 'fight') return;
    updateTowers(dt);
    updateProjectiles(dt);
    updateSkills(dt);
    updateBoss(dt);
    if (g.state === 'fight' && g.queue.length === 0 && g.enemies.length === 0 && !g.waveResolved) resolveWave();
  }
}

/* ---------- 热点 ---------- */
function addHot(id, x, y, w, h, act, tip, dis){
  game.hotspots.push({ id, x, y, w, h, act, tip, dis: !!dis });
}
function blockRect(x, y, w, h){
  game.hotspots.push({ id: 'block', x, y, w, h, act: null, tip: null, block: true });
}
function fullBlock(y0){
  blockRect(0, y0 == null ? 0 : y0, W, H - (y0 == null ? 0 : y0));
}
function hotAt(x, y){
  const hs = game.hotspots;
  for (let i = hs.length - 1; i >= 0; i--) {
    const h = hs[i];
    if (x >= h.x && x <= h.x + h.w && y >= h.y && y <= h.y + h.h) return h;
  }
  return null;
}
function isHot(x, y){
  const h = hotAt(x, y);
  return h && !h.block ? h : null;
}
function wrapText(s, maxW, size){
  const lines = [];
  let line = '';
  for (const ch of String(s)) {
    if (ch === '\n') { lines.push(line); line = ''; continue; }
    if (ctx.measureText(line + ch).width > maxW && line) { lines.push(line); line = ch; }
    else line += ch;
  }
  if (line) lines.push(line);
  return lines;
}

/* ---------- 渲染 ---------- */
function render(){
  if (!game) newGame();
  const g = game;
  g.hotspots = [];
  g.hoverHot = null;

  ctx.clearRect(0, 0, W, H);
  drawWorld(g.clock);

  if (g.state === 'menu') {
    drawMenu();
    g.hoverHot = isHot(g.mx, g.my);
    drawTooltip();
    return;
  }

  drawPlacementPreview();
  drawTopBar();
  drawCardRail();
  drawWaveControl();
  if (g.boss) drawBossBar();
  if (g.state === 'build' || g.state === 'fight') {
    drawBuildBar();
    drawSkillBar();
    drawSelectedPanel();
  }
  drawBanner();

  if (g.state === 'reward') drawReward();
  if (g.paused && g.state !== 'reward' && g.state !== 'over' && g.state !== 'victory') drawPause();
  if (g.state === 'over') drawGameOver();
  if (g.state === 'victory') drawVictory();
  if (g.state === 'dimension') drawDimension();

  g.hoverHot = isHot(g.mx, g.my);
  drawTooltip();
}

/* ---------- 输入 ---------- */
function togglePause(){
  const g = game;
  if (g.state !== 'fight' && g.state !== 'build') return;
  g.paused = !g.paused;
  if (g.paused) setBanner('已暂停', '按空格或点击继续', '#8ab4ff', 1.2);
  sfx('pause');
}
function cycleSpeed(){
  const g = game;
  if (g.state !== 'fight' && g.state !== 'build') return;
  g.speed = g.speed === 1 ? 2 : g.speed === 2 ? 3 : 1;
  sfx('click');
}
function cancelAction(){
  const g = game;
  if (g.targeting) { g.targeting = null; sfx('click'); return; }
  if (g.buildType >= 0) { g.buildType = -1; sfx('click'); return; }
  if (g.selectedTower) { g.selectedTower = null; sfx('click'); return; }
  if (g.paused) { g.paused = false; sfx('pause'); }
}
function pointerPos(ev){
  const r = canvas.getBoundingClientRect();
  return { x: (ev.clientX - r.left) * (W / r.width), y: (ev.clientY - r.top) * (H / r.height) };
}
function onPointerDown(ev){
  if (ev.button === 2) { cancelAction(); return; }
  if (!game) return;
  initAudio();
  const p = pointerPos(ev);
  game.mx = p.x; game.my = p.y;
  const h = hotAt(p.x, p.y);
  if (h) {
    if (h.block || h.dis) { if (h.dis) sfx('error'); return; }
    if (h.act) h.act();
    return;
  }
  const g = game;
  if (g.state === 'build') {
    const t = towerAt(p.x, p.y);
    if (t) { g.selectedTower = t; g.buildType = -1; sfx('select'); return; }
    if (g.buildType >= 0) tryBuild(p.x, p.y);
    else { g.selectedTower = null; }
  } else if (g.state === 'fight') {
    if (g.targeting === 'meteor') { castMeteorAt(p.x, p.y); return; }
    const t = towerAt(p.x, p.y);
    if (t) g.selectedTower = t; else g.selectedTower = null;
  }
}
function onPointerMove(ev){
  if (!game) return;
  const p = pointerPos(ev);
  game.mx = p.x; game.my = p.y;
  game.inside = p.x >= 0 && p.x <= W && p.y >= 0 && p.y <= H;
}
function onPointerLeave(){
  if (!game) return;
  game.inside = false;
  game.mx = -100; game.my = -100;
}
function onKeyDown(e){
  if (!game) return;
  const k = e.key;
  const g = game;
  if (k >= '1' && k <= '4') {
    if (g.state !== 'build') return;
    const list = dimTowers(g.dimension);
    const idx = Number(k) - 1;
    if (idx < list.length) {
      const ti = towerIndex(list[idx].key);
      g.buildType = g.buildType === ti ? -1 : ti;
      g.targeting = null;
      g.selectedTower = null;
      sfx('select');
    }
    return;
  }
  if (k === 'Escape') { cancelAction(); return; }
  if (k === ' ' || k === 'Spacebar') {
    e.preventDefault();
    if (g.state === 'menu') { startGame(); return; }
    if (g.state === 'fight' || g.state === 'build') togglePause();
    return;
  }
  if (k === 'Enter') {
    e.preventDefault();
    if (g.state === 'menu') startGame();
    else if (g.state === 'build') startWave();
    else if (g.state === 'dimension') nextDimension();
    else if (g.state === 'over' || g.state === 'victory') startGame();
    return;
  }
  if (k === 's' || k === 'S') { cycleSpeed(); return; }
  if (k === 'm' || k === 'M') { muted = !muted; store.set('abyss_muted', muted); sfx('click'); return; }
  if (k === 'q' || k === 'Q') castSkill('bolt');
  else if (k === 'w' || k === 'W') castSkill('nova');
  else if (k === 'e' || k === 'E') castSkill('overclock');
  else if (k === 'r' || k === 'R') castSkill('meteor');
  else if (k === 'u' || k === 'U') { if (g.selectedTower && g.state !== 'menu') upgradeTower(g.selectedTower); }
  else if (k === 'x' || k === 'X') { if (g.selectedTower) sellTower(g.selectedTower); }
}

/* ---------- 主循环 ---------- */
let lastTime = 0;
let accumulator = 0;
function frame(now){
  requestAnimationFrame(frame);
  if (!lastTime) lastTime = now;
  let dt = (now - lastTime) / 1000;
  lastTime = now;
  dt = clamp(dt, 0, .1);
  if (!game) newGame();
  const g = game;
  if (g.introT > 0) g.introT = Math.max(0, g.introT - dt);
  if (g.state === 'fight' && !g.paused) {
    accumulator += dt * g.speed;
    let steps = 0;
    while (accumulator >= 1 / 60 && steps < 10) {
      update(1 / 60);
      accumulator -= 1 / 60;
      steps++;
      if (g.state !== 'fight') { accumulator = 0; break; }
    }
  } else if (!g.paused) {
    updateVisual(dt * (g.state === 'fight' ? g.speed : 1));
  }
  render();
}
function startFrameLoop(){
  lastTime = 0;
  requestAnimationFrame(frame);
}

/* ---------- 测试接口 ---------- */
window.__AG = {
  get game(){ return game; },
  DIMENSIONS, TOWERS, ENEMIES: ENEMY_TYPES, SKILLS, CARDS, UPGRADES,
  PATH, PATH_LEN, CORE, pathAt,
  newGame, startGame, startWave, beginDimension, nextDimension,
  buildTower, tryBuild, upgradeTower, chooseBranch, sellTower, castSkill, castMeteorAt,
  buildCost, upgradeCost, towerStats, validPlacement,
  rollRewards, chooseReward, skipReward, useCard, dropCard, continueEndless,
  towerAt, towerIndex, dimTowers, dimOf, planWave, hpMul, spdMul,
  update, render,
  step(sec){ const n = Math.max(1, Math.round((sec || 1) * 60)); for (let i = 0; i < n; i++) update(1 / 60); },
  click(x, y){ onPointerDown({ button: 0, clientX: x, clientY: y }); },
  clickGame(x, y){
    const r = canvas.getBoundingClientRect();
    onPointerDown({ button: 0, clientX: r.left + x * r.width / W, clientY: r.top + y * r.height / H });
  },
  key(k){ onKeyDown({ key: k, preventDefault() {} }); }
};
window.addEventListener('load', () => { if (game) render(); });

/* ---------- 真实输入绑定 ---------- */
canvas.addEventListener('pointerdown', onPointerDown);
canvas.addEventListener('pointermove', onPointerMove);
canvas.addEventListener('pointerleave', onPointerLeave);
canvas.addEventListener('pointercancel', onPointerLeave);
canvas.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('keydown', onKeyDown);

newGame();
startFrameLoop();
