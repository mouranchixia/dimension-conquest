let starBus = null;
function starMapSound(){
  if(!AC || muted) return;
  window.__starSfxCount = (window.__starSfxCount || 0) + 1;
  try {
    const now = AC.currentTime;
    if(starBus){
      try {
        starBus.gain.cancelScheduledValues(now);
        starBus.gain.setTargetAtTime(0.0001, now, 0.035);
      } catch(e){}
    }
    const t = now + 0.02;
    const master = AC.createGain();
    master.gain.setValueAtTime(0.0001, t);
    master.gain.linearRampToValueAtTime(0.36, t + 0.05);
    master.gain.setValueAtTime(0.36, t + 1.02);
    master.gain.exponentialRampToValueAtTime(0.0001, t + 1.42);
    const comp = AC.createDynamicsCompressor();
    comp.threshold.value = -20; comp.ratio.value = 5;
    master.connect(comp); comp.connect(AC.destination);
    starBus = master;

    function tone(f0, f1, at, dur, vol, type, pan, lp0, lp1){
      const o = AC.createOscillator();
      o.type = type || 'sine';
      o.frequency.setValueAtTime(f0, t + at);
      if(f1) o.frequency.exponentialRampToValueAtTime(Math.max(8, f1), t + at + dur);
      let node = o;
      if(lp0){
        const f = AC.createBiquadFilter();
        f.type = 'lowpass'; f.Q.value = 2.4;
        f.frequency.setValueAtTime(lp0, t + at);
        if(lp1) f.frequency.exponentialRampToValueAtTime(lp1, t + at + dur);
        o.connect(f); node = f;
      }
      if(pan){
        const p = AC.createStereoPanner();
        p.pan.value = pan;
        node.connect(p); node = p;
      }
      const g = AC.createGain();
      g.gain.setValueAtTime(0.0001, t + at);
      g.gain.linearRampToValueAtTime(vol, t + at + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t + at + dur);
      node.connect(g); g.connect(master);
      o.start(t + at); o.stop(t + at + dur + 0.04);
    }

    /* low reactor pulse */
    tone(48, 30, 0, 0.55, 0.06, 'sine', 0);
    /* chart scanner */
    tone(150, 880, 0.015, 0.72, 0.017, 'sawtooth', -0.2, 380, 5600);
    /* data packets resolving */
    for(let i = 0; i < 5; i++){
      tone(980 + i * 130, 0, 0.16 + i * 0.075, 0.03, 0.013, 'square', i % 2 ? 0.3 : -0.3);
    }
    /* lock-on chord */
    tone(90, 32, 0.48, 0.4, 0.065, 'sine', 0);
    tone(660, 0, 0.48, 0.52, 0.018, 'sine', 0.2);
    tone(990, 0, 0.56, 0.45, 0.014, 'sine', -0.25);
    tone(1320, 0, 0.66, 0.34, 0.011, 'sine', 0);
    [220, 440, 660].forEach((f, i) => {
      tone(f, 0, 0.5 + i * 0.02, 0.72, 0.014, i === 1 ? 'triangle' : 'sine', (i - 1) * 0.16);
    });
    /* airy tail */
    tone(1760, 3520, 0.82, 0.38, 0.006, 'sawtooth', 0.3, 2400, 7200);
    if(AC.state === 'suspended') AC.resume();
  } catch(e){}
}

/* ============================================================
   12_power.js — 霸气升级音效 / Boss 压迫场 / 科幻核心反应堆
   不改动任何数值与逻辑，只覆盖表现层。

/* ---------------- 升级音效 ---------------- */
function powerNoise(dur, vol, f0, f1, delay, q){
  if (!AC || muted) return;
  try {
    const t0 = AC.currentTime + (delay || 0);
    const len = Math.max(1, Math.floor(AC.sampleRate * dur));
    const buf = AC.createBuffer(1, len, AC.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++){
      const env = Math.pow(1 - i / len, 2.4);
      data[i] = (Math.random() * 2 - 1) * env;
    }
    const src = AC.createBufferSource();
    src.buffer = buf;
    const bp = AC.createBiquadFilter();
    bp.type = 'bandpass';
    bp.Q.value = q || 1.1;
    bp.frequency.setValueAtTime(f0, t0);
    bp.frequency.exponentialRampToValueAtTime(Math.max(60, f1), t0 + dur);
    const gain = AC.createGain();
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(vol, t0 + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(bp); bp.connect(gain); gain.connect(AC.destination);
    src.start(t0); src.stop(t0 + dur + 0.02);
  } catch (e) {}
}

/* ---------------- Boss 压迫场 ---------------- */
function drawBossPresence(e){
  if (!e || !e.boss || e.dead) return;
  const r = e.r;
  const t = e.t;
  const c = e.color;
  ctx.save();
  ctx.translate(e.x, e.y);

  /* 暗红压迫光晕 */
  let gr = ctx.createRadialGradient(0, 0, r * 0.25, 0, 0, r * 3.5);
  gr.addColorStop(0, 'rgba(80,0,12,.34)');
  gr.addColorStop(0.36, 'rgba(42,0,8,.18)');
  gr.addColorStop(0.72, 'rgba(140,0,24,.08)');
  gr.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = gr;
  ctx.beginPath(); ctx.arc(0, 0, r * 3.5, 0, TAU); ctx.fill();

  /* 地面血池 / 腐蚀环 */
  ctx.fillStyle = 'rgba(32,0,8,.38)';
  ctx.beginPath(); ctx.ellipse(0, r * 0.73, r * 1.9, r * 0.54, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = 'rgba(255,40,60,.16)';
  ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.ellipse(0, r * 0.73, r * 1.55, r * 0.42, 0, 0, TAU); ctx.stroke();

  /* 旋转符文环 */
  for (let i = 0; i < 3; i++){
    ctx.save();
    ctx.rotate(t * (0.12 + i * 0.07) * (i % 2 ? -1 : 1) + i * 0.7);
    ctx.strokeStyle = 'rgba(255,52,72,' + (0.16 - i * 0.035) + ')';
    ctx.lineWidth = 1;
    ctx.setLineDash(i === 1 ? [10, 9] : [3, 7]);
    ctx.beginPath();
    ctx.ellipse(0, 0, r * (1.85 + i * 0.38), r * (0.68 + i * 0.14), 0, 0, TAU);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  }

  /* 触须状暗影 */
  ctx.strokeStyle = 'rgba(150,10,28,.28)';
  ctx.lineWidth = Math.max(1, r * 0.045);
  ctx.lineCap = 'round';
  for (let i = 0; i < 9; i++){
    const a = i / 9 * TAU + t * 0.045;
    const len = r * (1.55 + (i % 3) * 0.34);
    const bx = Math.cos(a) * r * 0.55;
    const by = Math.sin(a) * r * 0.55;
    ctx.beginPath();
    ctx.moveTo(bx, by);
    ctx.quadraticCurveTo(
      Math.cos(a + 0.2) * len * 0.7, Math.sin(a + 0.2) * len * 0.7,
      Math.cos(a - 0.12) * len, Math.sin(a - 0.12) * len
    );
    ctx.stroke();
  }

  /* 向上飘散的余烬 */
  for (let i = 0; i < 11; i++){
    const a = i * 2.399 + t * (0.23 + (i % 3) * 0.05);
    const rad = r * (0.35 + (i % 5) * 0.26);
    const yy = Math.sin(t * 1.4 + i) * r * 0.5 - r * 0.25 - (i % 3) * r * 0.12;
    ctx.fillStyle = 'rgba(255,' + (48 + (i % 4) * 22) + ',56,' + (0.18 + (i % 3) * 0.08) + ')';
    ctx.beginPath();
    ctx.arc(Math.cos(a) * rad, yy, Math.max(0.7, r * 0.025), 0, TAU);
    ctx.fill();
  }

  /* 周期性威胁冲击环 */
  const wave = (t * 0.42) % 1;
  ctx.strokeStyle = 'rgba(255,40,60,' + (0.22 * (1 - wave)) + ')';
  ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.arc(0, 0, r * (1.1 + wave * 2.3), 0, TAU); ctx.stroke();

  /* 底座能量裂痕 */
  ctx.strokeStyle = 'rgba(255,70,70,.22)';
  ctx.lineWidth = 1;
  for (let i = 0; i < 6; i++){
    const a = i / 6 * TAU + 0.3;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a) * r * 0.95, Math.sin(a) * r * 0.42 + r * 0.4);
    ctx.lineTo(Math.cos(a + 0.16) * r * 1.5, Math.sin(a + 0.08) * r * 0.5 + r * 0.55);
    ctx.stroke();
  }

  ctx.restore();
}

  ctx.save();
  ctx.rotate(t * .9);
  poly(0, 0, 8, 3, Math.PI / 2);
  ctx.fillStyle = rgba('#ffffff', .35);
  ctx.fill();
  ctx.restore();

  /* 横向能量透镜光 */
  ctx.strokeStyle = rgba(cc, .18 + .08 * Math.sin(t * 4));
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(-56, 0); ctx.lineTo(56, 0); ctx.stroke();

  /* 向外扩散的扫描环 */
  const scan = (t * .52) % 1;
  ctx.strokeStyle = rgba(cc, (1 - scan) * .42);
  ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.arc(0, 0, 28 + scan * 60, 0, TAU); ctx.stroke();

  /* 三枚轨道卫星 */
  for (let i = 0; i < 3; i++){
    const a = t * .55 + i * TAU / 3;
    const ox = Math.cos(a) * 55;
    const oy = Math.sin(a) * 23;
    ctx.save();
    ctx.translate(ox, oy);
    ctx.rotate(a);
    ctx.fillStyle = rgba(cc, .75);
    ctx.beginPath();
    ctx.moveTo(4, 0); ctx.lineTo(0, 3); ctx.lineTo(-4, 0); ctx.lineTo(0, -3);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  /* 受击闪红 */
  if (g.coreFlash > 0){
    ctx.fillStyle = rgba('#ff5a6e', g.coreFlash * .52);
    ctx.beginPath(); ctx.arc(0, 0, 34, 0, TAU); ctx.fill();
  }

  /* 低血量警报环 */
  if (danger){
    const a = .20 + .16 * Math.sin(t * 7);
    ctx.strokeStyle = rgba('#ff5a6e', a);
    ctx.lineWidth = 1.6;
    ctx.setLineDash([4, 6]);
    ctx.beginPath(); ctx.arc(0, 0, 49, 0, TAU); ctx.stroke();
    ctx.setLineDash([]);
  }

  ctx.restore();

  txt('核心', CORE.x - 10, CORE.y + 58, 9, rgba(cc, .9), 'center', 700);
  txt('CORE // ' + Math.ceil(g.hp), CORE.x - 10, CORE.y + 68, 5.6, rgba(cc, .55), 'center', 600);
}

/* ============================================================
   13_fx.js — per-archetype attack FX
   Pure visual layer. Hooks into 02_logic/03_draw.
   ============================================================ */
function fxRand(a, b){ return a + Math.random() * (b - a); }
function fxTypeColor(t){
  return ({
    kinetic: '#8fe7ff', fire: '#ff8a4a', cryo: '#9fe8ff', energy: '#b79cff',
    bio: '#7cf0a0', void: '#c77dff', gravity: '#c8b0ff', true: '#ffe6a6'
  })[t] || '#dff6ff';
}
function fxAdd(kind, obj){
  if (!game) return;
  const f = Object.assign({ kind, life: .3, color: '#fff' }, obj || {});
  f.max = f.life;
  game.fx.push(f);
  while (game.fx.length > 240) game.fx.shift();
}
function fxSparks(x, y, color, n, power, size, grav){
  if (!game) return;
  n = n || 5; power = power || 80; size = size || 2;
  for (let i = 0; i < n; i++){
    const a = fxRand(0, TAU), sp = fxRand(power * .25, power);
    game.particles.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      life: fxRand(.22, .7), max: .7, size: fxRand(size * .6, size * 1.8),
      color, gravity: grav == null ? 18 : grav, drag: .93
    });
  }
  while (game.particles.length > 900) game.particles.shift();
}

/* ---------------- muzzle ---------------- */
function fxMuzzle(t, target, arch){
  const c = t.type.color || '#fff';
  const ang = Math.atan2(target.y - t.y, target.x - t.x);
  const mx = t.x + Math.cos(ang) * 24;
  const my = t.y - 12 + Math.sin(ang) * 24;
  const heavy = arch === 'rail' || arch === 'beam' || arch === 'mortar' || arch === 'nova';
  fxAdd('charge', { x: t.x, y: t.y - 9, color: c, life: heavy ? .3 : .2, r: heavy ? 30 : 22, seed: fxRand(0, 9) });
  fxAdd('muzzle', { x: mx, y: my, ang, color: c, life: .22, arch, scale: heavy ? 1.35 : 1 });
  fxSparks(mx, my, c, heavy ? 7 : 4, heavy ? 105 : 70, heavy ? 2.4 : 1.7, 0);

  if (arch === 'flame'){
    fxAdd('cone', { x: mx, y: my, ang, color: '#ff8a4a', life: .3, seed: fxRand(0, 9) });
    fxSparks(mx, my, '#ffcf7a', 3, 80, 2, -12);
  } else if (arch === 'frost'){
    fxAdd('shardring', { x: mx, y: my, color: '#bfefff', life: .26, seed: fxRand(0, 9) });
    fxSparks(mx, my, '#e8fbff', 4, 55, 1.6, 4);
  } else if (arch === 'storm'){
    fxSparks(mx, my, '#d9c8ff', 5, 95, 1.8, 0);
  } else if (arch === 'mortar'){
    fxAdd('smoke', { x: mx, y: my, color: '#b9b0a0', life: .6, r: 7, vx: Math.cos(ang) * 12, vy: Math.sin(ang) * 12 });
  } else if (arch === 'rail'){
    addBeam([{ x: mx, y: my }, { x: mx + Math.cos(ang) * 64, y: my + Math.sin(ang) * 64 }], '#ffffff', 2, .1);
    shakeScreen(2);
  } else if (arch === 'gravity'){
    fxAdd('vortex', { x: mx, y: my, color: '#c8b0ff', life: .32, seed: fxRand(0, 9), r: 26 });
  } else if (arch === 'acid'){
    fxSparks(mx, my, '#8dff7a', 4, 65, 2, 40);
  } else if (arch === 'hybrid'){
    fxAdd('vortex', { x: mx, y: my, color: '#c77dff', life: .26, seed: fxRand(0, 9), r: 20 });
  }
}

function fxBoltSpawn(p){
  if (!p) return;
  p.arch = p.arch || p.kind;
  p.seed = fxRand(0, 9);
  fxAdd('spawn', { x: p.x, y: p.y, color: p.color, life: .2, arch: p.arch });
  if (p.arch === 'flame') fxSparks(p.x, p.y, '#ff9a52', 2, 45, 1.6, -8);
  if (p.arch === 'frost') fxSparks(p.x, p.y, '#e8fbff', 2, 40, 1.4, 4);
}

/* ---------------- projectiles ---------------- */
function fxDrawProjectile(p){
  const c = p.color || '#fff';
  const arch = p.arch || p.kind || 'pulse';
  const ang = Math.atan2(p.vy, p.vx);
  ctx.save();
  if (p.trail && p.trail.length > 1){
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 1; i < p.trail.length; i++){
      const q = p.trail[i - 1], r = p.trail[i];
      const a = (i / p.trail.length);
      if (arch === 'flame'){
        ctx.strokeStyle = rgba(i % 2 ? '#ff5a2a' : '#ffb15a', a * .28);
        ctx.lineWidth = 6 + a * 7;
      } else if (arch === 'frost'){
        ctx.strokeStyle = rgba('#bfefff', a * .3);
        ctx.lineWidth = 2 + a * 3;
      } else if (arch === 'mortar' || arch === 'acid'){
        ctx.strokeStyle = rgba(arch === 'acid' ? '#7cf0a0' : '#c7b7a6', a * .24);
        ctx.lineWidth = 5 + a * 8;
      } else {
        ctx.strokeStyle = rgba(c, a * .26);
        ctx.lineWidth = 2 + a * 4;
      }
      ctx.beginPath(); ctx.moveTo(q.x, q.y); ctx.lineTo(r.x, r.y); ctx.stroke();
    }
    ctx.restore();
  }
  if (arch === 'pulse'){
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(ang);
    ctx.globalCompositeOperation = 'lighter';
    const aura = ctx.createRadialGradient(0, 0, 0, 0, 0, 13);
    aura.addColorStop(0, rgba('#ffffff', .34));
    aura.addColorStop(.35, rgba(c, .28));
    aura.addColorStop(1, rgba(c, 0));
    ctx.fillStyle = aura; ctx.beginPath(); ctx.arc(0, 0, 13, 0, TAU); ctx.fill();
    for (const off of [-4, 0, 4]){
      ctx.strokeStyle = rgba(off ? c : '#ffffff', off ? .5 : .95);
      ctx.lineWidth = off ? 1.6 : 2.4;
      ctx.beginPath(); ctx.moveTo(-19 - Math.abs(off) * 2, off); ctx.lineTo(8, off); ctx.stroke();
    }
    ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(2, 0, 4.2, 0, TAU); ctx.fill();
    ctx.strokeStyle = rgba(c, .9); ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.arc(2, 0, 6.4, 0, TAU); ctx.stroke();
    ctx.restore();
  } else if (arch === 'flame'){
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 3; i++){
      const ox = p.trail.length ? p.trail[p.trail.length - 1 - i] : null;
      const x = ox ? ox.x : p.x, y = ox ? ox.y : p.y;
      const g = ctx.createRadialGradient(x, y, 0, x, y, 11 + i * 4);
      g.addColorStop(0, 'rgba(255,250,210,.95)');
      g.addColorStop(.35, 'rgba(255,155,60,.75)');
      g.addColorStop(1, 'rgba(255,60,20,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, 11 + i * 4, 0, TAU); ctx.fill();
    }
    ctx.restore();
  } else if (arch === 'frost'){
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(ang);
    ctx.globalCompositeOperation = 'lighter';
    ctx.shadowColor = '#9fe8ff'; ctx.shadowBlur = 12;
    ctx.fillStyle = 'rgba(210,250,255,.9)';
    for (const s of [-1, 1]){
      ctx.save(); ctx.translate(0, s * 7); ctx.rotate(s * .5);
      ctx.beginPath(); ctx.moveTo(-5, 0); ctx.lineTo(7, 0); ctx.lineTo(2, 2); ctx.lineTo(-4, 2); ctx.closePath(); ctx.fill();
      ctx.restore();
    }
    ctx.beginPath(); ctx.moveTo(12, 0); ctx.lineTo(-2, 4.5); ctx.lineTo(-5, 0); ctx.lineTo(-2, -4.5); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.95)'; ctx.lineWidth = 1; ctx.stroke();
    ctx.restore();
  } else if (arch === 'mortar'){
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    for (let i = 2; i < p.trail.length; i += 2){
      const q = p.trail[i];
      ctx.fillStyle = rgba('#9a8f86', (i / p.trail.length) * .2);
      ctx.beginPath(); ctx.arc(q.x, q.y, 4 + i * .4, 0, TAU); ctx.fill();
    }
    ctx.translate(p.x, p.y); ctx.rotate(ang);
    ctx.shadowColor = '#ff8a4a'; ctx.shadowBlur = 14;
    ctx.fillStyle = '#2b2420'; ctx.beginPath(); ctx.ellipse(0, 0, 9, 6, 0, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#ffb15a'; ctx.lineWidth = 1.6; ctx.stroke();
    ctx.fillStyle = '#ff8a4a'; ctx.beginPath(); ctx.arc(-7, 0, 2.4, 0, TAU); ctx.fill();
    ctx.restore();
  } else if (arch === 'gravity'){
    ctx.save(); ctx.translate(p.x, p.y); ctx.globalCompositeOperation = 'lighter';
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, 18);
    g.addColorStop(0, 'rgba(230,215,255,.95)'); g.addColorStop(.45, 'rgba(160,120,255,.5)'); g.addColorStop(1, 'rgba(100,60,220,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, 18, 0, TAU); ctx.fill();
    for (let i = 0; i < 2; i++){
      ctx.strokeStyle = rgba('#c8b0ff', .65 - i * .2); ctx.lineWidth = 1;
      ctx.beginPath(); ctx.ellipse(0, 0, 8 + i * 4, 4 + i * 2, game.clock * 2 + i, 0, TAU); ctx.stroke();
    }
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, 0, 2.2, 0, TAU); ctx.fill();
    ctx.restore();
  } else if (arch === 'acid'){
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    ctx.shadowColor = '#7cf0a0'; ctx.shadowBlur = 12;
    const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, 9);
    g.addColorStop(0, 'rgba(225,255,220,.95)'); g.addColorStop(.4, 'rgba(80,230,120,.8)'); g.addColorStop(1, 'rgba(20,120,50,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, 9, 0, TAU); ctx.fill();
    ctx.strokeStyle = 'rgba(190,255,180,.65)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(p.x, p.y, 5, 0, TAU); ctx.stroke();
    ctx.restore();
  } else if (arch === 'drone'){
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(ang);
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = 'rgba(10,30,45,.9)'; ctx.strokeStyle = c; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(5, 0); ctx.lineTo(-4, 4); ctx.lineTo(-2, 0); ctx.lineTo(-4, -4); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = rgba(c, .7);
    ctx.beginPath(); ctx.moveTo(-2, -3); ctx.lineTo(2, -7); ctx.moveTo(-2, 3); ctx.lineTo(2, 7); ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, 0, 1.6, 0, TAU); ctx.fill();
    ctx.restore();
  } else {
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = c; ctx.shadowColor = c; ctx.shadowBlur = 12;
    ctx.beginPath(); ctx.arc(p.x, p.y, 4.2, 0, TAU); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(p.x, p.y, 6.5, 0, TAU); ctx.stroke();
    ctx.restore();
  }
  if (p.crit){
    ctx.strokeStyle = 'rgba(255,209,102,.9)'; ctx.lineWidth = 1.3;
    ctx.beginPath(); ctx.arc(p.x, p.y, 8, 0, TAU); ctx.stroke();
  }
  ctx.restore();
}

/* ---------------- attack payloads ---------------- */
function fxBeam(t, a, end, rail, st){

  fxSparks(end.x, end.y, c, rail ? 9 : 6, rail ? 135 : 95, 2.2, 0);

    fxAdd('rail', { x1: a.x, y1: a.y, x2: end.x, y2: end.y, color: '#ffffff', life: .22 });

}
function fxChain(t, pts, st){

function fxImpact(p, e){

/* ---------------- custom FX drawing ---------------- */
function fxDrawFx(){
  if (!game) return;
  ctx.save();
  for (const f of game.fx){
    if (f.kind === 'ring' || f.kind === 'beam') continue;
    const a = clamp(f.life / f.max, 0, 1);
    const k = 1 - a;
    const c = f.color || '#fff';
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    if (f.kind === 'muzzle'){
      ctx.translate(f.x, f.y); ctx.rotate(f.ang || 0);
      const sc = f.scale || 1;
      ctx.strokeStyle = rgba(c, a * .9); ctx.lineWidth = 1.6;
      for (let i = 0; i < 8; i++){
        const an = i / 8 * TAU + (f.seed || 0);
        const len = (10 + (i % 3) * 7) * sc;
        ctx.beginPath(); ctx.moveTo(1, 0); ctx.lineTo(Math.cos(an) * len, Math.sin(an) * len); ctx.stroke();
      }
      ctx.fillStyle = rgba('#ffffff', a * .95);
      ctx.beginPath(); ctx.arc(0, 0, 5.5 * sc, 0, TAU); ctx.fill();
    } else if (f.kind === 'charge'){
      const r = (f.r || 22) * (.3 + a * .7);
      ctx.translate(f.x, f.y);
      ctx.rotate(game.clock * 2 + (f.seed || 0));
      ctx.strokeStyle = rgba(c, a * .55); ctx.lineWidth = 1.4;
      ctx.setLineDash([4, 7]);
      ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.stroke();
      ctx.setLineDash([]);
      ctx.strokeStyle = rgba('#ffffff', a * .35); ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(0, 0, r * .72, 0, TAU); ctx.stroke();
    } else if (f.kind === 'impact'){
      const rr = 10 + 32 * k;
      const an0 = f.seed || 0;
      ctx.translate(f.x, f.y);
      ctx.strokeStyle = rgba(c, a * .8); ctx.lineWidth = 1.5;
      for (let i = 0; i < 10; i++){
        const an = an0 + i / 10 * TAU;
        const len = rr * (.7 + (i % 4) * .16);
        ctx.beginPath(); ctx.moveTo(Math.cos(an) * 5, Math.sin(an) * 5); ctx.lineTo(Math.cos(an) * len, Math.sin(an) * len); ctx.stroke();
      }
      ctx.strokeStyle = rgba(c, a * .5); ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(0, 0, rr * .85, 0, TAU); ctx.stroke();
      ctx.fillStyle = rgba('#ffffff', a * .7);
      ctx.beginPath(); ctx.arc(0, 0, Math.max(1, 8 * a), 0, TAU); ctx.fill();
      if (f.arch === 'frost' || f.arch === 'cryo'){
        for (let i = 0; i < 6; i++){
          const an = an0 + i / 6 * TAU, d = rr * .55;
          ctx.save(); ctx.translate(Math.cos(an) * d, Math.sin(an) * d); ctx.rotate(an);
          ctx.fillStyle = rgba('#dffaff', a * .9);
          ctx.beginPath(); ctx.moveTo(7, 0); ctx.lineTo(-3, 3); ctx.lineTo(-1, 0); ctx.lineTo(-3, -3); ctx.closePath(); ctx.fill();
          ctx.restore();
        }
      } else if (f.arch === 'storm' || f.arch === 'bolt'){
        ctx.strokeStyle = rgba('#e2d6ff', a * .9); ctx.lineWidth = 1.3;
        for (let s = 0; s < 3; s++){
          const an = an0 + s / 3 * TAU;
          ctx.beginPath(); ctx.moveTo(0, 0);
          for (let q = 1; q <= 3; q++) ctx.lineTo(Math.cos(an) * rr * q / 3 + (f.seed + q) % 7 - 3, Math.sin(an) * rr * q / 3);
          ctx.stroke();
        }
      } else if (f.arch === 'acid' || f.arch === 'bio'){
        for (let i = 0; i < 5; i++){
          const an = an0 + i * 1.7, d = rr * (.35 + i * .1);
          ctx.fillStyle = rgba('#a8ffb0', a * .55);
          ctx.beginPath(); ctx.arc(Math.cos(an) * d, Math.sin(an) * d, 2 + (i % 3), 0, TAU); ctx.fill();
        }
      }
    } else if (f.kind === 'nova'){
      const rr = (f.maxR || 180) * (.25 + .75 * k);
      ctx.translate(f.x, f.y);
      ctx.strokeStyle = rgba(c, a * .55); ctx.lineWidth = 2.2;
      for (let i = 0; i < 3; i++){
        ctx.beginPath(); ctx.arc(0, 0, rr * (1 - i * .12), 0, TAU); ctx.stroke();
      }
      ctx.strokeStyle = rgba('#ffffff', a * .5); ctx.lineWidth = 1;
      for (let i = 0; i < 12; i++){
        const an = i / 12 * TAU + (f.seed || 0);
        ctx.beginPath(); ctx.moveTo(Math.cos(an) * rr * .2, Math.sin(an) * rr * .2);
        ctx.lineTo(Math.cos(an) * rr * 1.05, Math.sin(an) * rr * 1.05); ctx.stroke();
      }
    } else if (f.kind === 'chain'){
      const pts = f.pts || [];
      ctx.strokeStyle = rgba(c, a * .85); ctx.lineWidth = 4;
      ctx.shadowColor = c; ctx.shadowBlur = 14;
      for (let pass = 0; pass < 2; pass++){
        ctx.beginPath();
        ctx.moveTo(pts[0].x, pts[0].y);
        for (let i = 1; i < pts.length; i++){
          const A = pts[i - 1], B = pts[i];
          for (let q = 1; q <= 5; q++){
            const tq = q / 5;
            const jx = q === 5 ? 0 : ((i * 13 + q * 7 + (f.seed || 0) * 3) % 11 - 5) * 1.5;
            const jy = q === 5 ? 0 : ((i * 7 + q * 11 + (f.seed || 0) * 5) % 13 - 6) * 1.5;
            ctx.lineTo(A.x + (B.x - A.x) * tq + jx, A.y + (B.y - A.y) * tq + jy);
          }
        }
        if (pass === 0){ ctx.strokeStyle = rgba(c, a * .8); ctx.lineWidth = 4; }
        else { ctx.strokeStyle = rgba('#ffffff', a * .8); ctx.lineWidth = 1.4; }
        ctx.stroke();
      }
    } else if (f.kind === 'beamglow'){
      ctx.strokeStyle = rgba(c, a * .18); ctx.lineWidth = f.width || 14;
      ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(f.x1, f.y1); ctx.lineTo(f.x2, f.y2); ctx.stroke();
      ctx.strokeStyle = rgba(c, a * .35); ctx.lineWidth = (f.width || 14) * .4;
      ctx.stroke();
    } else if (f.kind === 'rail'){
      ctx.strokeStyle = rgba('#ffffff', a * .8); ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(f.x1, f.y1); ctx.lineTo(f.x2, f.y2); ctx.stroke();
      ctx.strokeStyle = rgba('#bff4ff', a * .35); ctx.lineWidth = 5;
      ctx.stroke();
    } else if (f.kind === 'vortex'){
      const rr = f.r || 36;
      ctx.translate(f.x, f.y); ctx.rotate(game.clock * 2 + (f.seed || 0));
      ctx.strokeStyle = rgba(c, a * .55); ctx.lineWidth = 1.2;
      for (let arm = 0; arm < 3; arm++){
        ctx.beginPath();
        for (let q = 0; q <= 14; q++){
          const an = arm / 3 * TAU + q * .28;
          const rq = rr * q / 14;
          ctx.lineTo(Math.cos(an) * rq, Math.sin(an) * rq);
        }
        ctx.stroke();
      }
      ctx.fillStyle = rgba('#ffffff', a * .4);
      ctx.beginPath(); ctx.arc(0, 0, 3, 0, TAU); ctx.fill();
    } else if (f.kind === 'smoke'){
      const r = (f.r || 8) * (1 + k * 1.6);
      ctx.fillStyle = rgba(f.color || '#777', a * .22);
      ctx.beginPath(); ctx.arc(f.x, f.y, r, 0, TAU); ctx.fill();
      ctx.fillStyle = rgba('#ffffff', a * .05);
      ctx.beginPath(); ctx.arc(f.x - r * .2, f.y - r * .2, r * .45, 0, TAU); ctx.fill();
    } else if (f.kind === 'shardring'){
      ctx.translate(f.x, f.y);
      for (let i = 0; i < 7; i++){
        const an = (f.seed || 0) + i / 7 * TAU;
        ctx.save(); ctx.translate(Math.cos(an) * 12 * (1 + k), Math.sin(an) * 12 * (1 + k)); ctx.rotate(an);
        ctx.fillStyle = rgba('#e8fbff', a * .8);
        ctx.beginPath(); ctx.moveTo(6, 0); ctx.lineTo(-3, 3); ctx.lineTo(-1, 0); ctx.lineTo(-3, -3); ctx.closePath(); ctx.fill();
        ctx.restore();
      }
    } else if (f.kind === 'cone'){
      ctx.translate(f.x, f.y); ctx.rotate(f.ang || 0);
      for (let i = 0; i < 9; i++){
        const spread = ((i % 3) - 1) * .18;
        const d = 8 + ((i * 7 + (f.seed || 0) * 3) % 28);
        ctx.fillStyle = rgba(i % 2 ? '#ff8a4a' : '#ffd37a', a * .5);
        ctx.beginPath(); ctx.arc(d, Math.sin(spread) * d * 1.1, 3 + (i % 3), 0, TAU); ctx.fill();
      }
    }
    ctx.restore();
  }
  ctx.restore();
}

/* ---------------- ambient auras ---------------- */
function fxAmbient(t){
  if (!game) return;
  for (const tw of game.towers){
    if (tw.type.arch !== 'support') continue;
    const rr = 32 + Math.sin(game.clock * 2 + tw.x) * 4;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.translate(tw.x, tw.y - 8);
    ctx.strokeStyle = rgba(tw.type.color || '#7cf0a0', .18 + .08 * Math.sin(game.clock * 3 + tw.y));
    ctx.lineWidth = 1.2;
    ctx.setLineDash([4, 8]);
    ctx.lineDashOffset = -game.clock * 20;
    ctx.beginPath(); ctx.arc(0, 0, rr, 0, TAU); ctx.stroke();
    ctx.setLineDash([]);
    ctx.strokeStyle = rgba(tw.type.color || '#7cf0a0', .14);
    ctx.beginPath(); ctx.arc(0, 0, rr * .72, 0, TAU); ctx.stroke();
    for (let i = 0; i < 4; i++){
      const an = i / 4 * TAU + game.clock * .7;
      ctx.fillStyle = rgba('#ffffff', .22);
      ctx.beginPath(); ctx.arc(Math.cos(an) * rr * .72, Math.sin(an) * rr * .72, 1.4, 0, TAU); ctx.fill();
    }
    ctx.restore();
  }
}

/* Debug showcase: one tower of every archetype + many stationary enemies. */

    const t = makeTower(i, spots[si][0], spots[si][1]);

(function(){
  function navBack(){
    const g = game;

    if (g.state === 'chapters') { openMenu(); return; }
    if (g.state === 'stages') { g.challenge ? openMenu() : openChapters(); return; }
    if (g.state === 'loadout') { g.challenge ? openChallenges() : openStages(g.dimension); return; }
    if (g.state === 'build' || g.state === 'fight') {
      startStage(g.chapter, g.stage, g.challenge, g.trial);
      return;
    }
    if (g.state === 'reward' || g.state === 'stageclear' || g.state === 'over' || g.state === 'victory') {
      g.challenge ? openChallenges() : openStages(g.chapter || g.dimension || 1);
      return;
    }
  }

  function drawMetaBack(){
    const g = game;
    if (!g || g.state === 'menu') return;
    const paused = !!g.paused;
    const label = paused ? '返回战斗' : '返回';
    const w = paused ? 82 : 64, h = 22, x = 14, y = 58;
    const hot = g.hoverHot && g.hoverHot.id === 'meta_back';
    ctx.save();
    skBtnShape(x, y, w, h, 6);
    ctx.fillStyle = hot ? 'rgba(11,40,58,.98)' : 'rgba(3,12,22,.94)';
    ctx.fill();
    skBtnShape(x, y, w, h, 6);
    ctx.strokeStyle = hot ? '#e9ffff' : 'rgba(87,230,255,.58)';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.strokeStyle = hot ? '#e9ffff' : SK.gold;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(x + 12, y + 7); ctx.lineTo(x + 18, y + 11); ctx.lineTo(x + 12, y + 15);
    ctx.stroke();
    skText(label, x + 24, y + 11, 9.2, hot ? '#ffffff' : SK.paper, 'left', 600, false, .6);
    ctx.restore();
    addHot('meta_back', x - 3, y - 4, w + 6, h + 8, navBack, '返回上一页 · Backspace');
  }

  /* Back button overlay; no admin panel, no admin chip. */
  const _render = render;
  render = function(){
    _render();
    const g = game;
    if (!g || (g.introT && g.introT > 0)) return;
    if (g.state !== 'menu') drawMetaBack();
  };

  window.addEventListener('keydown', function(e){
    if ((e.key === 'b' || e.key === 'B') && !e.ctrlKey && !e.metaKey && !e.altKey &&
        game && game.state === 'build') {
      e.preventDefault();
      game.armoryCollapsed = !game.armoryCollapsed;
      if (game.armoryCollapsed) { game.buildType = -1; game.targeting = null; }
      sfx('select');
      return;
    }
    if ((e.key === 'Backspace' || e.key === 'Escape') && game && game.state !== 'menu') {
      e.preventDefault();
      navBack();
    }
  }, true);

  if (typeof window !== 'undefined') {
    const api = window.__AG = window.__AG || {};
    api.back = navBack;
    api.startStage = startStage;
  }
})();

   15_anime.js — 二次元地狱生物重绘

function animeEye(x, y, rx, ry, iris, angry, glow){
  iris = iris || '#ffd166';
  ctx.save();
  /* 眼白 */
  ctx.fillStyle = '#fff8ed';
  ctx.strokeStyle = 'rgba(12,4,10,.95)';
  ctx.lineWidth = Math.max(.8, rx * .22);
  ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, TAU); ctx.fill(); ctx.stroke();
  /* 虹膜 */
  const g = ctx.createRadialGradient(x + rx * .16, y - ry * .18, Math.max(.4, rx * .12), x, y, ry * .9);
  g.addColorStop(0, '#ffffff');
  g.addColorStop(.22, iris);
  g.addColorStop(1, '#1a0610');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.ellipse(x + rx * .04, y + ry * .06, rx * .68, ry * .8, 0, 0, TAU); ctx.fill();
  /* 瞳孔 */
  ctx.fillStyle = '#10030a';
  ctx.beginPath(); ctx.ellipse(x + rx * .04, y + ry * .08, rx * .22, ry * .58, 0, 0, TAU); ctx.fill();
  /* 高光 */
  ctx.fillStyle = 'rgba(255,255,255,.95)';
  ctx.beginPath(); ctx.arc(x - rx * .25, y - ry * .38, Math.max(.7, rx * .17), 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(x + rx * .3, y + ry * .26, Math.max(.4, rx * .08), 0, TAU); ctx.fill();
  /* 上眼睑/眼线 */
  ctx.strokeStyle = 'rgba(16,4,10,.95)';
  ctx.lineWidth = Math.max(1, rx * .28);
  ctx.beginPath(); ctx.ellipse(x, y - ry * .08, rx * 1.03, ry * .92, angry ? -.22 : 0, Math.PI * 1.12, Math.PI * 1.92); ctx.stroke();
  if (angry) {
    ctx.beginPath();
    ctx.moveTo(x - rx * 1.1, y - ry * 1.18);
    ctx.lineTo(x + rx * .82, y - ry * .78);
    ctx.stroke();
  }
  if (glow) {
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = rgba(iris, .18);
    ctx.beginPath(); ctx.arc(x, y, rx * 1.8, 0, TAU); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
  }
  ctx.restore();
}

function animeFang(x, y, s, down, col){
  ctx.save();
  ctx.fillStyle = col || '#fff6df';
  ctx.strokeStyle = 'rgba(30,8,6,.6)'; ctx.lineWidth = .7;
  ctx.beginPath();
  if (down) {
    ctx.moveTo(x - s * .45, y); ctx.lineTo(x + s * .45, y); ctx.lineTo(x, y + s);
  } else {
    ctx.moveTo(x - s * .45, y); ctx.lineTo(x + s * .45, y); ctx.lineTo(x, y - s);
  }
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.restore();
}

function animeTuft(x, y, len, ang, col, n){
  ctx.save();
  ctx.translate(x, y); ctx.rotate(ang);
  ctx.fillStyle = col;
  for (let i = 0; i < (n || 1); i++) {
    const a = (i - ((n || 1) - 1) / 2) * .28;
    ctx.save(); ctx.rotate(a);
    ctx.beginPath();
    ctx.moveTo(-len * .18, len * .10);
    ctx.quadraticCurveTo(-len * .1, -len * .55, len * .75, -len * .2);
    ctx.quadraticCurveTo(len * .25, len * .08, len * .05, len * .22);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  ctx.restore();
}

function drawHead(r, c, L, offX, offY, scale){

      animeEye(hx + hr * .08, hy + hr * .16, hr * .11, hr * .14, '#ff8a5a', false);
      /* 螯牙 */
      ctx.fillStyle = '#fff1d6';
      poly(hx + hr * .56, hy + hr * .38, hr * .12, 3, 0); ctx.fill();
      poly(hx + hr * .3, hy + hr * .44, hr * .11, 3, .3); ctx.fill();
    } else if (isInsect) {
      ctx.beginPath(); ctx.ellipse(hx, hy, hr * .72, hr * .68, 0, 0, TAU); ctx.fill(); ctx.stroke();
      animeEye(hx + hr * .24, hy - hr * .08, hr * .3, hr * .36, '#ff7860', true, true);
      animeEye(hx - hr * .2, hy - hr * .08, hr * .24, hr * .3, '#ff7860', true, true);
      ctx.fillStyle = '#18070a';
      ctx.beginPath(); ctx.moveTo(hx - hr * .05, hy + hr * .35); ctx.lineTo(hx + hr * .28, hy + hr * .35); ctx.lineTo(hx + hr * .16, hy + hr * .58); ctx.closePath(); ctx.fill();
    } else {
      /* 恶魔 / 蝙蝠 / 统御者 */
      ctx.beginPath(); ctx.ellipse(hx, hy, hr * .78, hr * .72, 0, 0, TAU); ctx.fill(); ctx.stroke();
      /* 口部 */
      ctx.fillStyle = '#18050a';
      ctx.beginPath(); ctx.ellipse(hx + hr * .62, hy + hr * .18, hr * .3, hr * .2, 0, 0, TAU); ctx.fill();
      animeFang(hx + hr * .48, hy + hr * .25, hr * .16, true);
      animeFang(hx + hr * .78, hy + hr * .2, hr * .13, true);
      /* 眼睛 */
      if (nEyes >= 3) {
        animeEye(hx + hr * .22, hy - hr * .24, hr * .18, hr * .23, '#ffd166', true);
        animeEye(hx - hr * .06, hy - hr * .3, hr * .16, hr * .2, '#ffd166', false);
        animeEye(hx - hr * .3, hy - hr * .2, hr * .12, hr * .16, '#ff8a5a', false);
      } else {
        animeEye(hx + hr * .22, hy - hr * .16, hr * .24, hr * .3, L.boss ? '#ffd166' : '#ff8a5a', true);
        animeEye(hx - hr * .12, hy - hr * .17, hr * .18, hr * .24, L.boss ? '#ffd166' : '#ff8a5a', false);
      }
      if (!L.crown) animeTuft(hx - hr * .36, hy - hr * .6, hr * .34, -.9, rgba(c, .95), 2);
      /* 角 */
      if (L.horns) drawHorns(r * .82, c, L.horns === 3 ? 3 : 2, L.crown ? 'crown' : 'curved');
    }
  }

  /* 王冠 */
  if (L.crown) {
    ctx.fillStyle = '#ffd166';
    for (let i = -2; i <= 2; i++) {
      ctx.beginPath();
      ctx.moveTo(hx + i * hr * .17 - hr * .055, hy - hr * 1.02);
      ctx.lineTo(hx + i * hr * .17, hy - hr * (1.35 - Math.abs(i) * .1));
      ctx.lineTo(hx + i * hr * .17 + hr * .055, hy - hr * 1.02);
      ctx.closePath(); ctx.fill();
    }
  }
  ctx.restore();
}

function drawWings(r, c, up, n){
  const w = Math.max(1, n || 2);
  for (let side = -1; side <= 1; side += 2) {
    const flap = Math.sin((up || 0) * 8 + (side > 0 ? .4 : 0)) * r * .16;
    ctx.save(); ctx.scale(1, side);
    /* 主膜 */
    const g = ctx.createLinearGradient(-r * .2, 0, -r * 1.8, 0);
    g.addColorStop(0, rgba(c, .58));
    g.addColorStop(.7, rgba(c, .22));
    g.addColorStop(1, 'rgba(12,4,10,.1)');
    ctx.fillStyle = g;
    ctx.strokeStyle = 'rgba(22,6,12,.9)'; ctx.lineWidth = Math.max(1, r * .06);
    ctx.beginPath();
    ctx.moveTo(-r * .1, r * .12);
    ctx.quadraticCurveTo(-r * .7, -r * .7 + flap, -r * 1.65, -r * .5 + flap);
    ctx.quadraticCurveTo(-r * 1.45, -r * .05 + flap, -r * 1.8, r * .55 + flap);
    ctx.quadraticCurveTo(-r * 1.1, r * .38, -r * .85, r * .92);
    ctx.quadraticCurveTo(-r * .5, r * .52, -r * .1, r * .38);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    /* 翼骨：n 只控制翼膜分瓣/肋数，不递归放大 */
    const ribs = Math.min(6, Math.max(2, w));
    ctx.strokeStyle = 'rgba(255,228,190,.55)'; ctx.lineWidth = Math.max(.8, r * .045);
    for (let i = 0; i < ribs; i++) {
      const k = i / Math.max(1, ribs - 1);
      ctx.beginPath();
      ctx.moveTo(-r * .15, r * .16);
      ctx.quadraticCurveTo(-r * (.7 + k * .6), -r * .45 + flap + k * r * .5, -r * (1.2 + k * .55), -r * .12 + flap + k * r * .78);
      ctx.stroke();
    }
    /* 翼尖爪 */
    ctx.strokeStyle = 'rgba(255,220,170,.85)'; ctx.lineWidth = Math.max(1, r * .07);
    ctx.beginPath(); ctx.moveTo(-r * 1.55, -r * .42 + flap); ctx.lineTo(-r * 1.82, -r * .66 + flap); ctx.stroke();
    ctx.restore();
  }
}

function animeBody(rx, ry, c, tilt, x, y){
  ctx.save(); ctx.translate(x || 0, y || 0); if (tilt) ctx.rotate(tilt);
  const g = ctx.createRadialGradient(-rx * .35, -ry * .5, rx * .12, 0, 0, rx);
  g.addColorStop(0, rgba('#ffffff', .28));
  g.addColorStop(.25, rgba(c, 1));
  g.addColorStop(.82, rgba(c, .78));
  g.addColorStop(1, 'rgba(18,6,12,.96)');
  ctx.fillStyle = g; ctx.strokeStyle = 'rgba(20,6,12,.95)'; ctx.lineWidth = Math.max(1, Math.min(rx, ry) * .14);
  ctx.beginPath(); ctx.ellipse(0, 0, rx, ry, 0, 0, TAU); ctx.fill(); ctx.stroke();
  /* 赛璐璐阴影 */
  ctx.save(); ctx.beginPath(); ctx.ellipse(0, 0, rx, ry, 0, 0, TAU); ctx.clip();
  ctx.fillStyle = 'rgba(20,3,10,.24)';
  ctx.beginPath(); ctx.ellipse(rx * .25, ry * .5, rx * .95, ry * .55, -.15, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.14)';
  ctx.beginPath(); ctx.ellipse(-rx * .32, -ry * .42, rx * .35, ry * .18, -.3, 0, TAU); ctx.fill();
  ctx.restore();
  ctx.restore();
}

function drawCreatureBody(e, r, L){
  const c = e.color;
  const up = e.t;
  const kind = L.kind || 'insect';

  if (L.wings) drawWings(r, c, up, L.wings);

  /* 尾巴 */
  if (L.tail || kind === 'demon' || kind === 'hound') {
    ctx.strokeStyle = 'rgba(22,6,12,.95)'; ctx.lineWidth = Math.max(1.4, r * .09); ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-r * .85, r * .18);
    ctx.quadraticCurveTo(-r * 1.5, r * .3, -r * 1.35, -r * .5);
    ctx.stroke();
    ctx.strokeStyle = rgba(c, .75); ctx.lineWidth = Math.max(1, r * .055);
    ctx.stroke();
    animeFang(-r * 1.35, -r * .5, r * .16, false, rgba(c, .95));
  }

  /* 腿 */
  if (L.legs) {
    const n = Math.min(8, L.legs);
    ctx.strokeStyle = 'rgba(20,6,12,.95)'; ctx.lineWidth = Math.max(1.4, r * .09); ctx.lineCap = 'round';
    for (let i = 0; i < n; i++) {
      const side = i % 2 ? 1 : -1;
      const bx = -r * .46 + Math.floor(i / 2) * r * .34;
      const swing = Math.sin(up * 7 + i) * r * .08;
      ctx.beginPath();
      ctx.moveTo(bx, side * r * .4);
      ctx.lineTo(bx + r * .12, side * r * .9);
      ctx.lineTo(bx + r * .4, side * r * 1.05 + swing);
      ctx.stroke();
      ctx.strokeStyle = rgba(c, .65); ctx.lineWidth = Math.max(.7, r * .04);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(20,6,12,.95)'; ctx.lineWidth = Math.max(1.4, r * .09);
    }
  }

  /* 身体 */
  if (kind === 'spider') {
    animeBody(r * .8, r * .58, c, 0, -r * .42, 0);
    animeBody(r * .5, r * .44, c, 0, -r * .95, 0);
    ctx.strokeStyle = rgba('#7ee6c0', .55); ctx.lineWidth = Math.max(1, r * .06);
    for (let i = 0; i < 5; i++) {
      ctx.beginPath(); ctx.arc(-r * .4 + i * r * .2, -r * .35 + (i % 2) * r * .12, r * .08, 0, TAU); ctx.stroke();
    }
    drawHead(r, c, L, r * .34, -r * .02, 1.05);
  } else if (kind === 'wraith') {
    ctx.fillStyle = 'rgba(10,24,34,.9)'; ctx.strokeStyle = 'rgba(190,247,255,.5)'; ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(-r * .65, -r * .55);
    ctx.quadraticCurveTo(0, -r * .95, r * .65, -r * .42);
    for (let i = 0; i < 4; i++) ctx.lineTo(r * .52 - i * r * .3, r * (.55 + (i % 2) * .2));
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(190,247,255,.12)';
    ctx.beginPath(); ctx.arc(0, 0, r * 1.5, 0, TAU); ctx.fill();
    drawHead(r, c, L, r * .3, -r * .02, 1.15);
  } else if (kind === 'machine') {
    ctx.fillStyle = '#101c28'; ctx.strokeStyle = rgba(c, .85); ctx.lineWidth = 1.4;
    rr(-r * .95, -r * .62, r * 1.55, r * 1.22, r * .18); ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(0,0,0,.45)'; rr(-r * .75, -r * .32, r * 1.1, r * .16, 2); ctx.fill();
    ctx.fillStyle = rgba(c, .6); rr(-r * .7, r * .1, r * .42, r * .16, 2); ctx.fill();
    ctx.strokeStyle = rgba(c, .6); ctx.lineWidth = 1;
    for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.moveTo(-r * .7, r * .35 + i * r * .08); ctx.lineTo(-r * .35, r * .35 + i * r * .08); ctx.stroke(); }
    drawHead(r, c, L, r * .38, -r * .08, 1.0);
  } else if (kind === 'crystal') {
    ctx.fillStyle = rgba(c, .55); ctx.strokeStyle = '#e8ffff'; ctx.lineWidth = 1.2;
    for (let i = 0; i < 5; i++) {
      const a = i / 5 * TAU + up * .2;
      ctx.save(); ctx.rotate(a);
      ctx.beginPath(); ctx.moveTo(r * .42, 0); ctx.lineTo(r * 1.15, -r * .16); ctx.lineTo(r * 1.3, 0); ctx.lineTo(r * 1.15, r * .16); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.restore();
    }
    animeBody(r * .55, r * .55, c, 0, 0, 0);
    drawHead(r, c, L, r * .3, -r * .05, 1.1);
  } else if (kind === 'insect') {
    /* 腹节 */
    animeBody(r * .58, r * .48, c, 0, -r * .5, 0);
    animeBody(r * .4, r * .36, c, 0, -r * .98, 0);
    ctx.fillStyle = 'rgba(20,8,10,.38)';
    for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.ellipse(-r * .5, -r * .42 + i * r * .3, r * .09, r * .05, 0, 0, TAU); ctx.fill(); }
    drawHead(r, c, L, r * .34, 0, 1.1);
  } else if (kind === 'hound') {
    animeBody(r * 1.02, r * .66, c, 0, -r * .12, r * .06);
    ctx.fillStyle = rgba(c, .5);
    for (let i = 0; i < 5; i++) {
      const a = -Math.PI * .75 + i / 4 * Math.PI * .5;
      ctx.beginPath(); ctx.moveTo(-r * .2, 0); ctx.lineTo(-r * .2 + Math.cos(a) * r * .8, Math.sin(a) * r * .8); ctx.lineTo(-r * .05, Math.sin(a) * r * .22); ctx.closePath(); ctx.fill();
    }
    drawHead(r, c, L, r * .42, -r * .04, 1.12);
  } else if (kind === 'brain') {
    animeBody(r * .82, r * .62, c, 0, -r * .1, 0);
    ctx.strokeStyle = 'rgba(255,150,190,.55)'; ctx.lineWidth = Math.max(1, r * .06);
    for (let i = 0; i < 5; i++) { ctx.beginPath(); ctx.arc(0, -r * .1, r * (.2 + i * .12), .2, 2.4); ctx.stroke(); }
    drawHead(r, c, L, r * .3, -r * .05, 1.0);
  } else {
    /* 恶魔 / 蝙蝠 / 通用 */
    animeBody(r * .95, r * .64, c, 0, -r * .05, 0);
    /* 胸甲 */
    if (L.armor) {
      ctx.fillStyle = 'rgba(14,10,18,.8)'; ctx.strokeStyle = 'rgba(255,235,200,.35)'; ctx.lineWidth = 1;
      for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.ellipse(-r * .3 + i * r * .32, r * .04, r * .18, r * .28, -.15, 0, TAU); ctx.fill(); ctx.stroke(); }
    }
    drawHead(r, c, L, r * .4, -r * .12, 1.12);
  }

  /* 火焰/寒气光晕 */
  if (e.key === 'pyro' || e.key === 'cinder' || e.key === 'magma' || e.key === 'hellhound') {
    ctx.fillStyle = rgba('#ff8a3a', .12 + .05 * Math.sin(up * 9));
    ctx.beginPath(); ctx.arc(0, 0, r * 1.5, 0, TAU); ctx.fill();
  }
  if (e.key === 'frostling' || e.key === 'wraith' || e.key === 'zero') {
    ctx.fillStyle = rgba('#bff7ff', .08);
    ctx.beginPath(); ctx.arc(0, 0, r * 1.55, 0, TAU); ctx.fill();
  }
}

/* ---------- Boss 覆盖 ---------- */
const _animeBaseBossBody = drawBossBody;

function animeHoundBoss(e, r){
  const c = e.color, up = e.t;
  /* 火光 */
  ctx.fillStyle = 'rgba(255,120,40,.14)';
  ctx.beginPath(); ctx.arc(0, 0, r * 2.0, 0, TAU); ctx.fill();
  /* 尾焰 */
  ctx.strokeStyle = 'rgba(255,130,50,.9)'; ctx.lineWidth = Math.max(2, r * .1); ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-r * .8, r * .3); ctx.quadraticCurveTo(-r * 1.7, r * .2, -r * 1.8, -r * .55); ctx.stroke();
  /* 躯干 */
  animeBody(r * 1.12, r * .72, c, 0, -r * .12, r * .12);
  /* 背甲 */
  ctx.fillStyle = 'rgba(24,8,6,.72)'; ctx.strokeStyle = 'rgba(255,170,90,.5)'; ctx.lineWidth = 1.2;
  poly(-r * .2, r * .1, r * .55, 6, Math.PI / 2); ctx.fill(); ctx.stroke();
  /* 烈焰鬃毛 */
  for (let i = 0; i < 9; i++) {
    const a = -Math.PI * .78 + i / 8 * Math.PI * .56;
    ctx.fillStyle = i % 2 ? 'rgba(255,104,34,.65)' : 'rgba(255,190,80,.5)';
    ctx.beginPath();
    ctx.moveTo(Math.cos(a) * r * .72, Math.sin(a) * r * .72);
    ctx.quadraticCurveTo(Math.cos(a + .08) * r * 1.28, Math.sin(a + .08) * r * 1.28, Math.cos(a - .08) * r * .8, Math.sin(a - .08) * r * .8);
    ctx.closePath(); ctx.fill();
  }
  /* 三条脖子 */
  const heads = [[r * .82, -r * .56], [r * 1.06, 0], [r * .82, r * .56]];
  ctx.strokeStyle = 'rgba(48,12,8,.95)'; ctx.lineWidth = r * .32; ctx.lineCap = 'round';
  for (const h of heads) {
    ctx.beginPath(); ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(h[0] * .45, h[1] * .7, h[0], h[1]); ctx.stroke();
  }
  /* 三颗二次元犬首 */
  for (let i = 0; i < 3; i++) {
    const hx = heads[i][0], hy = heads[i][1];
    drawHead(r * .86, c, { kind: 'hound', eyes: 2, horns: 2, boss: true, crown: i === 1 },
      hx - r * .86 * .34, hy, 1);
  }
  /* 四足 */
  ctx.strokeStyle = 'rgba(38,10,8,.98)'; ctx.lineWidth = Math.max(2, r * .13); ctx.lineCap = 'round';
  for (const lx of [-r * .55, -r * .18, r * .22, r * .6]) {
    const dir = lx < 0 ? -1 : 1;
    ctx.beginPath();
    ctx.moveTo(lx, r * .45);
    ctx.lineTo(lx + dir * r * .18, r * .86);
    ctx.lineTo(lx + dir * r * .34, r * 1.04);
    ctx.stroke();
  }
  /* 胸口余烬 */
  for (let i = 0; i < 6; i++) {
    ctx.fillStyle = i % 2 ? '#ffd166' : '#ff7a3a';
    ctx.beginPath(); ctx.arc((i - 2.5) * r * .18, r * .12, r * .035, 0, TAU); ctx.fill();
  }
}

function animeSovereign(e, r){
  r *= 1.24;
  const c = e.color, up = e.t;
  /* 王座光环 */
  ctx.strokeStyle = 'rgba(255,209,102,.25)'; ctx.lineWidth = 1.2;
  for (let i = 0; i < 3; i++) { ctx.save(); ctx.rotate(up * .1 + i * 1.2); ctx.beginPath(); ctx.ellipse(0, 0, r * (1.55 + i * .16), r * (.5 + i * .08), .15, 0, TAU); ctx.stroke(); ctx.restore(); }
  /* 六翼 */
  drawWings(r * .95, c, up, 6);
  /* 尾 */
  ctx.strokeStyle = 'rgba(42,10,8,.98)'; ctx.lineWidth = Math.max(2, r * .1); ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-r * .5, r * .8); ctx.quadraticCurveTo(-r * 1.35, r * 1.0, -r * 1.15, r * 1.7); ctx.stroke();
  ctx.strokeStyle = rgba(c, .55); ctx.lineWidth = Math.max(1, r * .045); ctx.stroke();
  /* 躯干（正面） */
  animeBody(r * .98, r * 1.1, '#5a1620', 0, r * .02, r * .05);
  /* 胸甲与维度核心 */
  ctx.fillStyle = 'rgba(24,8,10,.92)'; ctx.strokeStyle = 'rgba(255,220,150,.8)'; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.ellipse(0, -r * .02, r * .54, r * .58, 0, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.fillStyle = 'rgba(120,28,30,.9)';
  ctx.beginPath(); ctx.ellipse(0, r * .05, r * .4, r * .42, 0, 0, TAU); ctx.fill();
  const cg = ctx.createRadialGradient(0, r * .05, r * .02, 0, r * .05, r * .24);
  cg.addColorStop(0, '#ffe9a8'); cg.addColorStop(.45, '#ff8a3a'); cg.addColorStop(1, 'rgba(180,24,24,0)');
  ctx.fillStyle = cg; ctx.beginPath(); ctx.arc(0, r * .05, r * .24, 0, TAU); ctx.fill();
  ctx.strokeStyle = 'rgba(255,209,102,.9)'; ctx.lineWidth = 1.2;
  for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.arc(0, r * .05, r * (.3 + i * .07), .3, Math.PI - .3); ctx.stroke(); }
  /* 双臂与利爪 */
  for (const sd of [-1, 1]) {
    ctx.strokeStyle = 'rgba(38,10,8,.98)'; ctx.lineWidth = Math.max(3, r * .15); ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(sd * r * .72, -r * .1); ctx.quadraticCurveTo(sd * r * 1.2, r * .25, sd * r * 1.15, r * .75); ctx.stroke();
    ctx.strokeStyle = rgba(c, .75); ctx.lineWidth = Math.max(1, r * .055); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,235,190,.9)'; ctx.lineWidth = Math.max(1, r * .05);
    for (let j = 0; j < 3; j++) { ctx.beginPath(); ctx.moveTo(sd * r * 1.12, r * .72); ctx.lineTo(sd * (1.28 + j * .04) * r, r * (.9 - j * .12)); ctx.stroke(); }
  }
  /* 双腿与爪 */
  for (const sd of [-1, 1]) {
    ctx.strokeStyle = 'rgba(32,8,6,.98)'; ctx.lineWidth = Math.max(3, r * .14); ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(sd * r * .3, r * .88); ctx.quadraticCurveTo(sd * r * .46, r * 1.12, sd * r * .54, r * 1.26); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,225,170,.8)'; ctx.lineWidth = Math.max(1, r * .055);
    for (let j = 0; j < 3; j++) { ctx.beginPath(); ctx.moveTo(sd * r * .54, r * 1.24); ctx.lineTo(sd * r * (.66 + j * .05), r * 1.34); ctx.stroke(); }
  }
  /* 三首：正面左右 + 中央 */
  const heads = [[-r * .66, -r * .86], [0, -r * 1.04], [r * .66, -r * .86]];
  ctx.strokeStyle = 'rgba(48,12,8,.98)'; ctx.lineWidth = Math.max(4, r * .24); ctx.lineCap = 'round';
  for (const h of heads) { ctx.beginPath(); ctx.moveTo(h[0] * .32, -r * .48); ctx.quadraticCurveTo(h[0] * .55, h[1] * .8, h[0], h[1] + r * .2); ctx.stroke(); }
  for (let hi = 0; hi < heads.length; hi++) {
    const h = heads[hi];
    drawHead(r * .9, c, { kind: 'sovereign', eyes: 3, horns: 3, crown: hi === 1, boss: true },
      h[0] - r * .9 * .34, h[1], 1);
  }
  /* 肩甲尖刺 */
  ctx.fillStyle = 'rgba(255,209,102,.9)';
  for (const sd of [-1, 1]) {
    poly(sd * r * .78, -r * .42, r * .26, 3, sd > 0 ? .2 : Math.PI - .2); ctx.fill();
  }
  /* 悬浮维度碎片 */
  for (let i = 0; i < 5; i++) {
    const a = up * .5 + i * TAU / 5;
    ctx.fillStyle = i % 2 ? '#ffd166' : '#ff8a5a';
    ctx.save(); ctx.translate(Math.cos(a) * r * 1.5, Math.sin(a) * r * .55 - r * .2); ctx.rotate(a);
    poly(0, 0, r * .075, 4, Math.PI / 4); ctx.fill(); ctx.restore();
  }
}

drawBossBody = function(e, r){
  const L = artLook(e);
  if (L.kind === 'hound') { animeHoundBoss(e, r); return; }
  if (L.kind === 'sovereign') { animeSovereign(e, r); return; }
  _animeBaseBossBody(e, r);
  /* 给非犬类 Boss 补二次元脸 */
  if (L.kind === 'wraith') {

    ctx.beginPath(); ctx.ellipse(r * .38, -r * .06, r * .36, r * .3, 0, 0, TAU); ctx.fill();

    animeEye(r * .18, -r * .16, r * .11, r * .17, '#bff7ff', false, true);
    ctx.fillStyle = '#0a1722';
    ctx.beginPath(); ctx.moveTo(r * .4, r * .2); ctx.lineTo(r * .66, r * .2); ctx.lineTo(r * .53, r * .38); ctx.closePath(); ctx.fill();
  } else if (L.kind === 'spider') {
    ctx.fillStyle = 'rgba(8,6,14,.7)';
    ctx.beginPath(); ctx.ellipse(r * .45, r * .02, r * .4, r * .34, 0, 0, TAU); ctx.fill();
    animeEye(r * .52, -r * .12, r * .13, r * .17, '#ffe06a', true);
    animeEye(r * .3, -r * .15, r * .1, r * .14, '#ffe06a', false);
    animeEye(r * .6, r * .12, r * .08, r * .11, '#ff8a5a', false);
    animeEye(r * .37, r * .12, r * .07, r * .1, '#ff8a5a', false);
    animeFang(r * .55, r * .3, r * .1, true);
  } else if (L.kind === 'machine' || L.kind === 'brain') {
    ctx.fillStyle = 'rgba(4,10,18,.86)';
    rr(r * .2, -r * .34, r * .75, r * .5, r * .12); ctx.fill();
    animeEye(r * .55, -r * .08, r * .18, r * .13, L.kind === 'brain' ? '#ff8a9a' : '#8fe8ff', true, true);
    ctx.strokeStyle = 'rgba(255,255,255,.45)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(r * .28, r * .12); ctx.lineTo(r * .85, r * .12); ctx.stroke();
    for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.moveTo(r * .3, r * .18 + i * r * .04); ctx.lineTo(r * .75, r * .18 + i * r * .04); ctx.stroke(); }
  }
};
/* ============================================================
   16_codex.js · 怪物情报 / 总图鉴 / 四系同步解锁
   ============================================================ */
const CODEX_ADMIN = () => (typeof adminOn === 'function' && adminOn());

/* ---- 四系与解锁：每关首通从四个 family 各取一座 ---- */
function towerFamily(def){
  if (!def) return 'kinetic';
  if (def.family) return def.family;
  const a = def.arch, t = def.dmgType;
  if (a === 'pulse' || a === 'mortar' || a === 'rail' || a === 'drone') return 'kinetic';
  if (a === 'flame' || a === 'acid') return 'thermal';
  if (a === 'frost' || a === 'nova' || a === 'gravity') return 'cryo';
  if (a === 'support' || a === 'beam' || a === 'hybrid') {
    if (t === 'fire' || t === 'bio') return 'thermal';
    if (t === 'frost' || t === 'gravity') return 'cryo';
    return 'volt';
  }
  return 'kinetic';
}
function nextTowerUnlocks(n){
  n = n || 4;
  const fams = ['kinetic', 'thermal', 'cryo', 'volt'];
  const out = [];
  for (const fam of fams) {
    for (const k of TOWER_ORDER) {
      const ti = TOWER_INDEX[k];
      if (ti == null || isTowerUnlocked(ti)) continue;
      const def = TOWERS[ti];
      if (towerFamily(def) !== fam) continue;
      out.push(k);
      break;
    }
  }
  return out.slice(0, n);
}

/* ---- 图鉴数据 ---- */
function codexSeen(){
  if (!Array.isArray(PROGRESS.seen)) PROGRESS.seen = [];
  return PROGRESS.seen;
}
function codexDimOf(key){
  for (const d of DIMENSIONS) {
    if (d.boss === key || (d.pool || []).indexOf(key) >= 0) return d;
  }
  return DIMENSIONS[0];
}
function codexType(key){
  return Object.assign({}, ENEMY_TYPES[key] || {}, ENEMY_TRAITS[key] || {});
}
function codexTraits(key){
  const t = codexType(key);
  const a = [];
  if (t.armor) a.push('护甲 ' + Math.round(t.armor * 100) + '%');
  if (t.resist) a.push('全抗 ' + Math.round(t.resist * 100) + '%');
  if (t.ward) {
    const names = [];
    for (const k of Object.keys(t.ward)) names.push(DMG_INFO[k] ? DMG_INFO[k].name : k);
    if (names.length) a.push('抗性 ' + names.join('/'));
  }
  if (t.shield) a.push('护盾 ' + t.shield);
  if (t.regen) a.push('再生 ' + Math.round(t.regen * 1000) / 10 + '%/s');
  if (t.phase) a.push('相位');
  if (t.split) a.push('分裂 ×' + t.split);
  if (t.summon) a.push('召唤');
  if (t.heal) a.push('治疗');
  if (t.boom) a.push('自爆');
  if (t.siege) a.push('压制');
  if (t.disrupt) a.push('干扰');
  if (t.enrage) a.push('狂暴');
  if (t.leech) a.push('汲取');
  if (t.boss) a.push('首领');
  return a.length ? a : ['无特殊抗性'];
}
function codexWeak(key){
  const t = codexType(key);
  if (t.ward) {
    const out = [];
    for (const k of Object.keys(DMG_INFO)) {
      if (!(k in t.ward)) out.push(DMG_INFO[k].name);
      if (out.length >= 2) break;
    }
    if (out.length) return '弱点 · ' + out.join(' / ');
  }
  if (t.phase) return '对策 · 等现身集火；提前减速可拖慢相位期';
  if (t.armor) return '对策 · 穿甲 / 爆破';
  if (t.shield || t.regen) return '对策 · 爆发 / 剧毒';
  if (t.summon || t.heal) return '对策 · 优先点杀 / 范围';
  return '对策 · 集火与减速';
}


/* ---- 能力详解（首次出现简报用） ---- */
function wrapCjk(text, max){
  const out = [];
  let cur = '';
  for (const ch of String(text)) {
    cur += ch;
    if (cur.length >= max) { out.push(cur); cur = ''; }
  }
  if (cur) out.push(cur);
  return out;
}
function codexAbilityDetails(key){
  const t = codexType(key);
  const arr = [];
  const pct = v => Math.round(v * 100) + '%';
  if (t.armor) arr.push({ name: '护甲', text: '物理减伤 ' + pct(t.armor) + '%；能量/虚空仅受其 45% 影响；穿甲/爆破可削弱。' });
  if (t.resist) arr.push({ name: '抗性', text: '所有非真实伤害降低 ' + pct(t.resist) + '。' });
  if (t.ward) {
    const names = [];
    for (const k of Object.keys(t.ward)) names.push((DMG_INFO[k] ? DMG_INFO[k].name : k) + ' -' + pct(t.ward[k]));
    if (names.length) arr.push({ name: '元素抗性', text: names.join('、') + '；换一种伤害类型打。' });
  }
  if (t.shield) arr.push({ name: '护盾', text: '护盾 ' + Math.round(t.shield) + '：优先吸收伤害；脱战 3.2 秒后每秒回充 3.5%。能量伤害 ×1.35，虚空 ×1.2，物理 ×0.85。' });
  if (t.regen) arr.push({ name: '再生', text: '每秒回复最大生命的 ' + (Math.round(t.regen * 1000) / 10) + '%。爆发伤害与剧毒可压制。' });
  if (t.phase) arr.push({ name: '相位', text: '每 5.6 秒相位 2.1 秒：免伤、不可锁定，弹道/连锁/溅射跳过；减速仍生效，等现身集火。' });
  if (t.split) arr.push({ name: '分裂', text: '死亡时分裂出 ' + t.split + ' 只子体：30% 生命、115% 速度，子体不再分裂。' });
  if (t.summon) arr.push({ name: '召唤', text: '每 8 秒召唤 2 只低血量随从；首领每 11 秒召唤 3 只。优先处理召唤者。' });
  if (t.heal) arr.push({ name: '治疗', text: '每 3.2 秒治疗 130 范围内友军 8% 最大生命。优先点杀治疗者或用范围伤害覆盖。' });
  if (t.boom) arr.push({ name: '自爆', text: '被击杀时爆炸，使附近防御塔停火 1.5 秒。尽量远程击杀或在安全距离处理。' });
  if (t.siege) arr.push({ name: '压制', text: '每 5.5 秒压制 190 范围内最近的防御塔 2 秒；首领每 7 秒。用射程或分散站位应对。' });
  if (t.disrupt) arr.push({ name: '干扰', text: '每 ' + t.disrupt + ' 秒干扰一座随机防御塔 1.2 秒（首领 1.8 秒）。保持多塔覆盖。' });
  if (t.enrage) arr.push({ name: '狂暴', text: '生命低于 40% 时移速 +45%。留爆发在残血阶段，或提前减速。' });
  if (t.leech) arr.push({ name: '汲取', text: '突破核心时额外扣除 ' + t.leech + ' 能量。别让它漏过去。' });
  if (!arr.length) arr.push({ name: '无特殊能力', text: '标准单位，集火与减速即可。' });
  return arr;
}

/* ---- 新怪简报（每关开始前） ---- */
function codexStageNewKeys(){
  const g = game;
  const seen = codexSeen();
  const out = [], add = k => { if (k && out.indexOf(k) < 0 && seen.indexOf(k) < 0) out.push(k); };
  for (let w = 1; w <= CAMPAIGN.wavesPerStage; w++) {
    const plan = planWave(g.dimension, w);
    for (const it of plan.list) add(it.key);
  }
  return out;
}
function codexBriefing(){
  const g = game;
  if (!g || g.state !== 'build') return false;
  const keys = codexStageNewKeys();
  if (!keys.length) return false;
  const seen = codexSeen();
  for (const k of keys) if (seen.indexOf(k) < 0) seen.push(k);
  saveProgress();
  g.codexQueue = keys;
  g.codexPage = 0;
  g.codexReturn = 'build';
  g.state = 'briefing';
  return true;
}

if (typeof window !== 'undefined' && window.__AG) {
  window.__AG.confirmLoadout = confirmLoadout;
  window.__AG.codexOpen = openBestiary;
  window.__AG.codexClose = closeBestiary;
  window.__AG.briefingNext = codexNext;
  window.__AG.briefingSkip = codexSkip;
  window.__AG.codexSeen = () => codexSeen().slice();
  window.__AG.codexDetail = key => { if (game) game.codexDetail = key; };
  window.__AG.codexDetailClose = closeCodexDetail;
}
</script>
